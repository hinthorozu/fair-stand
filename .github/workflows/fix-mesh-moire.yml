name: Fix Mesh Perforation Aliasing

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-mesh-moire.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Make mesh holes tiny and angle-stable
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene_path = Path('src/scene3d.js')
          scene = scene_path.read_text(encoding='utf-8')

          replacements = [
              ('Math.max(1, Number(widthM) * 80)', 'Math.max(1, Number(widthM) * 300)'),
              ('Math.max(1, Number(heightM) * 80)', 'Math.max(1, Number(heightM) * 300)'),
              (
                  '    texture.minFilter = THREE.LinearFilter;\n    texture.magFilter = THREE.LinearFilter;',
                  '    texture.generateMipmaps = true;\n    texture.minFilter = THREE.LinearMipmapLinearFilter;\n    texture.magFilter = THREE.LinearFilter;\n    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();',
              ),
              (
                  '        overlayMaterial.alphaTest = 0.45;\n        overlayMaterial.transparent = false;',
                  '        overlayMaterial.alphaTest = 0.45;\n        overlayMaterial.alphaToCoverage = true;\n        overlayMaterial.transparent = false;',
              ),
          ]

          for old, new in replacements:
              count = scene.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly 1 match, got {count}: {old[:80]}')
              scene = scene.replace(old, new, 1)

          scene = scene.replace(
              'Yaklaşık %31 açık alan korunur; delikler fiziksel olarak çok daha küçük ve sık görünür.',
              'Yaklaşık %31 açık alan korunur; delikler yaklaşık 1 mm ölçeğine iner. Mipmap ve alpha-to-coverage açılı bakışta moiré/aliasing desenlerini bastırır.',
              1,
          )
          scene_path.write_text(scene, encoding='utf-8')

          test_path = Path('test/coverModeExclusivity.test.js')
          test = test_path.read_text(encoding='utf-8')
          test_replacements = [
              ('Number\\(widthM\\) \\* 80', 'Number\\(widthM\\) \\* 300'),
              ('Number\\(heightM\\) \\* 80', 'Number\\(heightM\\) \\* 300'),
          ]
          for old, new in test_replacements:
              count = test.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly 1 test match, got {count}: {old}')
              test = test.replace(old, new, 1)

          marker = "  assert.match(scene, /Number\\(heightM\\) \\* 300/);\n"
          extra = (
              marker
              + "  assert.match(scene, /texture\\.minFilter = THREE\\.LinearMipmapLinearFilter/);\n"
              + "  assert.match(scene, /texture\\.anisotropy = renderer\\.capabilities\\.getMaxAnisotropy\\(\\)/);\n"
              + "  assert.match(scene, /overlayMaterial\\.alphaToCoverage = true/);\n"
          )
          if test.count(marker) != 1:
              raise SystemExit('mesh regression marker not found exactly once')
          test = test.replace(marker, extra, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/coverModeExclusivity.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit final Mesh fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mesh-moire.yml
          git add src/scene3d.js test/coverModeExclusivity.test.js
          git commit -m 'fix: shrink mesh holes and suppress angle moire [skip ci]'
          git push origin ROG
