name: Refine Counter Double Panels

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/refine-counter-double-panels.mjs'
      - '.github/workflows/refine-counter-double-panels.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refine-counter-double-panels.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add src/designState.js src/scene3d.js test/counterModule.test.js
          git commit -m "Add stacked panels to framed counters"
          git push
