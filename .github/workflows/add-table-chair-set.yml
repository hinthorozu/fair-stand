name: Add Table Chair Set

on:
  push:
    branches: [ROG]
    paths:
      - scripts/add-table-chair-set.mjs
      - scripts/add-table-chair-set-v2.mjs
      - .github/workflows/add-table-chair-set.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/add-table-chair-set-v2.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git diff --cached --quiet || git commit -m "Add 150x150 table chair set"
          git push origin ROG
