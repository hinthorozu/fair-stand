name: Apply Door Module Patch

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-door-module.mjs
      - .github/workflows/apply-door-module.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-door-module.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/designState.js src/main.js src/moduleDragSidebar.js src/moduleContextMenu.js src/scene3d.js test/designState.test.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/designState.js src/main.js src/moduleDragSidebar.js src/moduleContextMenu.js src/scene3d.js test/designState.test.js
          git commit -m "Add closed editable door module"
          git push origin HEAD:ROG
