name: Fix Counter Flush Panels

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/fix-counter-flush-panels.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-counter-flush-panels.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git diff --cached --quiet || git commit -m "Make counter panels flush with corner posts"
          git push
