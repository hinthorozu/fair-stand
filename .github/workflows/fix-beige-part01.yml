name: Repair Beige Mesh Staging

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-beige-part01.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - name: Repair first payload chunk and retry integration
        shell: bash
        run: |
          cat .github/tmp/beige_mesh_part01a.b64 .github/tmp/beige_mesh_part01b.b64 > .github/tmp/beige_mesh_part01.b64
          test "$(git hash-object .github/tmp/beige_mesh_part01.b64)" = "9340751375246a9068fea3e3ec6d4eea4a2ac7c0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/beige_mesh_part01.b64
          git rm .github/workflows/fix-beige-part01.yml
          git commit -m "chore: repair beige mesh payload [skip ci]"
          git push origin ROG
          printf '\n# retry-after-payload-repair\n' >> .github/workflows/integrate-beige-sofa-glb.yml
          git add .github/workflows/integrate-beige-sofa-glb.yml
          git commit -m "chore: retry beige sofa integration"
          git push origin ROG
