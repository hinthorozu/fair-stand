name: Adjust Plant Catalog Icons

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/adjust-plant-catalog-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Adjust plant preview proportions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/moduleDragSidebar.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (".module-drag-plant { position:relative; width:58px; height:62px; }", ".module-drag-plant { position:relative; width:58px; height:54px; transform:translateY(6px); }"),
              (".module-drag-plant-pot { position:absolute; left:19px; bottom:4px; width:20px; height:14px;", ".module-drag-plant-pot { position:absolute; left:19px; bottom:2px; width:20px; height:14px;"),
              (".module-drag-plant-stem { position:absolute; left:28px; bottom:17px; width:3px; height:28px;", ".module-drag-plant-stem { position:absolute; left:28px; bottom:15px; width:3px; height:22px;"),
              (".module-drag-plant .leaf-a { left:15px; bottom:30px; transform:rotate(22deg); }", ".module-drag-plant .leaf-a { left:15px; bottom:24px; transform:rotate(22deg); }"),
              (".module-drag-plant .leaf-b { left:29px; bottom:34px; transform:scaleX(-1) rotate(22deg); }", ".module-drag-plant .leaf-b { left:29px; bottom:27px; transform:scaleX(-1) rotate(22deg); }"),
              (".module-drag-plant .leaf-c { left:18px; bottom:42px; transform:rotate(38deg); }", ".module-drag-plant .leaf-c { left:18px; bottom:33px; transform:rotate(38deg); }"),
              (".module-drag-plant .leaf-d { left:29px; bottom:47px; transform:scaleX(-1) rotate(38deg); }", ".module-drag-plant .leaf-d { left:29px; bottom:38px; transform:scaleX(-1) rotate(38deg); }"),
              (".module-drag-plant-1 .leaf-d { display:none; }", ".module-drag-plant-1 .leaf-c, .module-drag-plant-1 .leaf-d { display:none; }"),
              (".module-drag-plant-2 .module-drag-plant-stem { height:32px; }", ".module-drag-plant-2 .leaf-d { display:none; }"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact scope
        run: |
          grep -F '.module-drag-plant { position:relative; width:58px; height:54px; transform:translateY(6px); }' src/moduleDragSidebar.js
          grep -F '.module-drag-plant-1 .leaf-c, .module-drag-plant-1 .leaf-d { display:none; }' src/moduleDragSidebar.js
          grep -F '.module-drag-plant-2 .leaf-d { display:none; }' src/moduleDragSidebar.js
          git diff -- src/moduleDragSidebar.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adjust-plant-catalog-icons.yml
          git add src/moduleDragSidebar.js
          git commit -m 'fix: refine plant catalog icons [skip ci]'
          git push origin ROG
