name: Repository Actions Cleanup

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/repository-actions-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove legacy one-shot workflows and patch scripts
        shell: bash
        run: |
          rm -f \
            .github/workflows/add-coat-rack.yml \
            .github/workflows/add-fridge-top-label.yml \
            .github/workflows/add-tv-sizes.yml \
            .github/workflows/add-video-wall-2x2.yml \
            .github/workflows/apply-video-wall-single-image.yml \
            .github/workflows/fix-beige-mesh-render.yml \
            .github/workflows/fix-furniture-ids.yml \
            .github/workflows/fix-kettle-fridge-stack.yml \
            .github/workflows/inspect-tv-object5.yml \
            .github/workflows/inspect-tv-tests.yml \
            .github/workflows/rename-counter-ids.yml \
            .github/workflows/run-video-wall-2x2-patch.yml \
            .github/workflows/tv-screen-direct-v2.yml \
            .github/workflows/tv-screen-final-fix.yml \
            .github/workflows/tv-screen-source-fix.yml \
            .github/workflows/unify-module-catalog.yml \
            .github/workflows/use-direct-beige-glb.yml \
            .github/workflows/video-wall-single-image.yml \
            .github/scripts/add-fridge-top-label.py \
            .github/scripts/catalog-single-source.py \
            .github/scripts/fix-base-wall.js

      - name: Replace Build workflow with canonical CI
        shell: bash
        run: |
          rm -f .github/workflows/build.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [ROG]
            pull_request:
              branches: [ROG]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Test
                  run: npm test

                - name: Build
                  run: npm run build
          YAML

      - name: Verify clean repository state
        run: |
          npm ci
          npm test
          npm run build

      - name: Record checkpoint
        shell: bash
        run: |
          cat >> REPOSITORY_CLEANUP_PROGRESS.md <<'MD'

          ## P0 — GitHub Actions temizliği tamamlandı

          - Eski tek-seferlik `add-*`, `fix-*`, `inspect-*`, `rename-*`, video-wall patch workflow'ları kaldırıldı.
          - `.github/scripts` altındaki geçmiş patch scriptleri kaldırıldı.
          - Eski `build.yml` kaldırıldı.
          - Tek kalıcı workflow olarak `.github/workflows/ci.yml` oluşturuldu.
          - Canonical CI: Node 22 + `npm ci` + `npm test` + `npm run build`.
          - Uygulama kaynak koduna bu temizlik adımında dokunulmadı.
          - Temizlik öncesi test/build doğrulaması başarılı olmadan commit yapılmaz.

          **Sıradaki P0:** `PROJECT_RULES.md`, `ARCHITECTURE_RULES.md` ve `MODULE_BEHAVIOR_STANDARD.md` arasındaki contract drift'i temizlemek.
          MD

      - name: Remove cleanup workflow
        run: rm -f .github/workflows/repository-actions-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean legacy GitHub Actions workflows"
          git push origin ROG
