name: Merge Mobilya Depo Extra

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/merge-mobilya-depo-extra.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge only Mobilya and Depo groups into Extra
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/catalog.js')
          text = path.read_text(encoding='utf-8')
          old = """  Object.freeze({
    label: 'Mobilya',
    keys: Object.freeze(['furniture_sofa_set_classic', 'furniture_table_chair_set_eames', 'furniture_bar_stool_classic']),
  }),
  Object.freeze({
    label: 'Depo',
    keys: Object.freeze(['DEPOT_MINI_FRIDGE_AVANTI', 'DEPOT_KETTLE', 'DEPOT_COAT_RACK']),
  }),"""
          new = """  Object.freeze({
    label: 'Extra',
    keys: Object.freeze(['furniture_sofa_set_classic', 'furniture_table_chair_set_eames', 'furniture_bar_stool_classic', 'DEPOT_MINI_FRIDGE_AVANTI', 'DEPOT_KETTLE', 'DEPOT_COAT_RACK']),
  }),"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exact Mobilya+Depo block once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact catalog change
        run: |
          grep -F "label: 'Extra'" src/catalog.js
          ! grep -F "label: 'Mobilya'" src/catalog.js
          ! grep -F "label: 'Depo'" src/catalog.js
          grep -F "label: 'Elektronik & Aydınlatma'" src/catalog.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/merge-mobilya-depo-extra.yml
          git add src/catalog.js
          git commit -m 'chore: merge furniture and depot into Extra [skip ci]'
          git push origin ROG
