name: Merge Mobilya Depo Extra

on:
  push:
    branches: [ROG]
    paths:
      - .github/workflows/merge-mobilya-depo-extra.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge Mobilya and Depo into Extra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/catalog.js')
          s = p.read_text(encoding='utf-8')
          old = "  Object.freeze({\n    label: 'Mobilya',\n    keys: Object.freeze(['furniture_sofa_set_classic', 'furniture_table_chair_set_eames', 'furniture_bar_stool_classic']),\n  }),\n  Object.freeze({\n    label: 'Depo',\n    keys: Object.freeze(['DEPOT_MINI_FRIDGE_AVANTI', 'DEPOT_KETTLE', 'DEPOT_COAT_RACK']),\n  }),"
          new = "  Object.freeze({\n    label: 'Extra',\n    keys: Object.freeze(['furniture_sofa_set_classic', 'furniture_table_chair_set_eames', 'furniture_bar_stool_classic', 'DEPOT_MINI_FRIDGE_AVANTI', 'DEPOT_KETTLE', 'DEPOT_COAT_RACK']),\n  }),"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          t = Path('test/coatRackModule.test.js')
          q = t.read_text(encoding='utf-8')
          q = q.replace("test('coat rack is a Depo catalog module backed by the supplied GLB'", "test('coat rack is an Extra catalog module backed by the supplied GLB'", 1)
          q = q.replace("const depot = MODULE_CATALOG_GROUPS.find((group) => group.label === 'Depo');", "const extra = MODULE_CATALOG_GROUPS.find((group) => group.label === 'Extra');", 1)
          q = q.replace("assert.ok(depot?.keys.includes('DEPOT_COAT_RACK'));", "assert.ok(extra?.keys.includes('DEPOT_COAT_RACK'));", 1)
          t.write_text(q, encoding='utf-8')
          PY
      - name: Verify exact catalog change
        run: |
          grep -F "label: 'Extra'" src/catalog.js
          if grep -F "label: 'Mobilya'" src/catalog.js; then exit 1; fi
          if grep -F "label: 'Depo'" src/catalog.js; then exit 1; fi
          grep -F "group.label === 'Extra'" test/coatRackModule.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/merge-mobilya-depo-extra.yml
          git add src/catalog.js test/coatRackModule.test.js
          git commit -m 'chore: merge Mobilya and Depo into Extra [skip ci]'
          git push origin ROG
