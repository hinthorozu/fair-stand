name: Fix Beige Chair Axis Exact

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-beige-chair-axis-exact.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-beige-chair-axis-exact.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/fix-beige-chair-axis-exact.py .github/workflows/fix-beige-chair-axis-exact.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: align beige single chairs to stand axes [skip ci]'
          branch: ROG
