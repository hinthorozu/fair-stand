name: Remove stale project image reload once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/remove-stale-project-image-reload-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python scripts/remove-stale-reload-project-images.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          rm .github/workflows/remove-stale-project-image-reload-once.yml
          rm scripts/remove-stale-reload-project-images.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/remove-stale-project-image-reload-once.yml scripts/remove-stale-reload-project-images.py
          git commit -m "Fix project list initialization after refresh"
          git push origin ROG
