name: F012 one-time renderer patch

on:
  push:
    branches:
      - remediation/a03-f012-scene-surround

permissions:
  contents: write

jobs:
  patch-scene-surround:
    if: ${{ !contains(github.event.head_commit.message, '[f012-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/a03-f012-scene-surround
          fetch-depth: 0

      - name: Apply exact F-012 rename
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/scene3d.js')
          text = path.read_text(encoding='utf-8')
          import_anchor = "import { formatPlacementFeedbackMessage, hasPlacementFeedbackPointer } from './placementFeedback.js';\n"
          old_declaration = 'const STAGE_SURROUND_M = 1;\n'

          assert text.count(import_anchor) == 1, 'placementFeedback import anchor changed'
          assert text.count(old_declaration) == 1, 'STAGE_SURROUND_M declaration changed'
          assert text.count('STAGE_SURROUND_M') == 12, 'unexpected STAGE_SURROUND_M occurrence count'
          assert 'SCENE_SURROUND_M' not in text, 'scene3d.js already contains SCENE_SURROUND_M'

          text = text.replace(
              import_anchor,
              import_anchor + "import { SCENE_SURROUND_M } from './sceneDimensions.js';\n",
          )
          text = text.replace(old_declaration, '')
          text = text.replace('STAGE_SURROUND_M', 'SCENE_SURROUND_M')

          assert 'STAGE_SURROUND_M' not in text
          assert text.count('SCENE_SURROUND_M') == 12
          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/f012-one-time-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js .github/workflows/f012-one-time-patch.yml
          git commit -m "[f012-patched] Use canonical scene surround in renderer"
          git push origin HEAD:remediation/a03-f012-scene-surround
