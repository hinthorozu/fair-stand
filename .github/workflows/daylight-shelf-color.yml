name: Daylight Shelf Color

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/daylight-shelf-color.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply daylight shelf color
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('src/scene3d.js')
          s = scene.read_text(encoding='utf-8')
          replacements = {
              'color: 0xffffff,\n          emissive: 0xeaf6ff,': 'color: 0xfff6e8,\n          emissive: 0xffddb5,',
              '        0xf4fbff,\n        8.5,': '        0xffe4c8,\n        8.5,',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'marker not found: {old!r}')
              s = s.replace(old, new, 1)
          scene.write_text(s, encoding='utf-8')

          test = Path('test/shelfLighting.test.js')
          t = test.read_text(encoding='utf-8')
          t = t.replace('assert.match(source, /color: 0xffffff/);', 'assert.match(source, /color: 0xfff6e8/);')
          t = t.replace('assert.match(source, /emissive: 0xeaf6ff/);', 'assert.match(source, /emissive: 0xffddb5/);')
          t = t.replace('assert.match(source, /0xf4fbff/);', 'assert.match(source, /0xffe4c8/);')
          test.write_text(t, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/shelfLighting.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/daylight-shelf-color.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js test/shelfLighting.test.js .github/workflows/daylight-shelf-color.yml
          git commit -m "fix: use daylight shelf lighting [skip ci]"
          git push origin ROG
