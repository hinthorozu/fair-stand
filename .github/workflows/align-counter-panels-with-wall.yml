name: Align Counter Panels With Wall
on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/align-counter-panels-with-wall.mjs'
      - '.github/workflows/align-counter-panels-with-wall.yml'
jobs:
  align:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/align-counter-panels-with-wall.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git commit -m "Match counter panel spacing to wall panels"
          git push
