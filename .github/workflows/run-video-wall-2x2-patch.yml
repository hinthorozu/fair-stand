name: Run video wall 2x2 patch
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/run-video-wall-2x2-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/patch-video-wall-2x2.cjs
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog.js src/designState.js src/main.js src/scene3d.js src/moduleDragSidebar.js
          git commit -m "Add 2x2 55-inch video wall to catalog"
          git push origin ROG
