name: Use Direct Beige GLB

on:
  push:
    branches:
      - ROG
    paths:
      - .github/workflows/use-direct-beige-glb.yml
      - .github/scripts/use_direct_beige_glb.py
      - .github/beige-upload/**

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply direct GLB patch
        run: python3 .github/scripts/use_direct_beige_glb.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/scene3d.js public/models
          git commit -m "fix: load beige sofa set directly from GLB [skip ci]"
          git push origin ROG
