name: Use Direct Beige GLB

on:
  push:
    branches:
      - ROG
    paths:
      - .github/workflows/use-direct-beige-glb.yml
      - .github/scripts/use_direct_beige_glb.py
      - .github/beige-upload/**

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble verified GLB payload
        run: |
          mkdir -p /tmp/beige-parts
          cp .github/beige-upload/part00.b64 /tmp/beige-parts/part00.b64
          cp .github/beige-upload/missing-a1.b64 /tmp/beige-parts/part01.b64
          cp .github/beige-upload/missing-a2.b64 /tmp/beige-parts/part02.b64
          cp .github/beige-upload/missing-a3.b64 /tmp/beige-parts/part03.b64
          cp .github/beige-upload/missing-a4.b64 /tmp/beige-parts/part04.b64
          cp .github/beige-upload/part01.b64 /tmp/beige-parts/part05.b64
          cp .github/beige-upload/missing-b1.b64 /tmp/beige-parts/part06.b64
          cp .github/beige-upload/missing-b2.b64 /tmp/beige-parts/part07.b64
          cp .github/beige-upload/part02.b64 /tmp/beige-parts/part08.b64
          cp .github/beige-upload/part03.b64 /tmp/beige-parts/part09.b64
          rm -f .github/beige-upload/part*.b64
          cp /tmp/beige-parts/part*.b64 .github/beige-upload/
      - name: Apply native GLB patch
        run: python3 .github/scripts/use_direct_beige_glb.py
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/scene3d.js public/models
          git commit -m "fix: load beige sofa set directly from GLB [skip ci]"
          git push origin ROG
