name: Fix project asset restore once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-project-asset-restore-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: python scripts/fix-project-asset-restore.py
      - run: npm test
      - run: npm run build

      - name: Commit and push
        run: |
          rm .github/workflows/fix-project-asset-restore-once.yml
          rm scripts/fix-project-asset-restore.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/fix-project-asset-restore-once.yml scripts/fix-project-asset-restore.py
          git commit -m "Load project assets before scene rebuild"
          git push origin ROG
