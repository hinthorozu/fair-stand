name: Ctrl Corner Tolerance Fix

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_ctrl_corner_tolerance.py'
      - '.github/workflows/ctrl-corner-tolerance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_ctrl_corner_tolerance.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm scripts/patch_ctrl_corner_tolerance.py
          rm .github/workflows/ctrl-corner-tolerance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rectSelection.js test/rectSelection.test.js scripts/patch_ctrl_corner_tolerance.py .github/workflows/ctrl-corner-tolerance-fix.yml
          git commit -m "fix: allow ctrl selection across panel-depth corner offsets [skip ci]"
          git push origin ROG
