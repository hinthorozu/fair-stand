name: Fix Project Import

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-project-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply import patch
        run: python3 scripts/fix-project-import.py
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check test/projectImportFlow.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          rm -f scripts/fix-project-import.py .github/workflows/fix-project-import.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js test/projectImportFlow.test.js scripts/fix-project-import.py .github/workflows/fix-project-import.yml
          git commit -m "fix: make project import failure-safe [skip ci]"
          git push origin ROG
