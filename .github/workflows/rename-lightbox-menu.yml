name: Lightbox Terminology Update

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/rename-lightbox-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update menu terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/moduleContextMenu.js'): {
                  'Cam panele çevir': 'Cam Panele Çevir',
                  'Normal panele çevir': 'Normal Panele Çevir',
                  'Beze çevir': 'Lightbox Kumaşa Çevir',
                  'Bezden çıkar': 'Lightbox Kumaştan Çıkar',
              },
              Path('src/helpGuide.js'): {
                  'Cam panele çevir': 'Cam Panele Çevir',
                  'Normal panele çevir': 'Normal Panele Çevir',
                  'Beze çevir': 'Lightbox Kumaşa Çevir',
                  'Bezden çıkar': 'Lightbox Kumaştan Çıkar',
              },
              Path('test/lightboxFabric.test.js'): {
                  '/Beze çevir/': '/Lightbox Kumaşa Çevir/',
                  '/Bezden çıkar/': '/Lightbox Kumaştan Çıkar/',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check src/moduleContextMenu.js
          node --check src/helpGuide.js
          node --check test/lightboxFabric.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rename-lightbox-menu.yml
          git add src/moduleContextMenu.js src/helpGuide.js test/lightboxFabric.test.js
          git commit -m 'fix: rename panel and lightbox menu labels [skip ci]'
          git push origin ROG
