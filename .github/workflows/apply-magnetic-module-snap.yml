name: Apply Magnetic Module Snap

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-magnetic-module-snap.mjs
      - .github/workflows/apply-magnetic-module-snap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply magnetic snap patch
        run: node scripts/apply-magnetic-module-snap.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modulePlacement.js src/scene3d.js test/modulePlacement.test.js
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Add magnetic module snap"
          git push origin ROG
