name: Fix Bar Stool Real Ghost
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-bar-stool-real-ghost.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-bar-stool-real-ghost.py
      - run: node --check src/moduleDragSidebar.js
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "Bar Taburesi uses the actual GLB geometry" src/scene3d.js
          grep -n "module-drag-bar-stool::before" src/moduleDragSidebar.js
          grep -n "moduleState?.type === 'bar-stool'" src/scene3d.js
      - run: rm -f .github/scripts/fix-bar-stool-real-ghost.py .github/workflows/fix-bar-stool-real-ghost.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: use real bar stool GLB ghost and restore old icon [skip ci]'
          branch: ROG
