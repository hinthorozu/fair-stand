name: Add L Counter 100
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-l-counter-100.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run migration
        run: |
          sed -i 's/${/\\${/g' .github/scripts/add-l-counter-100.js
          node --input-type=commonjs < .github/scripts/add-l-counter-100.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/scene3d.js')
          s=p.read_text()
          a=s.index('function createLCounterModule(')
          b=s.index('function createCounterModule(', a)
          block=s[a:b]
          s=s[:a]+s[b:]
          c=s.index('function createShelfModule(')
          s=s[:c]+block+s[c:]
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - name: Commit result
        run: |
          rm -f .github/workflows/add-l-counter-100.yml .github/scripts/add-l-counter-100.js
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add -A
          git commit -m "feat: add 100x100 L counter [skip ci]"
          git push origin ROG
