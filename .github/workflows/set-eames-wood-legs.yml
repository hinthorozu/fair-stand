name: Set Eames Wooden Legs
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/set-eames-wood-legs.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/set-eames-wood-legs.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/set-eames-wood-legs.py .github/workflows/set-eames-wood-legs.yml .github/scripts/inspect-eames-glb.py .github/workflows/inspect-eames-glb.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: set Eames chair legs to wood [skip ci]'
          branch: ROG
