name: Add Counter Modules

on:
  push:
    branches: [ROG]
    paths:
      - scripts/add-counter-modules.mjs
      - .github/workflows/add-counter-modules.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply banko module implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/add-counter-modules.mjs')
          text = path.read_text()
          old = """    3,\n    'scene validation counter depth',\n  );"""
          new = """    1,\n    'scene validation counter depth',\n  );"""
          if old not in text:
              raise SystemExit('scene validation counter depth marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/add-counter-modules.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scene3d.js')
          text = path.read_text()
          old = "        widthCm: moduleState.widthCm,\n        moduleId: moduleState.id,\n"
          new = "        widthCm: moduleState.widthCm,\n        depthCm: moduleState.depthCm,\n        moduleId: moduleState.id,\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 inner validation blocks, found {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md
          git diff --cached --quiet || git commit -m "Add configurable banko modules"
          git push origin ROG
