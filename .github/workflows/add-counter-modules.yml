name: Add Counter Modules

on:
  push:
    branches: [ROG]
    paths:
      - scripts/add-counter-modules.mjs
      - .github/workflows/add-counter-modules.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply banko module implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/add-counter-modules.mjs')
          text = path.read_text()
          replacements = [
              ("""    3,\n    'scene validation counter depth',\n  );""", """    1,\n    'scene validation counter depth',\n  );"""),
              ("""    2,\n    'scene snap counter footprint',\n  );""", """    4,\n    'scene snap counter footprint',\n  );"""),
              ("""    2,\n    'scene ignore counters as magnetic targets',\n  );""", """    4,\n    'scene ignore counters as magnetic targets',\n  );"""),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'patch marker not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node scripts/add-counter-modules.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/scene3d.js')
          text = path.read_text()

          old = "        widthCm: moduleState.widthCm,\n        moduleId: moduleState.id,\n"
          new = "        widthCm: moduleState.widthCm,\n        depthCm: moduleState.depthCm,\n        moduleId: moduleState.id,\n"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 inner validation blocks, found {count}')
          text = text.replace(old, new)

          pattern = re.compile(r"(const validation = validatePlacementAgainstModules\(\{.*?)(modules: renderedModules\.filter\(\(module\) => module\.type !== 'counter'\),)(.*?\}\);)", re.S)
          text, restored = pattern.subn(lambda m: m.group(1) + 'modules: renderedModules,' + m.group(3), text)
          if restored != 2:
              raise SystemExit(f'expected to restore 2 validation collision lists, restored {restored}')

          path.write_text(text)
          PY
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md
          git diff --cached --quiet || git commit -m "Add configurable banko modules"
          git push origin ROG
