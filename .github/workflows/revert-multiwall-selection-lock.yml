name: Revert Multi-wall Selection Lock

on:
  push:
    branches: [ROG]
    paths:
      - scripts/revert-multiwall-selection-lock.mjs
      - .github/workflows/revert-multiwall-selection-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Revert multi-wall selection lock
        run: node scripts/revert-multiwall-selection-lock.mjs
      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rectSelection.js src/scene3d.js test/rectSelection.test.js ROADMAP.md
          git diff --cached --quiet || git commit -m "Allow multi-panel selection across corners"
          git push origin ROG
