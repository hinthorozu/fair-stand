name: Fix TV Catalog Icon
on:
  push:
    branches: [ROG]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/fix-tv-catalog-icon.py
      - run: node --check src/moduleDragSidebar.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f scripts/fix-tv-catalog-icon.py .github/workflows/fix-tv-catalog-icon.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: show TV silhouette in module catalog [skip ci]"
