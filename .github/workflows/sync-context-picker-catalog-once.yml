name: Sync context picker catalog once
on:
  push:
    branches: [ROG]
    paths:
      - scripts/sync-context-picker-catalog.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/sync-context-picker-catalog.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/moduleContextMenu.js
          git commit -m "Keep context picker catalog in sync with module sidebar"
          git push
