name: Resize video walls to 49 inch panels
'on':
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/resize-video-walls-49.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/resize-video-walls-49.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/resize-video-walls-49.yml scripts/resize-video-walls-49.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog.js .github/workflows/resize-video-walls-49.yml scripts/resize-video-walls-49.cjs
          git commit -m "Resize video walls to 49 inch panels"
          git push origin ROG
