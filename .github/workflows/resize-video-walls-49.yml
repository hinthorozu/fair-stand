name: Resize video walls to 49 inch panels
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/resize-video-walls-49.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resize video wall catalog geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/catalog.js')
          s=p.read_text()
          start=s.index('  VIDEO_WALL_2X2: Object.freeze({')
          end=s.index('  TV_65: createTvCatalogItem', start)
          block="""  VIDEO_WALL_2X2: Object.freeze({
    ...createTvCatalogItem(TV_55_DEFINITION),
    widthCm: 108.5 * 2,
    heightCm: 61 * 2,
    screenWidthCm: 108.5 * 2,
    screenHeightCm: 61 * 2,
    panelScreenWidthCm: 108.5,
    panelScreenHeightCm: 61,
    videoWallRows: 2,
    videoWallCols: 2,
    label: 'Video Wall 2×2',
  }),
  VIDEO_WALL_3X3: Object.freeze({
    ...createTvCatalogItem(TV_55_DEFINITION),
    widthCm: 108.5 * 3,
    heightCm: 61 * 3,
    screenWidthCm: 108.5 * 3,
    screenHeightCm: 61 * 3,
    panelScreenWidthCm: 108.5,
    panelScreenHeightCm: 61,
    videoWallRows: 3,
    videoWallCols: 3,
    label: 'Video Wall 3×3',
  }),
"""
          p.write_text(s[:start]+block+s[end:])
          PY
      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/resize-video-walls-49.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog.js .github/workflows/resize-video-walls-49.yml
          git commit -m "Resize video walls to 49 inch panels"
          git push origin ROG
