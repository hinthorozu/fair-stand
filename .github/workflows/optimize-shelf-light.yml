name: Optimize Shelf Lighting

on:
  push:
    branches:
      - ROG

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch shelf lighting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('src/scene3d.js')
          s = scene.read_text(encoding='utf-8')
          start = s.index('function createShelfModule(')
          end = s.index('\nfunction createFlatPanelModule', start)
          chunk = s[start:end]

          old_light = '''      // Geniş alan ışığı spot konisini kaldırır ve raf eni boyunca homojen yayılır.
      const areaLight = new THREE.RectAreaLight(
        0xffe4c8,
        28.0,
        ledStripWidthM,
        Math.max(shelfDepthM * 0.95, 0.18),
      );
      areaLight.position.set(
        0,
        shelfBottomY - 0.006,
        wallDepthM / 2 + shelfDepthM * 0.54,
      );
      areaLight.lookAt(new THREE.Vector3(
        0,
        shelfBottomY - 0.55,
        wallDepthM / 2 + shelfDepthM * 0.20,
      ));
      areaLight.userData.kind = 'decoration';
      areaLight.userData.role = 'shelf-under-light';
      built.group.add(areaLight);
'''
          if old_light not in chunk:
              raise SystemExit('per-shelf area light block not found')
          chunk = chunk.replace(old_light, '', 1)

          end_marker = '''  });

  return built;
}'''
          shared_light = '''  });

  // Performans: her raf yerine modül başına tek gerçek alan ışığı.
  // Nötr beyaz yüzey rengini sarartmadan yalnızca aydınlığı artırır.
  if (shelfLightingOn && shelfHeightsCm.length > 0) {
    const averageShelfHeightM = shelfHeightsCm.reduce(
      (sum, value) => sum + Number(value),
      0,
    ) / shelfHeightsCm.length / 100;
    const areaLight = new THREE.RectAreaLight(
      0xffffff,
      14.0,
      Math.max(innerWidthM - 0.04, 0.08),
      Math.max(shelfDepthM * 1.15, 0.22),
    );
    areaLight.position.set(
      0,
      averageShelfHeightM - 0.008,
      wallDepthM / 2 + shelfDepthM * 0.54,
    );
    areaLight.lookAt(new THREE.Vector3(
      0,
      Math.max(averageShelfHeightM - 0.48, 0.05),
      wallDepthM / 2 + shelfDepthM * 0.20,
    ));
    areaLight.userData.kind = 'decoration';
    areaLight.userData.role = 'shelf-under-light';
    built.group.add(areaLight);
  }

  return built;
}'''
          if end_marker not in chunk:
              raise SystemExit('shelf function end marker not found')
          chunk = chunk.replace(end_marker, shared_light, 1)
          s = s[:start] + chunk + s[end:]
          scene.write_text(s, encoding='utf-8')

          test = Path('test/shelfLighting.test.js')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              "  assert.match(source, /0xffe4c8/);\n",
              "  assert.match(source, /0xffffff/);\n  assert.match(source, /averageShelfHeightM/);\n",
              1,
          )
          test.write_text(t, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/shelfLighting.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/optimize-shelf-light.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js test/shelfLighting.test.js .github/workflows/optimize-shelf-light.yml
          git commit -m "perf: neutralize and optimize shelf lighting [skip ci]"
          git push origin ROG
