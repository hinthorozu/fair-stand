name: Shelf Glow Fix
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/optimize-shelf-light.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text(encoding='utf-8')
          old = """      // Geniş alan ışığı spot konisini kaldırır ve raf eni boyunca homojen yayılır.
      const areaLight = new THREE.RectAreaLight(
        0xffe4c8,
        28.0,
        ledStripWidthM,
        Math.max(shelfDepthM * 0.95, 0.18),
      );
      areaLight.position.set(
        0,
        shelfBottomY - 0.006,
        wallDepthM / 2 + shelfDepthM * 0.54,
      );
      areaLight.lookAt(new THREE.Vector3(
        0,
        shelfBottomY - 0.55,
        wallDepthM / 2 + shelfDepthM * 0.20,
      ));
      areaLight.userData.kind = 'decoration';
      areaLight.userData.role = 'shelf-under-light';
      built.group.add(areaLight);
"""
          new = """      // Performanslı raf altı parlama: gerçek ışık yok, duvar ve malzeme renklerini etkilemez.
      const glowDepthM = Math.max(shelfDepthM * 0.88, 0.16);
      const underGlow = new THREE.Mesh(
        new THREE.PlaneGeometry(ledStripWidthM, glowDepthM),
        new THREE.MeshBasicMaterial({
          color: 0xfff4df,
          transparent: true,
          opacity: 0.22,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
        }),
      );
      underGlow.rotation.x = -Math.PI / 2;
      underGlow.position.set(
        0,
        shelfBottomY - 0.010,
        wallDepthM / 2 + shelfDepthM * 0.56,
      );
      underGlow.userData.kind = 'decoration';
      underGlow.userData.role = 'shelf-under-light';
      built.group.add(underGlow);
"""
          if old not in s:
              raise SystemExit('shelf area light block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Check
        run: |
          node --check src/scene3d.js
          npm ci
          npm test
          npm run build
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/optimize-shelf-light.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js .github/workflows/optimize-shelf-light.yml
          git commit -m "perf: confine shelf glow under shelves [skip ci]"
          git push origin ROG
