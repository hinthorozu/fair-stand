name: Add Long Planter 100

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-long-planter-100.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Patch Uzun Saksı 100
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Bulunamadı: {path}\n---\n{old}")
              p.write_text(text.replace(old, new, 1))
              print("OK:", path)

          patch(
              "src/catalog.js",
              "  EXTRA_INDOOR_PLANT_1: { type: 'indoor-plant-1', widthCm: 60, depthCm: 60, heightCm: 120, label: 'Yapay Çiçek 1' },",
              """  EXTRA_INDOOR_PLANT_1: { type: 'indoor-plant-1', widthCm: 60, depthCm: 60, heightCm: 120, label: 'Yapay Çiçek 1' },
            EXTRA_LONG_PLANTER_100: {
              type: 'indoor-plant-1',
              widthCm: 100,
              depthCm: 30,
              heightCm: 30,
              modelFile: 'saksi_bitkili_100x30x30.glb',
              modelRotationYDeg: 90,
              preserveModelScale: true,
              label: 'Uzun Saksı 100',
            },"""
          )

          patch(
              "src/catalog.js",
              "  'EXTRA_INDOOR_PLANT_1',\n  'TV_42',",
              "  'EXTRA_INDOOR_PLANT_1',\n  'EXTRA_LONG_PLANTER_100',\n  'TV_42',"
          )

          patch(
              "src/catalog.js",
              "'DEPOT_COAT_RACK', 'EXTRA_INDOOR_PLANT_1'])",
              "'DEPOT_COAT_RACK', 'EXTRA_INDOOR_PLANT_1', 'EXTRA_LONG_PLANTER_100'])"
          )

          patch(
              "src/designState.js",
              """export function createIndoorPlantModuleState() {
            return {
              id: createId('module'),
              type: 'indoor-plant-1',
              widthCm: 60,
              depthCm: 60,
              heightCm: 120,
            };
          }""",
              """export function createIndoorPlantModuleState(descriptor = {}) {
            return {
              id: createId('module'),
              type: 'indoor-plant-1',
              widthCm: Number(descriptor.widthCm) || 60,
              depthCm: Number(descriptor.depthCm) || 60,
              heightCm: Number(descriptor.heightCm) || 120,
              modelFile: descriptor.modelFile ?? 'indoor_plants.glb',
              modelRotationYDeg: Number(descriptor.modelRotationYDeg) || 0,
              preserveModelScale: Boolean(descriptor.preserveModelScale),
            };
          }"""
          )

          patch(
              "src/main.js",
              "else if (module.type === 'indoor-plant-1') state = createIndoorPlantModuleState();",
              "else if (module.type === 'indoor-plant-1') state = createIndoorPlantModuleState(module);"
          )

          patch(
              "src/scene3d.js",
              "  const modelFile = 'indoor_plants.glb';",
              "  const modelFile = moduleState.modelFile ?? 'indoor_plants.glb';"
          )

          patch(
              "src/scene3d.js",
              """    const sourceBox = new THREE.Box3().setFromObject(model);
              const sourceSize = sourceBox.getSize(new THREE.Vector3());
              const fitScales = [
                sourceSize.x > 0 ? widthM / sourceSize.x : Infinity,
                sourceSize.y > 0 ? heightM / sourceSize.y : Infinity,
                sourceSize.z > 0 ? depthM / sourceSize.z : Infinity,
              ].filter((value) => Number.isFinite(value) && value > 0);
              const uniformScale = fitScales.length ? Math.min(...fitScales) : 1;
              model.scale.setScalar(uniformScale);
          
              const fittedBox = new THREE.Box3().setFromObject(model);""",
              """    model.rotation.y = THREE.MathUtils.degToRad(Number(moduleState.modelRotationYDeg) || 0);
              model.updateMatrixWorld(true);
          
              const sourceBox = new THREE.Box3().setFromObject(model);
              const sourceSize = sourceBox.getSize(new THREE.Vector3());
          
              if (!moduleState.preserveModelScale) {
                const fitScales = [
                  sourceSize.x > 0 ? widthM / sourceSize.x : Infinity,
                  sourceSize.y > 0 ? heightM / sourceSize.y : Infinity,
                  sourceSize.z > 0 ? depthM / sourceSize.z : Infinity,
                ].filter((value) => Number.isFinite(value) && value > 0);
                const uniformScale = fitScales.length ? Math.min(...fitScales) : 1;
                model.scale.setScalar(uniformScale);
                model.updateMatrixWorld(true);
              }
          
              const fittedBox = new THREE.Box3().setFromObject(model);"""
          )
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-long-planter-100.yml
          git add src/catalog.js src/designState.js src/main.js src/scene3d.js
          git commit -m "feat: add Uzun Saksı 100 catalog module"
          git push origin ROG
