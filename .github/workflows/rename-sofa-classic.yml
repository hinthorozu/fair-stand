name: Rename Sofa Classic IDs
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/rename-sofa-classic.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/rename-sofa-classic.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/rename-sofa-classic.py .github/workflows/rename-sofa-classic.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'refactor: rename sofa ids to classic [skip ci]'
          branch: ROG
