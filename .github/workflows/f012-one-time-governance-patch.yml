name: F012 one-time governance patch

on:
  push:
    branches:
      - remediation/a03-f012-scene-surround

permissions:
  contents: write

jobs:
  patch-source-domain-map:
    if: ${{ !contains(github.event.head_commit.message, '[f012-governance-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/a03-f012-scene-surround
          fetch-depth: 0

      - name: Classify sceneDimensions source ownership
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/systemChangeContract.js')
          text = path.read_text(encoding='utf-8')
          anchor = "  'src/scene3d.js': frozenDomains('renderer', 'state', 'placement', 'behavior', 'performance'),\n"
          entry = "  'src/sceneDimensions.js': frozenDomains('architecture', 'renderer', 'placement', 'composition'),\n"

          assert text.count(anchor) == 1, 'scene3d source-domain anchor changed'
          assert 'src/sceneDimensions.js' not in text, 'sceneDimensions.js already classified'

          text = text.replace(anchor, anchor + entry)

          assert text.count('src/sceneDimensions.js') == 1
          path.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/f012-one-time-governance-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systemChangeContract.js .github/workflows/f012-one-time-governance-patch.yml
          git commit -m "[f012-governance-patched] Classify scene surround source"
          git push origin HEAD:remediation/a03-f012-scene-surround
