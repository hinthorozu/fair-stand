name: Refactor TV Family Retry

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/refactor-tv-family-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix retry patch matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/refactor-tv-family.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          for i, line in enumerate(lines):
              if line.startswith('old = ') and "moduleState?.type === 'tv'" in line and "TV 42" in line:
                  lines[i] = '''old = """    if (moduleState?.type === 'tv') return 'TV 42"';"""'''
                  if i + 1 < len(lines) and lines[i + 1].startswith('new = '):
                      lines[i + 1] = '''new = """    if (moduleState?.type === 'tv') return `TV ${Number(moduleState.sizeInch) || 42}"`;"""'''
                  break
          else:
              raise SystemExit('TV drag label matcher assignment not found in patch script')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply patch
        run: python scripts/refactor-tv-family.py
      - name: Syntax check
        run: |
          node --check src/tvConfig.js
          node --check src/catalog.js
          node --check src/designState.js
          node --check src/scene3d.js
          node --check src/main.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Cleanup temporary patch files
        run: rm -f scripts/refactor-tv-family.py .github/workflows/refactor-tv-family.yml .github/workflows/refactor-tv-family-retry.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'refactor: derive 55 and 65 inch TVs from TV 42 [skip ci]'
          git push origin ROG
