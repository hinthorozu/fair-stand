name: Standardize Ghost Behavior
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/standardize-ghost-behavior.yml']
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/standardize-ghost-behavior.py
      - run: node --check src/moduleBehavior.js
      - run: node --check src/scene3d.js
      - run: node --check tests/moduleBehavior.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "getModuleGhostBehavior" src/moduleBehavior.js src/scene3d.js
          grep -n "renderer: 'bar-stool'" src/moduleBehavior.js
          grep -n "safe proxy ghost" tests/moduleBehavior.test.js
      - run: rm -f .github/scripts/standardize-ghost-behavior.py .github/workflows/standardize-ghost-behavior.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'refactor: standardize module ghost behavior [skip ci]'
          branch: ROG
