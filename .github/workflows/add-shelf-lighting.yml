name: Add Shelf Lighting

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-shelf-lighting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 .github/scripts/add-shelf-lighting.py
      - name: Syntax check
        run: |
          node --check src/designState.js
          node --check src/scene3d.js
          node --check src/moduleContextMenu.js
          node --check src/main.js
          node --check test/shelfLighting.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f .github/workflows/add-shelf-lighting.yml .github/scripts/add-shelf-lighting.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/designState.js src/scene3d.js src/moduleContextMenu.js src/main.js test/shelfLighting.test.js .github/workflows/add-shelf-lighting.yml .github/scripts/add-shelf-lighting.py
          git commit -m "feat: add shelf under-lighting toggle [skip ci]"
          git push origin ROG
