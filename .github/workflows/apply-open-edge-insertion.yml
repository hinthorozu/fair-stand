name: Apply Open Edge Insertion Patch

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-open-edge-insertion.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-open-edge-insertion.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/wallReflow.js src/main.js test/moduleMove.test.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wallReflow.js src/main.js test/moduleMove.test.js
          git commit -m "Support open edge insertion and auto wall length"
          git push origin HEAD:ROG
