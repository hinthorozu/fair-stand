name: Foam Bloom
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/foam-bloom.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/foam-bloom.cjs
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/foam-bloom.yml .github/scripts/foam-bloom.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js .github/workflows/foam-bloom.yml .github/scripts/foam-bloom.cjs
          git commit -m "Add bloom halo for illuminated foam"
          git push origin ROG
