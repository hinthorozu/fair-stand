name: Fix Procedural TV Visual
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-procedural-tv-visual.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/fix-procedural-tv-visual.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f scripts/fix-procedural-tv-visual.py .github/workflows/fix-procedural-tv-visual.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make procedural TV front and back distinct [skip ci]'
          branch: ROG
# rerun: 2
