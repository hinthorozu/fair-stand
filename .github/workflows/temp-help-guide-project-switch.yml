name: Temporary help guide project switch update

on:
  push:
    branches:
      - docs/help-guide-project-switch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/help-guide-project-switch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update project switching help
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/helpGuide.js')
          text = path.read_text()
          old = """        <li><strong>Otomatik kayıt:</strong> Kayıtlı/açılmış projede değişiklik algılandıktan yaklaşık 5 saniye sonra çalışır.</li>\n        <li><strong>Aç:</strong> Kayıtlı projeyi görselleriyle birlikte yükler.</li>\n        <li><strong>Dışarı Aktar:</strong> Proje ve görselleri ZIP dosyasına paketler.</li>"""
          new = """        <li><strong>Otomatik kayıt:</strong> Kayıtlı/açılmış projede değişiklik algılandıktan yaklaşık 5 saniye sonra çalışır.</li>\n        <li><strong>Kayıtlı projeler:</strong> Dropdown'dan aktif projeden farklı bir proje seçildiğinde sistem <strong>\"[mevcut proje] projeden [seçilen proje] projeye geçilecek\"</strong> uyarısını gösterir. Onay verilirse seçilen proje açılır; iptal edilirse dropdown tekrar aktif projeye döner.</li>\n        <li><strong>Aç:</strong> Dropdown'da seçili kayıtlı projeyi görselleriyle birlikte yükler. Dropdown üzerinden onaylı geçiş ile aynı proje açma akışını kullanır.</li>\n        <li><strong>Dışarı Aktar:</strong> Proje ve görselleri ZIP dosyasına paketler.</li>"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one project guide anchor, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit guide update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/helpGuide.js
          git commit -m "Document project dropdown switching"
          git push origin HEAD:docs/help-guide-project-switch
