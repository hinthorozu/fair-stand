name: Fix Catalog Continuous Wall Append
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-catalog-append-continuous-wall.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-catalog-append-continuous-wall.py
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/fix-catalog-append-continuous-wall.py .github/workflows/fix-catalog-append-continuous-wall.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: use continuous wall chain for catalog append [skip ci]'
          branch: ROG
