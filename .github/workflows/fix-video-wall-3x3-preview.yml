name: Fix 3x3 video wall catalog preview
'on':
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-video-wall-3x3-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-video-wall-3x3-preview.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/fix-video-wall-3x3-preview.yml scripts/fix-video-wall-3x3-preview.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/moduleDragSidebar.js .github/workflows/fix-video-wall-3x3-preview.yml scripts/fix-video-wall-3x3-preview.cjs
          git commit -m "Show 3x3 grid in video wall catalog preview"
          git push origin ROG
