name: Remove Beige Scale 1.25
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/remove-beige-scale-125.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Remove 1.25 multiplier
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text()
          old = "? (placement.targetWidthM / orientedSize.x) * 1.25\n        : 1.25;"
          new = "? (placement.targetWidthM / orientedSize.x)\n        : 1;"
          if old not in s:
              raise SystemExit('target scale block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit
        run: |
          rm .github/workflows/remove-beige-scale-125.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: remove beige sofa 1.25 scale multiplier [skip ci]"
          git push