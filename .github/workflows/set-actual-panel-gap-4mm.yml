name: Set Actual Panel Gap 4mm

on:
  push:
    branches: [ROG]
    paths:
      - scripts/set-actual-panel-gap-4mm.mjs
      - .github/workflows/set-actual-panel-gap-4mm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply actual 4 mm panel gap
        run: node scripts/set-actual-panel-gap-4mm.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js Changelog.md
          git diff --cached --quiet || git commit -m "Set actual panel gaps to 4mm"
          git push origin ROG
