name: Fix Free Module Drag Anchor
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-free-module-drag-anchor.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/fix-free-module-drag-anchor.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/fix-free-module-drag-anchor.py .github/workflows/fix-free-module-drag-anchor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: anchor free module drag to picked point [skip ci]"
          git push
