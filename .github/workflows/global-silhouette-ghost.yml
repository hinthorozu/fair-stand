name: Global Silhouette Ghost

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/global-silhouette-ghost.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply singleton silhouette ghost rule
        run: python3 .github/scripts/apply-global-silhouette-ghost.py

      - name: Verify migration shape
        run: |
          grep -n "kind: 'silhouette'" src/moduleBehavior.js
          grep -n "function createRenderableModule" src/scene3d.js
          grep -n "function destroyPlacementGhost" src/scene3d.js
          grep -n "placementGhost = createPlacementGhost" src/scene3d.js
          if grep -n "placementGhostTemplates" src/scene3d.js; then exit 1; fi
          if grep -n "ghostBehavior.renderer ===" src/scene3d.js; then exit 1; fi
          node --check src/scene3d.js
          git diff --check

      - name: Install
        run: npm ci

      - name: Test
        run: |
          set +e
          npm test > /tmp/global-silhouette-test.log 2>&1
          status=$?
          cat /tmp/global-silhouette-test.log
          exit $status

      - name: Capture test failure
        if: failure()
        run: |
          cp /tmp/global-silhouette-test.log .github/test-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/test-failure.log
          git commit -m 'ci: capture silhouette ghost test failure [skip ci]'
          git push origin ROG

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/global-silhouette-ghost.yml .github/scripts/apply-global-silhouette-ghost.py
          if git ls-files --error-unmatch .github/test-failure.log >/dev/null 2>&1; then git rm -f .github/test-failure.log; fi
          git add src test tests
          git commit -m 'feat: make module ghosts singleton silhouettes [skip ci]'
          git push origin ROG
