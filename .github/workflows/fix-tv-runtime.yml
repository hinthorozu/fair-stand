name: Fix TV Runtime Visibility
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-tv-runtime.yml'
      - 'scripts/fix-tv-runtime.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/fix-tv-runtime.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f scripts/fix-tv-runtime.py .github/workflows/fix-tv-runtime.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: restore TV visibility on scene drop [skip ci]'
          branch: ROG
