name: Apply Loveseat Resize

on:
  push:
    branches:
      - ROG
    paths:
      - '.github/workflows/apply-loveseat-resize.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - run: python .github/scripts/resize_beige_loveseat.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/scripts/resize_beige_loveseat.py
          rm -f .github/workflows/apply-loveseat-resize.yml
          rm -f .github/workflows/resize-beige-loveseat-v2.yml
          rm -f .github/workflows/resize-beige-loveseat-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resize beige loveseat only [skip ci]"
          git push