name: Add project ZIP import export once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-project-zip-import-export-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm install jszip@^3.10.1
      - run: python scripts/add-project-zip-import-export.py
      - run: npm test
      - run: npm run build

      - name: Commit and push
        run: |
          rm .github/workflows/add-project-zip-import-export-once.yml
          rm scripts/add-project-zip-import-export.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js src/assetStore.js package.json package-lock.json .github/workflows/add-project-zip-import-export-once.yml scripts/add-project-zip-import-export.py
          git commit -m "Add project ZIP import and export"
          git push origin ROG
