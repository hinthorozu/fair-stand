name: Fix Beige Chair Width

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-beige-chair-width.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/fix-beige-chair-width.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/fix-beige-chair-width.py .github/workflows/fix-beige-chair-width.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make beige single chairs true 65cm [skip ci]'
          branch: ROG
