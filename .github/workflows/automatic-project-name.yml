name: Automatic project name patch
on:
  push:
    branches: [ROG]
    paths: ['.github/scripts/automatic-project-name.cjs']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ROG}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node .github/scripts/automatic-project-name.cjs
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/workflows/automatic-project-name.yml .github/scripts/automatic-project-name.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Generate project names from stand setup"
          git push origin ROG
