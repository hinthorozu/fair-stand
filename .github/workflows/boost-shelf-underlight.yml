name: Boost Shelf Under-light

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/boost-shelf-underlight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Strengthen shelf under-light
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('emissiveIntensity: 3.0,', 'emissiveIntensity: 6.0,'),
              ('        8.5,\n        ledStripWidthM,\n        Math.max(shelfDepthM * 0.72, 0.12),', '        28.0,\n        ledStripWidthM,\n        Math.max(shelfDepthM * 0.95, 0.18),'),
              ('        shelfBottomY - 0.008,\n        wallDepthM / 2 + shelfDepthM * 0.56,', '        shelfBottomY - 0.006,\n        wallDepthM / 2 + shelfDepthM * 0.54,'),
              ('        shelfBottomY - 1,\n        wallDepthM / 2 + shelfDepthM * 0.56,', '        shelfBottomY - 0.55,\n        wallDepthM / 2 + shelfDepthM * 0.20,'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'marker not found: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/boost-shelf-underlight.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js .github/workflows/boost-shelf-underlight.yml
          git commit -m "fix: make shelf under-light clearly visible [skip ci]"
          git push origin ROG
