name: Apply Beige Sofa GLB

on:
  push:
    branches:
      - ROG
    paths:
      - '.github/workflows/apply-beige-glb.yml'
      - '.github/scripts/apply_beige_glb.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch renderer
        run: python3 .github/scripts/apply_beige_glb.py

      - name: Remove obsolete files
        run: |
          rm -f public/models/beige_sofa_mesh.bin
          rm -rf .github/beige-final .github/beige-direct .github/beige-upload
          rm -f .github/scripts/use_direct_beige_glb.py

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          rm -f .github/scripts/apply_beige_glb.py
          rm -f .github/workflows/apply-beige-glb.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: load beige sofa set directly from GLB [skip ci]'
          git push origin HEAD:ROG
