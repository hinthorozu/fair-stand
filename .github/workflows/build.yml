name: Build

on:
  push:
    branches: [ROG]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch TV front screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text()
          imp = "import { TV_SCREEN_DATA_URL } from './tvScreenImage.js';\n"
          anchor = "import { getModuleGhostBehavior, getModuleRotationStepDeg, isFreePlacementModule, isTopPlacementModule, isWallOverlayModule } from './moduleBehavior.js';\n"
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          texture_anchor = "  const textureLoader = new THREE.TextureLoader();\n"
          helper = '''  const textureLoader = new THREE.TextureLoader();
  const tvScreenTexture = textureLoader.load(TV_SCREEN_DATA_URL);
  tvScreenTexture.colorSpace = THREE.SRGBColorSpace;
  tvScreenTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  function addTvScreenOverlay(group) {
    if (!group || group.getObjectByName('tv-screen-image-overlay')) return;
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(0.88, 0.495),
      new THREE.MeshBasicMaterial({
        map: tvScreenTexture,
        toneMapped: false,
        side: THREE.FrontSide,
      }),
    );
    screen.name = 'tv-screen-image-overlay';
    screen.position.set(0, 1.75, 0.041);
    screen.renderOrder = 50;
    screen.userData.kind = 'tv-screen-overlay';
    screen.userData.acceptsImage = false;
    group.add(screen);
  }
'''
          if "function addTvScreenOverlay(group)" not in s:
              if texture_anchor not in s: raise SystemExit('texture anchor missing')
              s = s.replace(texture_anchor, helper, 1)
          add_anchor = "      wallRoot.add(module.group);\n      surfaceMeshes.push(...module.surfaces);\n"
          add_repl = "      wallRoot.add(module.group);\n      if (moduleState.type === 'tv') addTvScreenOverlay(module.group);\n      surfaceMeshes.push(...module.surfaces);\n"
          if "if (moduleState.type === 'tv') addTvScreenOverlay(module.group);" not in s:
              if add_anchor not in s: raise SystemExit('wall add anchor missing')
              s = s.replace(add_anchor, add_repl, 1)
          p.write_text(s)
          Path('.github/workflows/build.yml').write_text("""name: Build

on:
  push:
    branches: [ROG]
  pull_request:
    branches: [ROG]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
""")
          PY

      - name: Verify patch
        run: |
          node --check src/scene3d.js
          grep -F "TV_SCREEN_DATA_URL" src/scene3d.js
          grep -F "tv-screen-image-overlay" src/scene3d.js
          grep -F "side: THREE.FrontSide" src/scene3d.js

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cleanup broken temp workflow
        run: rm -f .github/workflows/tv-screen-image.yml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: show uploaded image on TV front screen [skip ci]'
          branch: ROG
