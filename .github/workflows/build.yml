name: Build

on:
  push:
    branches: [ROG]
  pull_request:
    branches: [ROG]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fix counter side panel snap
        run: node .github/scripts/fix-counter-side-panel.js

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit source changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modulePlacement.js test/modulePlacement.test.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: allow 50 panel on Banko 150 side [skip ci]"
          git push origin HEAD:ROG
