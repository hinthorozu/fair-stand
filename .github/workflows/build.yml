name: Build

on:
  push:
    branches: [ROG]
  pull_request:
    branches: [ROG]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install original Eames GLB and patch renderer
        if: github.event_name == 'push'
        run: |
          mkdir -p public/models
          cat .github/eames-upload/part*.b64 | base64 -d | xz -d > public/models/eames_chair.glb
          test "$(stat -c%s public/models/eames_chair.glb)" = "479232"
          echo "1cd0ea4d9c07cf3bb58a2902e1a0049c83bf1c7edc95c2e66b45ad7ce60bc4f6  public/models/eames_chair.glb" | sha256sum -c -
          node .github/scripts/install-original-eames-glb.cjs

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit original Eames table set
        if: github.event_name == 'push'
        run: |
          cat > public/models/EAMES_CHAIR_ATTRIBUTION.txt <<'EOF'
          Eames chair
          Author: valeduque_portfolio
          Source: https://sketchfab.com/3d-models/eames-chair-a699822777e94849b1417a2a3c185e10
          License: CC BY 4.0
          EOF
          git rm -f public/models/eames-table-chair.mesh.bin || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/eamesTableChairSetContract.test.js public/models/eames_chair.glb public/models/EAMES_CHAIR_ATTRIBUTION.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: use original Eames GLB for 4-chair table set [skip ci]"
            git push
          fi