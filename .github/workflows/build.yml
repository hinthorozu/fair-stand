name: Build

on:
  push:
    branches: [ROG]
  pull_request:
    branches: [ROG]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch TV wall drag
        run: |
          python -c "from pathlib import Path; p=Path('src/scene3d.js'); s=p.read_text(); s=s.replace('''    const pointedModule = pickModuleAt(clientX, clientY)?.moduleGroup?.userData?.moduleState;\n    const pointedWallId = pointedModule?.placement?.wallId;\n    const targetWallId = allowedWalls.includes(pointedWallId)\n      ? pointedWallId\n      : (preferredWallId && allowedWalls.includes(preferredWallId) ? preferredWallId : null);\n    const candidateWalls = targetWallId ? [targetWallId] : allowedWalls;\n''','''    const pointedModule = pickModuleAt(clientX, clientY)?.moduleGroup?.userData?.moduleState;\n    const pointedWallId = pointedModule?.placement?.wallId;\n    const targetWallId = allowedWalls.includes(pointedWallId) ? pointedWallId : null;\n    const candidateWalls = targetWallId ? [targetWallId] : allowedWalls;\n''',1); s=s.replace('''      const currentWallId = dragSession.preview?.placement?.wallId\n        ?? moduleState.placement?.wallId\n        ?? null;\n      const wallPoint = getWallOverlayDragPoint(\n        event.clientX,\n        event.clientY,\n        currentWallId,\n        moduleState,\n      );\n''','''      const wallPoint = getWallOverlayDragPoint(\n        event.clientX,\n        event.clientY,\n        null,\n        moduleState,\n      );\n''',1); p.write_text(s)"

      - name: Verify patch
        run: |
          grep -F "const targetWallId = allowedWalls.includes(pointedWallId) ? pointedWallId : null;" src/scene3d.js
          grep -A5 "const wallPoint = getWallOverlayDragPoint(" src/scene3d.js | grep -F "null,"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cleanup temp workflow
        run: rm -f .github/workflows/tv-free-wall-drag.yml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: let TV move freely across visible walls [skip ci]'
          branch: ROG
