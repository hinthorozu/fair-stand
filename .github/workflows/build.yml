name: Build

on:
  push:
    branches: [ROG]
  pull_request:
    branches: [ROG]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Banko 150 L
        run: node .github/scripts/add-bank150l.js

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit source changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog.js src/designState.js src/scene3d.js src/main.js src/productionParts.js src/moduleRecipes.js test/lCounter150Contract.test.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat: add 150x150 L counter [skip ci]"
          git push origin HEAD:ROG
