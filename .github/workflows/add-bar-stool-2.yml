name: Add Tabure 2
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-bar-stool-2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/add-bar-stool-2.py
      - run: node --check src/scene3d.js
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/add-bar-stool-2.py .github/workflows/add-bar-stool-2.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: add Tabure 2 GLB module [skip ci]'
          branch: ROG
