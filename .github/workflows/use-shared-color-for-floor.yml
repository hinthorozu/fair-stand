name: Use Shared Color For Floor

on:
  push:
    paths:
      - 'scripts/use-shared-color-for-floor.mjs'
      - '.github/workflows/use-shared-color-for-floor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/use-shared-color-for-floor.mjs
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js src/scene3d.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use active color tool for floor painting"
          git push origin ROG
