name: Arrow Key Module Movement

on:
  push:
    branches: [ROG]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node .github/scripts/add-arrow-key-movement.cjs
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: move selected modules with arrow keys [skip ci]"
            git push
          fi
