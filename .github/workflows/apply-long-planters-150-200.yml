name: Apply Long Planters 150 200

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/apply-long-planters-150-200.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply catalog patch
        run: node scripts/patch-long-planters-150-200.mjs

      - name: Build
        run: npm ci && npm run build

      - name: Remove one-time patch files and commit
        run: |
          rm scripts/patch-long-planters-150-200.mjs .github/workflows/apply-long-planters-150-200.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/catalog.js src/moduleDragSidebar.js src/main.js scripts/patch-long-planters-150-200.mjs .github/workflows/apply-long-planters-150-200.yml
          git commit -m 'feat: add Uzun Saksı 150 and 200 catalog modules'
          git push origin ROG
