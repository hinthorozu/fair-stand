name: Wall Reflow Fixture Filter
on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_wall_reflow_fixture_filter.py'
      - '.github/workflows/wall-reflow-fixture-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_wall_reflow_fixture_filter.py
      - name: Syntax check
        run: node --check src/wallReflow.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f .github/workflows/wall-reflow-fixture-filter.yml scripts/patch_wall_reflow_fixture_filter.py
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: ignore fixtures in wall duplication capacity [skip ci]'
          git push origin HEAD:ROG
