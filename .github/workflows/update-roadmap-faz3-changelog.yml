name: Update FAZ 3 Roadmap and Changelog

on:
  push:
    branches: [ROG]
    paths:
      - scripts/update-roadmap-faz3-changelog.mjs
      - .github/workflows/update-roadmap-faz3-changelog.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-roadmap-faz3-changelog.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md Changelog.md
          git diff --cached --quiet || git commit -m "Document FAZ 3 roadmap and August 11 changes"
          git push origin ROG
