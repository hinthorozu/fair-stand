name: Fix Tabure 2 Snap
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-tabure-2-snap.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-tabure-2-snap.py
      - run: node --check src/modulePlacement.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/fix-tabure-2-snap.py .github/workflows/fix-tabure-2-snap.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: move Tabure 2 on 10cm grid [skip ci]'
          branch: ROG
