name: Add Project Autosave

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/add-autosave.mjs'
      - '.github/workflows/add-autosave.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add-autosave.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git commit -m "Add 5 second project autosave"
          git push origin ROG
