name: Set Beige Chair Angles
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/set-beige-chair-angles.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/set-beige-chair-angles.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/set-beige-chair-angles.py .github/workflows/set-beige-chair-angles.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: set beige chair rotations to 40 and 225 [skip ci]'
          branch: ROG
