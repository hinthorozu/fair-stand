name: Optimize exhibition floor once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/optimize-exhibition-floor-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download optimized 2K source
        run: |
          curl -fL --retry 3 \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/damaged_concrete_floor_02/damaged_concrete_floor_02_diff_2k.jpg' \
            -o public/textures/exhibition-floor-optimized.jpg
          test -s public/textures/exhibition-floor-optimized.jpg
          echo "Optimized texture size: $(du -h public/textures/exhibition-floor-optimized.jpg | cut -f1)"
          echo "Original texture size:  $(du -h public/textures/exhibition-floor.jpg | cut -f1)"

      - name: Switch runtime to optimized texture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text()
          old = "textures/exhibition-floor.jpg"
          new = "textures/exhibition-floor-optimized.jpg"
          if old not in s:
              raise SystemExit(f'{old} reference not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit optimized texture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/textures/exhibition-floor-optimized.jpg src/scene3d.js
          git diff --cached --quiet || git commit -m "Use optimized exhibition floor texture"
          git push origin ROG
