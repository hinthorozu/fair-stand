name: Replace manual load with project loading overlay

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/replace-manual-load-with-overlay-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python scripts/replace-manual-load-with-overlay.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          rm .github/workflows/replace-manual-load-with-overlay-once.yml
          rm scripts/replace-manual-load-with-overlay.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js src/style.css .github/workflows/replace-manual-load-with-overlay-once.yml scripts/replace-manual-load-with-overlay.py
          git commit -m "Show loading overlay while opening projects"
          git push origin ROG
