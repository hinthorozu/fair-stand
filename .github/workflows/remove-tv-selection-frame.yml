name: Remove TV Selection Frame

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/remove-tv-selection-frame.py'
      - '.github/workflows/remove-tv-selection-frame.yml'

permissions:
  contents: write

jobs:
  patch-test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/remove-tv-selection-frame.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Cleanup temporary patch files
        run: rm scripts/remove-tv-selection-frame.py .github/workflows/remove-tv-selection-frame.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove extra TV selection geometry [skip ci]"
          git push origin ROG
