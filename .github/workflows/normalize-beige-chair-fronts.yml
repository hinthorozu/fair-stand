name: Normalize Beige Chair Fronts
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/normalize-beige-chair-fronts.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/normalize-beige-chair-fronts.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/normalize-beige-chair-fronts.py .github/workflows/normalize-beige-chair-fronts.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: normalize beige chair fronts against loveseat [skip ci]'
          branch: ROG
