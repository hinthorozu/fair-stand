name: Fix Generic Module Selection

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-generic-module-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add generic module selection fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/scene3d.js')
          text = path.read_text(encoding='utf-8')

          old = """  function setSelectionVisual(mesh, selected) {
            if (!mesh) return;
            const frame = mesh.userData.selectionFrame;
            if (frame) frame.visible = selected;
            if (mesh.material?.emissive) {
              mesh.material.emissive.setHex(selected ? SELECTION_COLOR : 0x000000);
              mesh.material.emissiveIntensity = selected ? 0.08 : 0;
            }
          }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """  function findModuleGroupById(moduleId) {
            if (!moduleId) return null;
            let found = null;
            wallRoot.traverse((object) => {
              if (!found && object.userData?.kind === 'module' && object.userData?.moduleId === moduleId) {
                found = object;
              }
            });
            return found;
          }

          function ensureModuleSelectionFrame(moduleGroup) {
            if (!moduleGroup) return null;
            if (moduleGroup.userData?.moduleSelectionFrame) return moduleGroup.userData.moduleSelectionFrame;

            const widthM = Number(moduleGroup.userData?.widthCm) / 100;
            const depthM = Number(moduleGroup.userData?.depthCm) / 100;
            const heightM = Number(moduleGroup.userData?.heightCm) / 100;
            if (!(widthM > 0) || !(depthM > 0) || !(heightM > 0)) return null;

            const paddingM = 0.02;
            const frame = new THREE.LineSegments(
              new THREE.EdgesGeometry(new THREE.BoxGeometry(
                widthM + paddingM,
                heightM + paddingM,
                depthM + paddingM,
              )),
              new THREE.LineBasicMaterial({
                color: SELECTION_COLOR,
                transparent: true,
                opacity: 0.95,
                depthTest: false,
                toneMapped: false,
              }),
            );
            frame.position.set(0, heightM / 2, 0);
            frame.renderOrder = 1000;
            frame.visible = false;
            frame.userData.isModuleSelectionVisual = true;
            moduleGroup.add(frame);
            moduleGroup.userData.moduleSelectionFrame = frame;
            return frame;
          }

          function setModuleSelectionVisual(moduleId, selected) {
            const moduleGroup = findModuleGroupById(moduleId);
            if (!moduleGroup) return;
            const frame = selected
              ? ensureModuleSelectionFrame(moduleGroup)
              : moduleGroup.userData?.moduleSelectionFrame;
            if (frame) frame.visible = Boolean(selected);
          }

          function setSelectionVisual(mesh, selected) {
            if (!mesh) return;
            const frame = mesh.userData.selectionFrame;
            if (frame) frame.visible = selected;
            if (!frame && mesh.userData?.selectionMode === 'module') {
              setModuleSelectionVisual(mesh.userData?.moduleId, selected);
            }
            if (mesh.material?.emissive) {
              mesh.material.emissive.setHex(selected ? SELECTION_COLOR : 0x000000);
              mesh.material.emissiveIntensity = selected ? 0.08 : 0;
            }
          }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'setSelectionVisual block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  function clearSelection({ notify = true, keepAnchor = false } = {}) {
            selectedSurfaces.forEach((mesh) => setSelectionVisual(mesh, false));
            selectedSurfaces.clear();
            floorSelected = false;
            if (!keepAnchor) selectionAnchorSurfaceId = null;
            if (notify) notifySelection();
          }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """  function clearSelection({ notify = true, keepAnchor = false } = {}) {
            setModuleSelectionVisual(selectedModuleId, false);
            selectedSurfaces.forEach((mesh) => setSelectionVisual(mesh, false));
            selectedSurfaces.clear();
            floorSelected = false;
            if (!keepAnchor) selectionAnchorSurfaceId = null;
            if (notify) notifySelection();
          }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'clearSelection block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  function selectModuleOnly(moduleId) {
            selectedSurfaces.forEach((mesh) => setSelectionVisual(mesh, false));
            selectedSurfaces.clear();
            selectionAnchorSurfaceId = null;
            floorSelected = false;
            selectedModuleId = moduleId ?? null;
            notifySelection();
          }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """  function selectModuleOnly(moduleId) {
            setModuleSelectionVisual(selectedModuleId, false);
            selectedSurfaces.forEach((mesh) => setSelectionVisual(mesh, false));
            selectedSurfaces.clear();
            selectionAnchorSurfaceId = null;
            floorSelected = false;
            selectedModuleId = moduleId ?? null;
            setModuleSelectionVisual(selectedModuleId, true);
            notifySelection();
          }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'selectModuleOnly block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    const selectedVisibility = selectedFrames.map((frame) => frame.visible);
            const guideVisibility = activeWallGuides.map((guide) => guide.visible);

            try {
              selectedFrames.forEach((frame) => { frame.visible = false; });
              activeWallGuides.forEach((guide) => { guide.visible = false; });
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """    const selectedVisibility = selectedFrames.map((frame) => frame.visible);
            const moduleSelectionFrame = findModuleGroupById(selectedModuleId)?.userData?.moduleSelectionFrame ?? null;
            const moduleSelectionVisibility = moduleSelectionFrame?.visible ?? false;
            const guideVisibility = activeWallGuides.map((guide) => guide.visible);

            try {
              selectedFrames.forEach((frame) => { frame.visible = false; });
              if (moduleSelectionFrame) moduleSelectionFrame.visible = false;
              activeWallGuides.forEach((guide) => { guide.visible = false; });
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'export hide block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    } finally {
              selectedFrames.forEach((frame, index) => { frame.visible = selectedVisibility[index]; });
              activeWallGuides.forEach((guide, index) => { guide.visible = guideVisibility[index]; });
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """    } finally {
              selectedFrames.forEach((frame, index) => { frame.visible = selectedVisibility[index]; });
              if (moduleSelectionFrame) moduleSelectionFrame.visible = moduleSelectionVisibility;
              activeWallGuides.forEach((guide, index) => { guide.visible = guideVisibility[index]; });
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'export restore block count={text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('test/moduleSelectionVisual.test.js')
          test_path.write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const scene = readFileSync(new URL('../src/scene3d.js', import.meta.url), 'utf8');

          test('module selection falls back to a generic blue 3D frame', () => {
            assert.match(scene, /function ensureModuleSelectionFrame\(moduleGroup\)/);
            assert.match(scene, /new THREE\.EdgesGeometry\(new THREE\.BoxGeometry\(/);
            assert.match(scene, /color: SELECTION_COLOR/);
            assert.match(scene, /moduleGroup\.userData\?\.widthCm/);
            assert.match(scene, /moduleGroup\.userData\?\.depthCm/);
            assert.match(scene, /moduleGroup\.userData\?\.heightCm/);
            assert.match(scene, /!frame && mesh\.userData\?\.selectionMode === 'module'/);
          });

          test('fallback-only module hits show and clear the generic selection frame', () => {
            assert.match(scene, /function selectModuleOnly\(moduleId\)[\s\S]*?setModuleSelectionVisual\(selectedModuleId, true\)/);
            assert.match(scene, /function clearSelection[\s\S]*?setModuleSelectionVisual\(selectedModuleId, false\)/);
          });

          test('render export hides the generic module selection frame', () => {
            assert.match(scene, /if \(moduleSelectionFrame\) moduleSelectionFrame\.visible = false/);
            assert.match(scene, /if \(moduleSelectionFrame\) moduleSelectionFrame\.visible = moduleSelectionVisibility/);
          });
          """.replace(/^          /gm, ''), encoding='utf-8')
          PY

      - name: Verify scope
        run: |
          grep -F "function ensureModuleSelectionFrame(moduleGroup)" src/scene3d.js
          grep -F "setModuleSelectionVisual(selectedModuleId, true);" src/scene3d.js
          test -f test/moduleSelectionVisual.test.js
          git diff -- src/scene3d.js test/moduleSelectionVisual.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-generic-module-selection.yml
          git add src/scene3d.js test/moduleSelectionVisual.test.js
          git commit -m 'fix: show selection outline for every module [skip ci]'
          git push origin ROG
