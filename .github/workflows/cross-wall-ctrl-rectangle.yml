name: Cross Wall Ctrl Rectangle

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_cross_wall_ctrl_rectangle.py'
      - '.github/workflows/cross-wall-ctrl-rectangle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/patch_cross_wall_ctrl_rectangle.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/patch_cross_wall_ctrl_rectangle.py .github/workflows/cross-wall-ctrl-rectangle.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore cross-wall ctrl rectangle selection [skip ci]'
          git push origin ROG
