name: Unify aluminum profile color once
on:
  push:
    branches: [ROG]
    paths:
      - scripts/unify-aluminum-profile-color.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/unify-aluminum-profile-color.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js src/moduleContextMenu.js src/moduleDragSidebar.js src/style.css
          git commit -m "Use one aluminum profile color everywhere"
          git push
