name: Apply Sofa Set

on:
  push:
    branches: [ROG]
    paths:
      - .github/workflows/apply-sofa-set.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply 150 x 150 sofa footprint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
            p = Path(path)
            s = p.read_text()
            for old, new in replacements:
              s = s.replace(old, new)
            p.write_text(s)

          patch('src/catalog.js', [
            ("  widthCm: 160,\n  depthCm: 160,\n  heightCm: 80,\n  loveseatWidthCm: 160,", "  widthCm: 150,\n  depthCm: 150,\n  heightCm: 80,\n  loveseatWidthCm: 150,"),
            ("SOFA_SET: { type: 'sofa-set', widthCm: 160, depthCm: 160, heightCm: 80", "SOFA_SET: { type: 'sofa-set', widthCm: 150, depthCm: 150, heightCm: 80"),
          ])

          patch('src/designState.js', [
            ("    type: 'sofa-set',\n    widthCm: 160,\n    depthCm: 160,\n    heightCm: 80,", "    type: 'sofa-set',\n    widthCm: 150,\n    depthCm: 150,\n    heightCm: 80,"),
          ])

          patch('src/scene3d.js', [
            ("const widthM = Number(moduleState.widthCm || 160) / 100;", "const widthM = Number(moduleState.widthCm || 150) / 100;"),
            ("const depthM = Number(moduleState.depthCm || 160) / 100;", "const depthM = Number(moduleState.depthCm || 150) / 100;"),
            ("widthCm: Number(moduleState.widthCm || 160), depthCm: Number(moduleState.depthCm || 160)", "widthCm: Number(moduleState.widthCm || 150), depthCm: Number(moduleState.depthCm || 150)"),
            ("widthCm: Number(moduleState.widthCm || 160)", "widthCm: Number(moduleState.widthCm || 150)"),
            ("addSofa({ x: 0, z: -depthM / 2 + 0.39, seatWidth: 1.60, seatDepth: 0.78, twoSeat: true, facing: 'front' });", "addSofa({ x: 0, z: -depthM / 2 + 0.39, seatWidth: 1.50, seatDepth: 0.78, twoSeat: true, facing: 'front' });"),
            ("addSofa({ x: -0.475, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });", "addSofa({ x: -0.425, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });"),
            ("addSofa({ x: 0.475, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });", "addSofa({ x: 0.425, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });"),
          ])

          test = Path('test/sofaSet.test.js')
          s = test.read_text()
          s = s.replace('160 x 160 cm footprint', '150 x 150 cm footprint')
          s = s.replace('SOFA_SET_DIMENSIONS.loveseatWidthCm, 160', 'SOFA_SET_DIMENSIONS.loveseatWidthCm, 150')
          s = s.replace('SOFA_SET_DIMENSIONS.widthCm, 160', 'SOFA_SET_DIMENSIONS.widthCm, 150')
          s = s.replace('SOFA_SET_DIMENSIONS.depthCm, 160', 'SOFA_SET_DIMENSIONS.depthCm, 150')
          s = s.replace('state.widthCm, 160', 'state.widthCm, 150')
          s = s.replace('state.depthCm, 160', 'state.depthCm, 150')
          s = s.replace('widthCm: 160, depthCm: 160', 'widthCm: 150, depthCm: 150')
          s = s.replace('rotateModulePlacementAroundCenter(placed.placement, 160, 90, 160)', 'rotateModulePlacementAroundCenter(placed.placement, 150, 90, 150)')
          s = s.replace("widthCm: 160, depthCm: 160, forceFree: true", "widthCm: 150, depthCm: 150, forceFree: true")
          s = s.replace('backLeft.placement.yCm - 80, 0', 'backLeft.placement.yCm - 75, 0')
          s = s.replace('(grid.placement.yCm - 80) % 50, 0', '(grid.placement.yCm - 75) % 50, 0')
          s = s.replace('frontRight.placement.xCm + 160, 600', 'frontRight.placement.xCm + 150, 600')
          s = s.replace('frontRight.placement.yCm + 80, 600', 'frontRight.placement.yCm + 75, 600')
          test.write_text(s)

          for name in ['Changelog.md', 'PROJECT_RULES.md', 'ROADMAP.md']:
            p = Path(name)
            if p.exists():
              s = p.read_text().replace('160 x 160', '150 x 150').replace('160x160', '150x150')
              p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md ROADMAP.md
          git diff --cached --quiet || git commit -m "Set sofa set to 150x150 footprint"
          git push origin ROG
