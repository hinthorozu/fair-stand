name: Apply Sofa Set

on:
  push:
    branches: [ROG]
    paths:
      - .github/workflows/apply-sofa-set.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply 150 x 150 sofa footprint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
            p = Path(path)
            s = p.read_text()
            for old, new in replacements:
              s = s.replace(old, new)
            p.write_text(s)

          patch('src/catalog.js', [
            ("  widthCm: 160,\n  depthCm: 160,\n  heightCm: 80,\n  loveseatWidthCm: 160,", "  widthCm: 150,\n  depthCm: 150,\n  heightCm: 80,\n  loveseatWidthCm: 150,"),
            ("SOFA_SET: { type: 'sofa-set', widthCm: 160, depthCm: 160, heightCm: 80", "SOFA_SET: { type: 'sofa-set', widthCm: 150, depthCm: 150, heightCm: 80"),
          ])

          patch('src/designState.js', [
            ("    type: 'sofa-set',\n    widthCm: 160,\n    depthCm: 160,\n    heightCm: 80,", "    type: 'sofa-set',\n    widthCm: 150,\n    depthCm: 150,\n    heightCm: 80,"),
          ])

          patch('src/scene3d.js', [
            ("const widthM = Number(moduleState.widthCm || 160) / 100;", "const widthM = Number(moduleState.widthCm || 150) / 100;"),
            ("const depthM = Number(moduleState.depthCm || 160) / 100;", "const depthM = Number(moduleState.depthCm || 150) / 100;"),
            ("widthCm: Number(moduleState.widthCm || 160), depthCm: Number(moduleState.depthCm || 160)", "widthCm: Number(moduleState.widthCm || 150), depthCm: Number(moduleState.depthCm || 150)"),
            ("widthCm: Number(moduleState.widthCm || 160)", "widthCm: Number(moduleState.widthCm || 150)"),
            ("addSofa({ x: 0, z: -depthM / 2 + 0.39, seatWidth: 1.60, seatDepth: 0.78, twoSeat: true, facing: 'front' });", "addSofa({ x: 0, z: -depthM / 2 + 0.39, seatWidth: 1.50, seatDepth: 0.78, twoSeat: true, facing: 'front' });"),
            ("addSofa({ x: -0.475, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });", "addSofa({ x: -0.425, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });"),
            ("addSofa({ x: 0.475, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });", "addSofa({ x: 0.425, z: depthM / 2 - 0.375, seatWidth: 0.65, seatDepth: 0.75, facing: 'back' });"),
          ])
          PY
      - name: Fix free-fixture edge and corner snap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modulePlacement.js')
          s = p.read_text()
          old = '''  return createModulePlacement({
    xCm: !vertical
      ? clamp(snapCm(Number(pointerXCm) - width / 2), 0, maxX)
      : clamp(
          strictDepth ? snapDepthCenterCm(pointerXCm, depthCm) : snapCm(pointerXCm),
          minX,
          maxX,
        ),
    yCm: vertical
      ? clamp(snapCm(Number(pointerYCm) - width / 2), 0, maxY)
      : clamp(
          strictDepth ? snapDepthCenterCm(pointerYCm, depthCm) : snapCm(pointerYCm),
          minY,
          maxY,
        ),
    rotationZDeg: rotation,
    wallId: 'free',
  });
'''
          new = '''  let xCm = !vertical
    ? clamp(snapCm(Number(pointerXCm) - width / 2), 0, maxX)
    : clamp(
        strictDepth ? snapDepthCenterCm(pointerXCm, depthCm) : snapCm(pointerXCm),
        minX,
        maxX,
      );
  let yCm = vertical
    ? clamp(snapCm(Number(pointerYCm) - width / 2), 0, maxY)
    : clamp(
        strictDepth ? snapDepthCenterCm(pointerYCm, depthCm) : snapCm(pointerYCm),
        minY,
        maxY,
      );

  if (strictDepth) {
    const edgeSnap = MODULE_PLACEMENT_SNAP_CM;
    if (!vertical) {
      if (xCm <= edgeSnap + EPSILON_CM) xCm = 0;
      if (xLimit - (xCm + width) <= edgeSnap + EPSILON_CM) xCm = xLimit - width;
      if (yCm - halfDepth <= edgeSnap + EPSILON_CM) yCm = halfDepth;
      if (yLimit - (yCm + halfDepth) <= edgeSnap + EPSILON_CM) yCm = yLimit - halfDepth;
    } else {
      if (xCm - halfDepth <= edgeSnap + EPSILON_CM) xCm = halfDepth;
      if (xLimit - (xCm + halfDepth) <= edgeSnap + EPSILON_CM) xCm = xLimit - halfDepth;
      if (yCm <= edgeSnap + EPSILON_CM) yCm = 0;
      if (yLimit - (yCm + width) <= edgeSnap + EPSILON_CM) yCm = yLimit - width;
    }
  }

  return createModulePlacement({
    xCm,
    yCm,
    rotationZDeg: rotation,
    wallId: 'free',
  });
'''
          if old in s:
            s = s.replace(old, new)
          elif 'const edgeSnap = MODULE_PLACEMENT_SNAP_CM;' not in s:
            raise SystemExit('createFreePlacement anchor not found')
          p.write_text(s)

          t = Path('test/sofaSet.test.js')
          ts = t.read_text()
          marker = "koltuk takımı köşelerde iki eksende de sıfıra oturur"
          if marker not in ts:
            ts += """\n\ntest('koltuk takımı köşelerde iki eksende de sıfıra oturur', () => {\n  const tl = snapPlacementToStand({ standType: 'island', widthCm: 150, depthCm: 150, forceFree: true, pointerXCm: 120, pointerYCm: 120, standXCm: 600, standYCm: 600 });\n  assert.equal(tl.ok, true);\n  assert.equal(tl.placement.xCm, 0);\n  assert.equal(tl.placement.yCm, 75);\n  const br = snapPlacementToStand({ standType: 'island', widthCm: 150, depthCm: 150, forceFree: true, pointerXCm: 480, pointerYCm: 480, standXCm: 600, standYCm: 600 });\n  assert.equal(br.ok, true);\n  assert.equal(br.placement.xCm, 450);\n  assert.equal(br.placement.yCm, 525);\n});\n"""
            t.write_text(ts)
          PY
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md ROADMAP.md
          git diff --cached --quiet || git commit -m "Fix sofa corner edge snapping"
          git push origin ROG
