name: Disable Mesh Holes

on:
  push:
    branches:
      - ROG
    paths:
      - .github/workflows/disable-mesh-holes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: node scripts/disable-mesh-holes.cjs

      - name: Verify no opacity changes
        run: |
          if git diff -U0 -- src/scene3d.js | grep -E '^[+-].*opacity'; then
            echo 'Unexpected opacity change detected.'
            exit 1
          fi

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/coverModeExclusivity.test.js
          node --check test/lightboxFabric.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/disable-mesh-holes.yml scripts/disable-mesh-holes.cjs
          git add src/scene3d.js test/coverModeExclusivity.test.js test/lightboxFabric.test.js
          git commit -m 'fix: disable mesh perforation mask [skip ci]'
          git push origin ROG
