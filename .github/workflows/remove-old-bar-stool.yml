name: Remove Old Bar Stool
# retry 3
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/remove-old-bar-stool.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/remove-old-bar-stool.py
      - run: node --check src/catalog.js
      - run: node --check src/designState.js
      - run: node --check src/main.js
      - run: node --check src/scene3d.js
      - run: node --check src/modulePlacement.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          ! grep -R -n -E "furniture_bar_stool_classic|createBarStoolModuleState|createBarStoolModule\(|['\"]bar-stool['\"]|Bar Taburesi|module-drag-bar-stool" src test || (echo 'Old bar stool references remain' && exit 1)
          grep -R -n "bar-stool-2" src >/dev/null
      - run: rm -f .github/scripts/remove-old-bar-stool.py .github/workflows/remove-old-bar-stool.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'refactor: remove old bar stool completely [skip ci]'
          branch: ROG
