name: Align trash acceptance wording

on:
  push:
    branches: [fix/plastic-trash-bin-catalog-type-preview]
    paths: [.github/workflows/fix-trash-contract-wording.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plastic-trash-bin-catalog-type-preview
      - name: Align contract with renderer acceptance
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/change-contract.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          json.impactAnalysis.notes = 'Corrective patch only. The current trash-bin dimensions are deliberately not changed here. Catalog, canonical state, behavior and automatic-depot identity are plastic-trash-bin. scene3d now dispatches that canonical type through the existing fixed-GLB normalization path and loads plastic_trash_bin.glb without converting the module back to a plant type. Browser regression exercises real drag/drop, waits for the GLB to finish loading and be added to the real scene module, then verifies canonical persistence.';
          json.tests.e2e.reason = 'Catalog visibility, real drag/drop, canonical state persistence, successful plastic_trash_bin.glb scene load into the real module, Add picker admission, and automatic depot composition are browser-visible behavior and require Chromium coverage.';
          fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          NODE
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-trash-contract-wording.yml
          git add .github/change-contract.json
          git commit -m "chore: align trash browser acceptance contract"
          git push origin HEAD:fix/plastic-trash-bin-catalog-type-preview
