name: Apply trash renderer patch

on:
  push:
    branches: [fix/plastic-trash-bin-catalog-type-preview]
    paths: [.github/workflows/patch-trash-renderer.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plastic-trash-bin-catalog-type-preview
          fetch-depth: 0

      - name: Patch renderer
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/scene3d.js';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(from, to, label) {
            const first = source.indexOf(from);
            const second = first >= 0 ? source.indexOf(from, first + from.length) : -1;
            if (first < 0 || second >= 0) {
              throw new Error(`${label}: expected exactly one match`);
            }
            source = source.slice(0, first) + to + source.slice(first + from.length);
          }

          replaceOnce(
            `    if (moduleState.type === 'indoor-plant-1') {\n      return createIndoorPlantModule(moduleState, moduleIndex);\n    }`,
            `    if (moduleState.type === 'indoor-plant-1' || moduleState.type === 'plastic-trash-bin') {\n      return createIndoorPlantModule(moduleState, moduleIndex);\n    }`,
            'fixed-model renderer dispatch',
          );

          replaceOnce(
            `function createIndoorPlantModule(moduleState, moduleIndex) {\n  const type = 'indoor-plant-1';\n  const modelFile = moduleState.modelFile ?? 'indoor_plants.glb';`,
            `function createIndoorPlantModule(moduleState, moduleIndex) {\n  const type = moduleState.type === 'plastic-trash-bin' ? 'plastic-trash-bin' : 'indoor-plant-1';\n  const modelFile = moduleState.modelFile\n    ?? (type === 'plastic-trash-bin' ? 'plastic_trash_bin.glb' : 'indoor_plants.glb');`,
            'fixed-model renderer identity',
          );

          replaceOnce(
            `    surfaceRole: moduleState.surface ? 'planter-body' : 'plant',`,
            `    surfaceRole: type === 'plastic-trash-bin'\n      ? 'trash-bin'\n      : (moduleState.surface ? 'planter-body' : 'plant'),`,
            'fixed-model surface role',
          );

          replaceOnce(
            `    group.add(model);\n  }).catch((error) => {\n    console.warn('Yapay çiçek modeli yüklenemedi:', modelFile, error);`,
            `    group.add(model);\n    group.userData.modelLoaded = true;\n    group.userData.modelFile = modelFile;\n    window.dispatchEvent(new CustomEvent('fair-stand:model-rendered', {\n      detail: { moduleId: moduleState.id, moduleIndex, type, modelFile },\n    }));\n  }).catch((error) => {\n    console.warn('Sabit GLB modülü yüklenemedi:', type, modelFile, error);`,
            'fixed-model load completion',
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Commit renderer fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-trash-renderer.yml
          git add src/scene3d.js
          git commit -m "fix: render plastic trash bin as canonical module type"
          git push origin HEAD:fix/plastic-trash-bin-catalog-type-preview
