name: Thin Panel Vertical Profiles 40mm

on:
  push:
    branches: [ROG]
    paths:
      - scripts/thin-panel-vertical-profiles-40mm.mjs
      - .github/workflows/thin-panel-vertical-profiles-40mm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply 40 mm vertical profile
        run: node scripts/thin-panel-vertical-profiles-40mm.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js Changelog.md
          git diff --cached --quiet || git commit -m "Thin panel vertical profiles to 40mm"
          git push origin ROG
