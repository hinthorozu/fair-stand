name: Patch counter multiselect once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/patch-counter-multiselect-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: python .github/scripts/patch_counter_multiselect.py
      - run: npm test
      - run: npm run build

      - name: Commit and push
        run: |
          rm .github/workflows/patch-counter-multiselect-once.yml
          rm .github/scripts/patch_counter_multiselect.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js src/main.js .github/workflows/patch-counter-multiselect-once.yml .github/scripts/patch_counter_multiselect.py
          git commit -m "Enable multi-panel selection on counters"
          git push origin ROG
