name: Remove Intermediate Horizontal Rails

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/remove-intermediate-horizontal-rails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply rail removal patch
        run: echo '' | base64 -d | python3
      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/horizontalPanelRails.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-intermediate-horizontal-rails.yml
          git add src/scene3d.js test/horizontalPanelRails.test.js
          git commit -m 'fix: remove intermediate horizontal panel rails [skip ci]'
          git push origin ROG
