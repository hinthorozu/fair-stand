name: Fix TV Texture Load

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/fix-tv-texture-load.py'
      - '.github/workflows/fix-tv-texture-load.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/fix-tv-texture-load.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f scripts/fix-tv-texture-load.py .github/workflows/fix-tv-texture-load.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: load TV screen texture with image data [skip ci]'
