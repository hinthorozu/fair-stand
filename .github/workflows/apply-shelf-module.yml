name: Apply Shelf Module

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-shelf-module.mjs
      - .github/workflows/apply-shelf-module.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fix patch template literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-shelf-module.mjs')
          s = p.read_text()
          s = s.replace("    body.style.width = \\`${previewWidthPx(module.widthCm)}px\\`;", "    body.style.width = previewWidthPx(module.widthCm) + 'px';")
          p.write_text(s)
          PY
      - run: node scripts/apply-shelf-module.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md ROADMAP.md
          git diff --cached --quiet || git commit -m "Add Maxima shelf modules"
          git push origin ROG
