name: Fix Free Context Insertion

on:
  push:
    branches: [ROG]
    paths:
      - scripts/fix-free-context-insertion.mjs
      - .github/workflows/fix-free-context-insertion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply Issue 1 fix
        run: node scripts/fix-free-context-insertion.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/modulePlacement.js test/modulePlacement.test.js ROADMAP.md
          git diff --cached --quiet || git commit -m "Fix free context add and duplicate placement"
          git push origin ROG
