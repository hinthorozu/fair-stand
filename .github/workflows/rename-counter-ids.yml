name: Rename catalog IDs

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/rename-counter-ids.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rename catalog keys everywhere
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'COUNTER_100': 'desk_banko_100',
              'COUNTER_150': 'desk_banko_150',
              'COUNTER_200': 'desk_banko_200',
              'SEPARATOR_100': 'wall_separator_100',
              'SEPARATOR_50': 'wall_separator_50',
              'SHOWCASE_2_100': 'wall_showcase_100_2',
              'SHOWCASE_3_100': 'wall_showcase_100_3',
              'BAR_STOOL': 'moble_bar_stool_classic',
              'TABLE_CHAIR_SET': 'moble_table_chair_set_minyon',
          }
          roots = [Path('src'), Path('test')]
          extra = [Path('SYSTEM_MODULE_CATALOG.md'), Path('ARCHITECTURE_RULES.md'), Path('README.md'), Path('ROADMAP.md'), Path('ROADMAP_PHASE_4.md'), Path('ROADMAP_PHASE_5_6.md')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.md','.json'})
          files.extend(p for p in extra if p.exists())
          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed))
          PY
      - name: Verify old IDs are gone from runtime/test/docs
        shell: bash
        run: |
          ! grep -R -n -E "COUNTER_(100|150|200)|SEPARATOR_(50|100)|SHOWCASE_[23]_100|BAR_STOOL|TABLE_CHAIR_SET" src test SYSTEM_MODULE_CATALOG.md ARCHITECTURE_RULES.md README.md ROADMAP*.md || (echo 'Old catalog IDs remain' && exit 1)
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test SYSTEM_MODULE_CATALOG.md ARCHITECTURE_RULES.md README.md ROADMAP*.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor: normalize catalog ids [skip ci]"
            git push origin ROG
          fi
