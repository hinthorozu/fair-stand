name: Tune Beige Sofa

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/tune-beige-sofa.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/tune-beige-sofa.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/tune-beige-sofa.py .github/workflows/tune-beige-sofa.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: enlarge beige sofas and rotate chairs [skip ci]'
          branch: ROG
