name: Shelf Two Spots

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/shelf-two-spots.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python3 scripts/patch_shelf_two_spots.py

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/shelfLighting.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js test/shelfLighting.test.js
          git commit -m "fix: use two symmetric shelf spotlights [skip ci]"
          git push origin ROG
