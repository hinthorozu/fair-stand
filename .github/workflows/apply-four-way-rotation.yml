name: Apply Four Way Rotation Patch

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-four-way-rotation.mjs
      - .github/workflows/apply-four-way-rotation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-four-way-rotation.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/modulePlacement.js src/wallReflow.js src/moduleDragSidebar.js src/scene3d.js test/modulePlacement.test.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modulePlacement.js src/wallReflow.js src/moduleDragSidebar.js src/scene3d.js test/modulePlacement.test.js
          git commit -m "Enable four-way module rotation"
          git push origin HEAD:ROG
