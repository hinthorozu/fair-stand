name: Fix Mesh Runtime Opacity

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-mesh-runtime-opacity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply runtime opacity fix
        run: echo '' | base64 -d | python3
      - name: Verify
        run: |
          grep -F "material.opacity = fabricType === 'mesh' ? GLASS_SURFACE_OPACITY : 1" src/scene3d.js
          grep -F "material.transparent = fabricType === 'mesh'" src/scene3d.js
          grep -F "material.depthWrite = fabricType !== 'mesh'" src/scene3d.js
          grep -F "overlayMaterial.opacity = GLASS_SURFACE_OPACITY" src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mesh-runtime-opacity.yml
          git add src/scene3d.js test/lightboxFabric.test.js test/coverModeExclusivity.test.js
          git commit -m 'fix: preserve glass opacity on mesh image load [skip ci]'
          git push origin ROG
