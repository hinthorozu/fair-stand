name: Standardize Module Behavior 45deg
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/standardize-module-behavior-45deg.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/standardize-module-behavior-45deg.py
      - run: node --check src/moduleBehavior.js
      - run: node --check src/modulePlacement.js
      - run: node --check src/moduleDragSidebar.js
      - run: node --check src/main.js
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "rotationStepDeg: 45" src/moduleBehavior.js
          grep -n "getModuleRotationStepDeg" src/moduleDragSidebar.js src/scene3d.js
          grep -n "eighthTurns" src/modulePlacement.js
      - run: rm -f .github/scripts/standardize-module-behavior-45deg.py .github/workflows/standardize-module-behavior-45deg.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: standardize module behavior and add 45deg rotation [skip ci]'
          branch: ROG
