name: Update Right Facing Tests

on:
  push:
    branches: [ROG]
    paths:
      - scripts/update-right-facing-tests.mjs
      - .github/workflows/update-right-facing-tests.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Update tests
        run: node scripts/update-right-facing-tests.mjs

      - name: Commit tests
        run: |
          if git diff --quiet -- test/moduleMove.test.js test/wallReflow.test.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/moduleMove.test.js test/wallReflow.test.js
          git commit -m "Update right-facing rotation expectations"
          git push origin HEAD:ROG
