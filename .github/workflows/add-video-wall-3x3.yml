name: Add Video Wall 3x3
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-video-wall-3x3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add-video-wall-3x3.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/add-video-wall-3x3.yml scripts/add-video-wall-3x3.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog.js .github/workflows/add-video-wall-3x3.yml scripts/add-video-wall-3x3.cjs
          git commit -m "Add Video Wall 3x3 catalog option"
          git push origin ROG
