name: Project Name First
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/project-name-first.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/project-name-first.cjs
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/project-name-first.yml .github/scripts/project-name-first.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/project-name-first.yml .github/scripts/project-name-first.cjs
          git commit -m "Put stand name first in project names"
          git push origin ROG
