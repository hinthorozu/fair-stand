name: Fix Shelf Light Homogeneous

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-shelf-light-homogeneous.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply homogeneous shelf lighting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text(encoding='utf-8')
          old = (
              "    if (shelfLightingOn) {\n"
              "      const light = new THREE.SpotLight(0xffffff, 22, 1.45, 0.95, 0.72, 1.5);\n"
              "      light.position.set(\n"
              "        0,\n"
              "        seamHeightM - 0.012,\n"
              "        wallDepthM / 2 + shelfDepthM * 0.58,\n"
              "      );\n"
              "      light.castShadow = false;\n"
              "      light.target.position.set(\n"
              "        0,\n"
              "        Math.max(0.04, seamHeightM - 0.72),\n"
              "        wallDepthM / 2 + shelfDepthM * 0.72,\n"
              "      );\n"
              "      light.userData.kind = 'decoration';\n"
              "      light.userData.role = 'shelf-under-light';\n"
              "      built.group.add(light, light.target);\n"
              "    }\n"
          )
          new = (
              "    if (shelfLightingOn) {\n"
              "      // Boydan boya lineer LED: raf geometrisine dokunmadan alt yüzeye oturur.\n"
              "      const ledStripWidthM = Math.max(innerWidthM - 0.04, 0.08);\n"
              "      const ledStripDepthM = 0.016;\n"
              "      const ledStripThicknessM = 0.006;\n"
              "      const shelfBottomY = seamHeightM;\n"
              "      const ledCenterZM = wallDepthM / 2 + shelfDepthM * 0.78;\n"
              "\n"
              "      const ledStrip = new THREE.Mesh(\n"
              "        new THREE.BoxGeometry(ledStripWidthM, ledStripThicknessM, ledStripDepthM),\n"
              "        new THREE.MeshStandardMaterial({\n"
              "          color: 0xfff8e8,\n"
              "          emissive: 0xffefc2,\n"
              "          emissiveIntensity: 3.0,\n"
              "          roughness: 0.28,\n"
              "          metalness: 0,\n"
              "        }),\n"
              "      );\n"
              "      ledStrip.position.set(\n"
              "        0,\n"
              "        shelfBottomY - ledStripThicknessM / 2 - 0.001,\n"
              "        ledCenterZM,\n"
              "      );\n"
              "      ledStrip.userData.kind = 'decoration';\n"
              "      ledStrip.userData.role = 'shelf-under-led-strip';\n"
              "      built.group.add(ledStrip);\n"
              "\n"
              "      // Geniş alan ışığı spot konisini kaldırır ve raf eni boyunca homojen yayılır.\n"
              "      const areaLight = new THREE.RectAreaLight(\n"
              "        0xfff3d6,\n"
              "        8.5,\n"
              "        ledStripWidthM,\n"
              "        Math.max(shelfDepthM * 0.72, 0.12),\n"
              "      );\n"
              "      areaLight.position.set(\n"
              "        0,\n"
              "        shelfBottomY - 0.008,\n"
              "        wallDepthM / 2 + shelfDepthM * 0.56,\n"
              "      );\n"
              "      areaLight.lookAt(new THREE.Vector3(\n"
              "        0,\n"
              "        shelfBottomY - 1,\n"
              "        wallDepthM / 2 + shelfDepthM * 0.56,\n"
              "      ));\n"
              "      areaLight.userData.kind = 'decoration';\n"
              "      areaLight.userData.role = 'shelf-under-light';\n"
              "      built.group.add(areaLight);\n"
              "    }\n"
          )
          if old not in s:
              raise SystemExit('old shelf spotlight block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          tpath = Path('test/shelfLighting.test.js')
          t = tpath.read_text(encoding='utf-8')
          old_assert = "  assert.match(source, /new THREE\\.SpotLight\\(0xffffff, 22, 1\\.45, 0\\.95, 0\\.72, 1\\.5\\)/);\n"
          new_assert = "  assert.match(source, /new THREE\\.RectAreaLight\\(/);\n  assert.match(source, /shelf-under-led-strip/);\n  assert.match(source, /shelfBottomY - ledStripThicknessM \\/ 2 - 0\\.001/);\n"
          if old_assert not in t:
              raise SystemExit('old shelf light test assertion not found')
          tpath.write_text(t.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/shelfLighting.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/fix-shelf-light-homogeneous.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/shelfLighting.test.js .github/workflows/fix-shelf-light-homogeneous.yml
          git commit -m "fix: make shelf lighting linear and homogeneous [skip ci]"
          git push origin ROG
