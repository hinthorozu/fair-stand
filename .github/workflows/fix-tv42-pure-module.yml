name: Fix TV 42 Pure Module
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-tv42-pure-module.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-tv42-pure-module.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/tv42Module.test.js')
          s = p.read_text()
          s = s.replace("assert.equal(getModuleGhostBehavior({ type: 'tv' }).mode, 'proxy');", "assert.equal(getModuleGhostBehavior({ type: 'tv' }).kind, 'real-model');\n  assert.equal(getModuleGhostBehavior({ type: 'tv' }).renderer, 'tv');")
          p.write_text(s)
          PY
      - run: node --check src/designState.js && node --check src/moduleBehavior.js && node --check src/main.js && node --check src/scene3d.js && node --check test/tv42Module.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "does not inherit flat panel state" test/tv42Module.test.js
          grep -n "renderer: 'tv'" src/moduleBehavior.js
          grep -n "function createTvModule" src/scene3d.js
      - run: rm -f .github/scripts/fix-tv42-pure-module.py .github/workflows/fix-tv42-pure-module.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make TV 42 a pure GLB module [skip ci]'
          branch: ROG
