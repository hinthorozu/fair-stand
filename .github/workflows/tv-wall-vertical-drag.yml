name: TV Wall Vertical Drag
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/tv-wall-vertical-drag.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/tv-wall-vertical-drag.py
      - run: node --check src/scene3d.js && node --check test/tv42Module.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/tv-wall-vertical-drag.py .github/workflows/tv-wall-vertical-drag.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: move TV on wall in 10 cm steps [skip ci]'
          branch: ROG
