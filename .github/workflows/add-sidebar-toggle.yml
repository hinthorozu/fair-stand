name: Add Collapsible Sidebar
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/add-sidebar-toggle.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/add-sidebar-toggle.py
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: grep -n "sidebar-toggle\|sidebar-collapsed" index.html src/style.css src/main.js
      - run: rm -f .github/scripts/add-sidebar-toggle.py .github/workflows/add-sidebar-toggle.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: add collapsible main sidebar [skip ci]'
          branch: ROG
