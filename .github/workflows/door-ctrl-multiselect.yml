name: Door Ctrl Multiselect

on:
  push:
    branches: [ROG]
    paths:
      - scripts/patch_door_ctrl_multiselect.py
      - .github/workflows/door-ctrl-multiselect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/patch_door_ctrl_multiselect.py
      - name: Syntax check
        run: node --check src/scene3d.js && node --check src/rectSelection.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/patch_door_ctrl_multiselect.py .github/workflows/door-ctrl-multiselect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make door upper panels ctrl-selectable [skip ci]"
          git push origin ROG
