name: Integrate Beige Sofa Mesh

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/integrate-beige-sofa-glb.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover extracted source mesh payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma
          import struct

          part_paths = [Path(f'.github/tmp/beige_mesh_part0{i}.b64') for i in range(1, 8)]
          parts = [path.read_text(encoding='ascii').strip() for path in part_paths]
          encoded = ''.join(parts)

          # One character was lost while the source mesh staging text was split.
          # Do not guess its value: test only actual split boundaries and accept a
          # candidate exclusively when XZ validation succeeds and the packed mesh
          # has the exact expected length.
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          boundaries = {0}
          cursor = 0
          for part in parts:
              cursor += len(part)
              boundaries.add(cursor)
          # part01 itself was assembled from two staging halves.
          boundaries.add(len(parts[0]) // 2)
          boundaries.add((len(parts[0]) + 1) // 2)

          packed = None
          repair = None
          for position in sorted(boundaries):
              for char in alphabet:
                  candidate = encoded[:position] + char + encoded[position:]
                  try:
                      compressed = base64.b64decode(candidate, validate=True)
                      decoded = lzma.decompress(compressed)
                  except Exception:
                      continue
                  if len(decoded) == 123333:
                      packed = decoded
                      repair = (position, char)
                      break
              if packed is not None:
                  break

          if packed is None:
              raise SystemExit('Staged source mesh could not be checksum-validated/recovered')
          print('Recovered source payload:', len(packed), 'bytes; repair=', repair)

          meta = [
              ('beigechair2seatsofa_tripo_mat_0691346e_0', 5592, 7586,
               [-0.04798666015267372, 0.0002856234787032008, -0.04909035190939903],
               [-0.0006629818235523999, 0.025941653177142143, -0.0029292176477611065],
               0, 30836, 30836, 28459),
              ('beigechair1_tripo_mat_0691346e_0', 2980, 3832,
               [-0.035586677491664886, 2.644560765929782e-07, 0.020847946405410767],
               [-0.008809005841612816, 0.026153039187192917, 0.04909035190939903],
               59295, 16856, 76151, 14318),
              ('beigechair3_tripo_mat_0691346e_0', 3272, 4026,
               [0.019002314656972885, 0.0, -0.038246769458055496],
               [0.04798666015267372, 0.026116475462913513, -0.010590252466499805],
               90469, 18007, 108476, 14857),
          ]

          def decode_varints(data, expected):
              values = []
              value = 0
              shift = 0
              for byte in data:
                  value |= (byte & 0x7f) << shift
                  if byte & 0x80:
                      shift += 7
                      continue
                  values.append(value)
                  value = 0
                  shift = 0
              if value or shift:
                  raise RuntimeError('Incomplete varint payload')
              if len(values) != expected:
                  raise RuntimeError(f'Expected {expected} values, got {len(values)}')
              return values

          def unzigzag(value):
              return (value >> 1) ^ -(value & 1)

          output = bytearray()
          manifest = []
          for name, vertex_count, face_count, mins, maxs, pos_off, pos_len, idx_off, idx_len in meta:
              encoded_positions = decode_varints(
                  packed[pos_off:pos_off + pos_len], vertex_count * 3,
              )
              signed_position_deltas = [unzigzag(value) for value in encoded_positions]

              axes = []
              cursor = 0
              for axis in range(3):
                  previous = 0
                  quantized = []
                  for delta in signed_position_deltas[cursor:cursor + vertex_count]:
                      previous += delta
                      quantized.append(previous)
                  cursor += vertex_count
                  span = maxs[axis] - mins[axis]
                  axes.append([
                      mins[axis] + (value / 65535.0) * span
                      for value in quantized
                  ])

              position_offset = len(output)
              for index in range(vertex_count):
                  output += struct.pack('<fff', axes[0][index], axes[1][index], axes[2][index])

              encoded_indices = decode_varints(
                  packed[idx_off:idx_off + idx_len], face_count * 3,
              )
              previous = 0
              indices = []
              for value in encoded_indices:
                  previous += unzigzag(value)
                  if previous < 0 or previous >= vertex_count:
                      raise RuntimeError(f'Invalid vertex index {previous} for {name}')
                  indices.append(previous)

              index_offset = len(output)
              for index in indices:
                  output += struct.pack('<H', index)

              manifest.append((name, vertex_count, face_count, position_offset, index_offset))

          target = Path('public/models/beige_sofa_mesh.bin')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(output)
          if len(output) != 234792:
              raise RuntimeError(f'Unexpected mesh payload size: {len(output)}')
          print('Beige sofa mesh:', len(output), 'bytes')
          print('Manifest:', manifest)
          PY

      - name: Replace only beige procedural renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/scene3d.js')
          text = path.read_text(encoding='utf-8')

          loader_anchor = """function loadEamesChairModel() {
            if (!eamesChairModelPromise) {
              const loader = new GLTFLoader();
              eamesChairModelPromise = loader
                .loadAsync(import.meta.env.BASE_URL + 'models/eames_chair.glb')
                .then((gltf) => gltf.scene);
            }
            return eamesChairModelPromise;
          }
          """
          loader_block = loader_anchor + """
          const BEIGE_SOFA_MESH_META = Object.freeze([
            Object.freeze({ name: 'beigechair2seatsofa_tripo_mat_0691346e_0', vertexCount: 5592, faceCount: 7586, positionOffset: 0, indexOffset: 67104 }),
            Object.freeze({ name: 'beigechair1_tripo_mat_0691346e_0', vertexCount: 2980, faceCount: 3832, positionOffset: 112620, indexOffset: 148380 }),
            Object.freeze({ name: 'beigechair3_tripo_mat_0691346e_0', vertexCount: 3272, faceCount: 4026, positionOffset: 171372, indexOffset: 210636 }),
          ]);
          let beigeSofaMeshPromise = null;

          function loadBeigeSofaMeshPayload() {
            if (!beigeSofaMeshPromise) {
              beigeSofaMeshPromise = fetch(
                import.meta.env.BASE_URL + 'models/beige_sofa_mesh.bin',
              ).then((response) => {
                if (!response.ok) {
                  throw new Error('Bej koltuk modeli yüklenemedi (' + response.status + ')');
                }
                return response.arrayBuffer();
              });
            }
            return beigeSofaMeshPromise;
          }
          """

          if 'function loadBeigeSofaMeshPayload()' not in text:
              if loader_anchor not in text:
                  raise SystemExit('Eames loader anchor not found')
              text = text.replace(loader_anchor, loader_block, 1)

          renderer = r"""function createBeigeSofaSetModule(moduleState, moduleIndex) {
            const widthCm = Number(moduleState.widthCm || 150);
            const depthCm = Number(moduleState.depthCm || 150);
            const heightCm = Number(moduleState.heightCm || 78);
            const widthM = widthCm / 100;
            const depthM = depthCm / 100;
            const heightM = heightCm / 100;
            const group = new THREE.Group();
            group.userData = {
              kind: 'module',
              moduleIndex,
              moduleId: moduleState.id,
              type: 'sofa-set-beige',
              widthCm,
              depthCm,
              heightCm,
            };

            const colorTargets = [];
            const proxy = new THREE.Mesh(
              new THREE.BoxGeometry(widthM, heightM, depthM),
              new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0,
                depthWrite: false,
                colorWrite: false,
              }),
            );
            proxy.position.set(0, heightM / 2, depthM / 2);
            group.add(proxy);

            const selectionFrame = createSelectionFrame(widthM, heightM);
            selectionFrame.visible = false;
            proxy.add(selectionFrame);
            proxy.userData = {
              kind: 'surface',
              moduleType: 'sofa-set-beige',
              selectionMode: 'module',
              acceptsImage: false,
              moduleIndex,
              moduleId: moduleState.id,
              widthCm,
              stripIndex: null,
              stripNumber: null,
              surfaceRole: 'furniture',
              surfaceId: moduleState.surface?.id,
              surfaceState: moduleState.surface,
              selectionFrame,
              colorTargets,
            };

            loadBeigeSofaMeshPayload().then((buffer) => {
              if (!group.parent) return;

              const model = new THREE.Group();
              const material = new THREE.MeshStandardMaterial({
                color: moduleState.surface?.color ?? '#e7ddca',
                roughness: 0.60,
                metalness: 0,
              });

              BEIGE_SOFA_MESH_META.forEach((meta) => {
                const positionCount = meta.vertexCount * 3;
                const indexCount = meta.faceCount * 3;
                const positions = new Float32Array(
                  buffer.slice(meta.positionOffset, meta.positionOffset + positionCount * 4),
                );
                const indices = new Uint16Array(
                  buffer.slice(meta.indexOffset, meta.indexOffset + indexCount * 2),
                );
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();
                geometry.computeBoundingSphere();

                const mesh = new THREE.Mesh(geometry, material.clone());
                mesh.name = meta.name;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                colorTargets.push(mesh);
                model.add(mesh);
              });

              model.updateMatrixWorld(true);
              let box = new THREE.Box3().setFromObject(model);
              const size = box.getSize(new THREE.Vector3());
              const footprint = Math.max(size.x, size.z);
              const targetFootprint = Math.min(widthM, depthM);
              const scale = footprint > 0 ? targetFootprint / footprint : 1;
              model.scale.setScalar(scale);
              model.updateMatrixWorld(true);

              box = new THREE.Box3().setFromObject(model);
              const center = box.getCenter(new THREE.Vector3());
              model.position.x -= center.x;
              model.position.z += (depthM / 2) - center.z;
              model.position.y -= box.min.y;
              group.add(model);
            }).catch((error) => {
              console.warn('Bej koltuk takımı kaynak modeli yüklenemedi:', error);
            });

            return { group, surfaces: [proxy] };
          }"""

          pattern = re.compile(
              r"function createBeigeSofaSetModule\(moduleState, moduleIndex\) \{.*?\n\}\n\nfunction createSofaSetModule",
              re.S,
          )
          text, count = pattern.subn(renderer + "\n\nfunction createSofaSetModule", text, count=1)
          if count != 1:
              raise SystemExit(f'Beige renderer replacement count={count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify requested behavior
        shell: bash
        run: |
          test "$(stat -c%s public/models/beige_sofa_mesh.bin)" -eq 234792
          grep -q "models/beige_sofa_mesh.bin" src/scene3d.js
          grep -q "beigechair2seatsofa_tripo_mat_0691346e_0" src/scene3d.js
          grep -q "beigechair1_tripo_mat_0691346e_0" src/scene3d.js
          grep -q "beigechair3_tripo_mat_0691346e_0" src/scene3d.js
          grep -q "function createSofaSetModule" src/scene3d.js
          grep -q "moduleType === 'sofa-set-beige'" src/modulePlacement.js
          grep -q "? 10" src/modulePlacement.js

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Commit integration and remove staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp/beige_mesh_part*.b64
          rm -f .github/tmp/beige_sofa_glb_part*.b64
          rm -f .github/tmp/beige_sofa_model.glb.gz
          rm -f .github/tmp/beige_sofa_trigger.txt
          rm -f .github/tmp/beige_exact_mesh.xz.b64
          git add -A src/scene3d.js public/models/beige_sofa_mesh.bin .github/tmp
          git commit -m "fix: use extracted beige sofa source mesh [skip ci]"
          git push origin ROG
