name: Mesh Branda Rerun

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/rerun-mesh-branda.yml'

permissions:
  contents: write

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply prepared Mesh Branda patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/add-mesh-branda.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          if start_marker not in workflow:
              raise SystemExit('mesh patch start marker not found')
          body = workflow.split(start_marker, 1)[1]
          if end_marker not in body:
              raise SystemExit('mesh patch end marker not found')
          patch_script = textwrap.dedent(body.split(end_marker, 1)[0])
          Path('/tmp/mesh_patch.py').write_text(patch_script + '\n', encoding='utf-8')
          PY
          python3 /tmp/mesh_patch.py

      - name: Update Lightbox role contract for typed covers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/lightboxFabric.test.js')
          text = path.read_text(encoding='utf-8')
          old = "  assert.match(scene, /role = 'lightbox-fabric'/);"
          new = r"  assert.match(scene, /overlay\.userData\.role = fabricType === 'mesh' \? 'mesh-branda' : 'lightbox-fabric'/);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'lightbox role assertion: expected 1 match, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check src/moduleContextMenu.js
          node --check src/main.js
          node --check src/scene3d.js
          node --check src/helpGuide.js
          node --check test/lightboxFabric.test.js

      - name: Install
        run: npm ci

      - name: Test and build
        run: |
          set +e
          {
            echo '=== npm test ==='
            npm test
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              exit "$test_status"
            fi
            echo '=== npm run build ==='
            npm run build
          } 2>&1 | tee /tmp/mesh-branda-validation.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/mesh-branda-validation.log mesh-branda-validation.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mesh-branda-validation.log
            git commit -m 'chore: capture mesh branda validation failure [skip ci]' || true
            git push origin ROG || true
            exit "$status"
          fi

      - name: Commit and push Mesh Branda
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-mesh-branda.yml .github/workflows/rerun-mesh-branda.yml
          git rm -f mesh-branda-validation.log 2>/dev/null || true
          git add src/moduleContextMenu.js src/main.js src/scene3d.js src/helpGuide.js test/lightboxFabric.test.js
          git commit -m 'feat: add perforated mesh branda mode [skip ci]'
          git push origin ROG
