name: F011 LED Duplication Self Edit

on:
  push:
    branches:
      - remediation/a03-f011-module-behavior-policy
    paths:
      - '.github/workflows/f011-led-duplication-self-edit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/a03-f011-module-behavior-policy
          fetch-depth: 0

      - name: Route LED duplicate selection through module behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('src/main.js')
          source = main.read_text(encoding='utf-8')

          old_import = "import { getModuleDefaultRotationDeg } from './moduleBehavior.js';"
          new_import = "import { getModuleDefaultRotationDeg, isTopPlacementModule } from './moduleBehavior.js';"
          assert source.count(old_import) == 1, 'expected moduleBehavior import exactly once'
          source = source.replace(old_import, new_import, 1)

          old_condition = "if (sourceModule.type === 'led-floodlight' && sourceModule.placement) {"
          new_condition = "if (isTopPlacementModule(sourceModule) && sourceModule.placement) {"
          assert source.count(old_condition) == 1, 'expected LED duplicate type check exactly once'
          source = source.replace(old_condition, new_condition, 1)
          main.write_text(source, encoding='utf-8')

          test_path = Path('test/moduleBehaviorPolicy.test.js')
          test_source = test_path.read_text(encoding='utf-8')

          old_test_import = "  getModuleMagneticSnapStrategy,\n  resolveSideInsertRotationDeg,"
          new_test_import = "  getModuleMagneticSnapStrategy,\n  isTopPlacementModule,\n  resolveSideInsertRotationDeg,"
          assert test_source.count(old_test_import) == 1, 'expected policy test import location once'
          test_source = test_source.replace(old_test_import, new_test_import, 1)

          old_assertions = "  assert.equal(countsTowardWallCapacity('led-floodlight'), false);\n  assert.equal(countsTowardWallCapacity('flat-panel'), true);"
          new_assertions = "  assert.equal(countsTowardWallCapacity('led-floodlight'), false);\n  assert.equal(countsTowardWallCapacity('flat-panel'), true);\n  assert.equal(isTopPlacementModule('led-floodlight'), true);\n  assert.equal(isTopPlacementModule('flat-panel'), false);"
          assert test_source.count(old_assertions) == 1, 'expected wall-capacity assertions once'
          test_source = test_source.replace(old_assertions, new_assertions, 1)

          addition = """

          test('controller routes top-fixture duplication through moduleBehavior instead of a LED type check', () => {
            const source = readFileSync(new URL('../src/main.js', import.meta.url), 'utf8');
            assert.doesNotMatch(source, /sourceModule\\.type === 'led-floodlight'/);
            assert.match(source, /isTopPlacementModule\\(sourceModule\\)/);
          });
          """
          assert "controller routes top-fixture duplication through moduleBehavior" not in test_source
          test_source = test_source.rstrip() + addition
          test_path.write_text(test_source, encoding='utf-8')

          workflow = Path('.github/workflows/f011-led-duplication-self-edit.yml')
          workflow.unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js test/moduleBehaviorPolicy.test.js .github/workflows/f011-led-duplication-self-edit.yml
          git commit -m 'Route top-fixture duplication through module behavior'
          git push origin HEAD:remediation/a03-f011-module-behavior-policy
