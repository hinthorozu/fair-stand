name: Add vine separators
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/add-vine-separators.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch vine separator catalog and renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Catalog: add 50/100 vine variants next to the normal separators.
          replace_once('src/catalog.js',
          "  wall_separator_100: { type: 'separator', widthCm: 100, label: 'Separatör 100' },\n  wall_separator_50: { type: 'separator', widthCm: 50, label: 'Separatör 50' },",
          "  wall_separator_100: { type: 'separator', widthCm: 100, label: 'Separatör 100' },\n  wall_separator_50: { type: 'separator', widthCm: 50, label: 'Separatör 50' },\n  wall_separator_100_sarmasik: { type: 'separator', widthCm: 100, modelFile: 'wall_separator_100_sarmasik.glb', label: 'Separatör 100 Sarmaşık' },\n  wall_separator_50_sarmasik: { type: 'separator', widthCm: 50, modelFile: 'wall_separator_50_sarmasik.glb', label: 'Separatör 50 Sarmaşık' },")

          replace_once('src/catalog.js',
          "  'wall_separator_100',\n  'wall_separator_50',",
          "  'wall_separator_100',\n  'wall_separator_50',\n  'wall_separator_100_sarmasik',\n  'wall_separator_50_sarmasik',")

          replace_once('src/catalog.js',
          "'wall_separator_100', 'wall_separator_50', 'wall_base_200'",
          "'wall_separator_100', 'wall_separator_50', 'wall_separator_100_sarmasik', 'wall_separator_50_sarmasik', 'wall_base_200'")

          # State: preserve the GLB model descriptor while keeping type=separator.
          replace_once('src/designState.js',
          "export function createSeparatorModuleState(widthCm) {\n  return {\n    id: createId('module'),\n    type: 'separator',\n    widthCm,",
          "export function createSeparatorModuleState(widthCm, descriptor = {}) {\n  return {\n    id: createId('module'),\n    type: 'separator',\n    widthCm,\n    modelFile: descriptor.modelFile ?? null,")

          # Catalog creation: pass the full descriptor so modelFile survives.
          replace_once('src/main.js',
          "else if (module.type === 'separator') state = createSeparatorModuleState(module.widthCm);",
          "else if (module.type === 'separator') state = createSeparatorModuleState(module.widthCm, module);")

          # Renderer: normal separator stays procedural/editable; GLB contributes only the fixed vines.
          replace_once('src/scene3d.js',
          "  group.add(selector);\n\n  return { group, surfaces: [selector] };\n}\n\nfunction createShowcaseModule",
          "  group.add(selector);\n\n  if (moduleState.modelFile) {\n    loadIndoorPlantModel(moduleState.modelFile).then((template) => {\n      if (!group.parent) return;\n      const model = template.clone(true);\n      let visibleVineCount = 0;\n      model.traverse((child) => {\n        if (!child.isMesh) return;\n        const targetName = [child.name, child.geometry?.name, child.material?.name].filter(Boolean).join(' ');\n        const isVine = /Vines_FIXED_/i.test(targetName);\n        child.visible = isVine;\n        if (!isVine) return;\n        visibleVineCount += 1;\n        child.castShadow = true;\n        child.receiveShadow = true;\n        child.raycast = () => {};\n      });\n      if (!visibleVineCount) {\n        console.warn('Sarmaşık separatör GLB içinde Vines_FIXED mesh bulunamadı:', moduleState.modelFile);\n        return;\n      }\n      group.add(model);\n    }).catch((error) => {\n      console.warn('Sarmaşık separatör GLB modeli yüklenemedi:', moduleState.modelFile, error);\n    });\n  }\n\n  return { group, surfaces: [selector] };\n}\n\nfunction createShowcaseModule")

          # Catalog icon: keep the normal separator icon and overlay a green vine pattern.
          replace_once('src/moduleDragSidebar.js',
          "    .module-drag-separator { height:68px; border:3px solid ${ALUMINUM_PROFILE_COLOR}; background:repeating-linear-gradient(to bottom,#c79b63 0 2px,#eef2f6 2px 4px); box-shadow:0 2px 5px rgba(15,23,42,.08); }",
          "    .module-drag-separator { position:relative; height:68px; border:3px solid ${ALUMINUM_PROFILE_COLOR}; background:repeating-linear-gradient(to bottom,#c79b63 0 2px,#eef2f6 2px 4px); box-shadow:0 2px 5px rgba(15,23,42,.08); }\n    .module-drag-separator.is-vine::after { content:''; position:absolute; inset:2px 7px; pointer-events:none; background:radial-gradient(ellipse at 22% 12%,#5f8e5c 0 4px,transparent 4.5px),radial-gradient(ellipse at 68% 23%,#6f9f69 0 4px,transparent 4.5px),radial-gradient(ellipse at 35% 38%,#547f51 0 4px,transparent 4.5px),radial-gradient(ellipse at 72% 52%,#6a9864 0 4px,transparent 4.5px),radial-gradient(ellipse at 28% 66%,#5b8957 0 4px,transparent 4.5px),radial-gradient(ellipse at 64% 82%,#709f68 0 4px,transparent 4.5px),linear-gradient(75deg,transparent 46%,#4d784b 47% 51%,transparent 52%),linear-gradient(105deg,transparent 48%,#5c8757 49% 52%,transparent 53%); opacity:.98; }")

          replace_once('src/moduleDragSidebar.js',
          "    body.className = 'module-drag-separator';\n    body.style.width = `${previewWidthPx(module.widthCm)}px`;",
          "    body.className = 'module-drag-separator';\n    if (module.modelFile) body.classList.add('is-vine');\n    body.style.width = `${previewWidthPx(module.widthCm)}px`;")

          # Remove this one-shot workflow from the resulting commit.
          Path('.github/workflows/add-vine-separators.yml').unlink(missing_ok=True)
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/catalog.js src/designState.js src/main.js src/scene3d.js src/moduleDragSidebar.js .github/workflows/add-vine-separators.yml
          git commit -m "Add vine separator catalog variants"
          git push origin ROG
