name: Fix sidebar collapse spacing once
on:
  push:
    paths:
      - 'scripts/fix-sidebar-collapse-spacing.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/fix-sidebar-collapse-spacing.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          git config user.name OpenAI
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/style.css
          git commit -m "Preserve original panel card spacing with collapse" || exit 0
          git push
