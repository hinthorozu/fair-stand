name: Update FAZ 3 Roadmap UI

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/update-faz3-roadmap-ui.mjs'
      - '.github/workflows/update-faz3-roadmap-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-faz3-roadmap-ui.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Update FAZ 3 roadmap status and UI polish task"
          git push origin ROG
