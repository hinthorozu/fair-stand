name: Add Fridge Top Label

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/add-fridge-top-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add BUZ DOLABI label
        run: python3 .github/scripts/add-fridge-top-label.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/miniFridgeTopLabel.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: label mini fridge top [skip ci]"
            git push origin ROG
          fi
