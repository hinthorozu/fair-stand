name: Straighten Beige Chairs

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/straighten-beige-chairs.yml'

permissions:
  contents: write

jobs:
  straighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/straighten-beige-chairs.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/straighten-beige-chairs.py .github/workflows/straighten-beige-chairs.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: straighten beige single chairs [skip ci]'
          branch: ROG
