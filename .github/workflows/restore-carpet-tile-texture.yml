name: Restore Carpet Tile Texture
on:
  push:
    branches: [ROG]
    paths:
      - scripts/restore-carpet-tile-texture.mjs
      - .github/workflows/restore-carpet-tile-texture.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/restore-carpet-tile-texture.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/scene3d.js
          git diff --cached --quiet || git commit -m "Restore original carpet tile texture"
          git push origin ROG
