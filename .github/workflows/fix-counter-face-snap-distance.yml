name: Fix Counter Face Snap Distance

on:
  push:
    branches: [ROG]
    paths:
      - scripts/fix-counter-face-snap-distance.mjs
      - .github/workflows/fix-counter-face-snap-distance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply patch
        run: node scripts/fix-counter-face-snap-distance.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md
          git diff --cached --quiet || git commit -m "Fix banko face snap distance"
          git push origin ROG
