name: Fix Floor Color Reference

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/fix-floor-color-reference.mjs'
      - '.github/workflows/fix-floor-color-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/fix-floor-color-reference.mjs
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix floor color reference regression"
            git push origin ROG
          fi
