name: Resize Beige Loveseat V2
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/resize-beige-loveseat-v2.yml']
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - run: perl -0pi -e 's/rotationYDeg: -135\.26002361732807/rotationYDeg: -45.26002361732807/' src/scene3d.js
      - run: perl -0pi -e "s/const uniformScale = orientedSize\.x > 0\n        \? \(placement\.targetWidthM \/ orientedSize\.x\)\n        : 1;/const isLoveseat = placement.meshName === 'beigechair2seatsofa_tripo_mat_0691346e_0';\n      const loveseatSizeCorrection = isLoveseat ? 1.50 : 1;\n      const uniformScale = orientedSize.x > 0\n        ? (placement.targetWidthM \/ orientedSize.x) * loveseatSizeCorrection\n        : loveseatSizeCorrection;/" src/scene3d.js
      - run: npm install && npm test && npm run build
      - run: rm -f .github/workflows/resize-beige-loveseat-v2.yml .github/workflows/resize-beige-loveseat-only.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resize beige loveseat only [skip ci]'
          git push