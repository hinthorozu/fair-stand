name: Apply Base Module

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-base-module.mjs
      - .github/workflows/apply-base-module.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/apply-base-module.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test Changelog.md PROJECT_RULES.md ROADMAP.md
          git diff --cached --quiet || git commit -m "Add Maxima base modules"
          git push origin ROG
