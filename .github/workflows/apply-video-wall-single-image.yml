name: Apply video wall single image
on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch-video-wall-single-image.cjs'
      - '.github/workflows/apply-video-wall-single-image.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-video-wall-single-image.cjs
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js
          git commit -m "Render one image across video wall"
          git push origin ROG
