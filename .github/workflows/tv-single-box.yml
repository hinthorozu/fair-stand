name: TV Single Box
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/tv-single-box.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/make-tv-single-box.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f scripts/make-tv-single-box.py .github/workflows/tv-single-box.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make TV a single textured 5cm box [skip ci]'
          branch: ROG
