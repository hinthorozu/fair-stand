name: Apply sidebar collapsible panels once

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/apply-sidebar-collapsible-panels-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/add-sidebar-collapsible-panels.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          rm .github/workflows/apply-sidebar-collapsible-panels-once.yml
          rm scripts/add-sidebar-collapsible-panels.py
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/style.css .github/workflows/apply-sidebar-collapsible-panels-once.yml scripts/add-sidebar-collapsible-panels.py
          git commit -m "Make sidebar panels collapsible"
          git push origin ROG
