name: Patch Long Planter Preview

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/patch-long-planter-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Patch catalog preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/moduleDragSidebar.js')
          s = p.read_text()

          css_anchor = "    .module-drag-plant-1 .leaf-c, .module-drag-plant-1 .leaf-d { display:none; }\n"
          css_add = css_anchor + "    .module-drag-long-planter { position:relative; width:76px; height:54px; transform:translateY(6px); }\n    .module-drag-long-planter-pot { position:absolute; left:7px; right:7px; bottom:2px; height:15px; border:2px solid #8b8f94; border-top:0; border-radius:0 0 5px 5px; background:#ffffff; box-sizing:border-box; box-shadow:0 2px 3px rgba(15,23,42,.10); }\n    .module-drag-long-planter-soil { position:absolute; left:9px; right:9px; bottom:15px; height:5px; border-radius:50%; background:#776a5c; }\n    .module-drag-long-planter-leaves { position:absolute; left:9px; right:9px; bottom:18px; height:28px; background:repeating-linear-gradient(100deg, transparent 0 6px, #6f956f 6px 10px, transparent 10px 13px); clip-path:polygon(0 100%,5% 38%,12% 67%,18% 12%,25% 70%,32% 25%,39% 75%,46% 5%,53% 72%,61% 20%,68% 75%,76% 15%,83% 67%,91% 28%,100% 100%); }\n"
          if '.module-drag-long-planter {' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_add, 1)

          branch_anchor = "  if (module.type === 'indoor-plant-1') {\n"
          branch = "  if (module.type === 'indoor-plant-1' && module.modelFile === 'saksi_bitkili_100x30x30.glb') {\n    const planter = document.createElement('div');\n    planter.className = 'module-drag-long-planter';\n    ['pot', 'soil', 'leaves'].forEach((part) => {\n      const element = document.createElement('i');\n      element.className = `module-drag-long-planter-${part}`;\n      planter.appendChild(element);\n    });\n    preview.appendChild(planter);\n    return preview;\n  }\n\n" + branch_anchor
          if "module.modelFile === 'saksi_bitkili_100x30x30.glb'" not in s:
              if branch_anchor not in s:
                  raise SystemExit('Plant preview anchor not found')
              s = s.replace(branch_anchor, branch, 1)

          p.write_text(s)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-long-planter-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/moduleDragSidebar.js .github/workflows/patch-long-planter-preview.yml
          git commit -m 'fix: show long planter preview in catalog'
          git push origin ROG
