name: Fix Free Top Fixture Drop
on:
  push:
    paths:
      - 'scripts/fix-free-top-fixture-drop.mjs'
      - '.github/workflows/fix-free-top-fixture-drop.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-free-top-fixture-drop.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add src/scene3d.js
          git commit -m "Fix free LED floodlight drop" || exit 0
          git push origin ROG
