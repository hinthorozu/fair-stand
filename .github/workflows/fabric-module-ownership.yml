name: Fabric Module Ownership Fix

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_fabric_module_ownership.py'
      - '.github/workflows/fabric-module-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize patch helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch_fabric_module_ownership.py')
          s = p.read_text(encoding='utf-8')
          old = '''# Existing explicit fabric removals must also clear ownership metadata.
          old_delete_tail = "          delete surface.userData.surfaceState.fabricLightingOn;\\n"
          new_delete_tail = """          delete surface.userData.surfaceState.fabricLightingOn;\\n          delete surface.userData.surfaceState.fabricOwnerSurfaceIds;\\n          delete surface.userData.surfaceState.fabricOwnerModuleIds;\\n"""
          count = scene.count(old_delete_tail)
          if count < 2:
              raise SystemExit(f'fabric deletion metadata: expected at least 2 matches, found {count}')
          scene = scene.replace(old_delete_tail, new_delete_tail)
          '''
          new = '''# Existing explicit fabric removals must also clear ownership metadata.
          import re
          pattern = r'(?m)^(\\s*)delete surface\\.userData\\.surfaceState\\.fabricLightingOn;$'
          def add_owner_cleanup(match):
              indent = match.group(1)
              return (
                  match.group(0)
                  + '\\n' + indent + 'delete surface.userData.surfaceState.fabricOwnerSurfaceIds;'
                  + '\\n' + indent + 'delete surface.userData.surfaceState.fabricOwnerModuleIds;'
              )
          scene, count = re.subn(pattern, add_owner_cleanup, scene)
          if count < 2:
              raise SystemExit(f'fabric deletion metadata: expected at least 2 matches, found {count}')
          '''
          if old not in s:
              raise SystemExit('patch helper cleanup block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply patch
        run: python3 scripts/patch_fabric_module_ownership.py

      - name: Syntax check
        run: node --check src/scene3d.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          rm -f scripts/patch_fabric_module_ownership.py
          rm -f .github/workflows/fabric-module-ownership.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: bind lightbox fabric ownership to modules [skip ci]'
          git push origin HEAD:ROG
