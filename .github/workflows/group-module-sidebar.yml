name: Group Module Sidebar

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/group-module-sidebar.py'
      - '.github/workflows/group-module-sidebar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/group-module-sidebar.py
      - name: Syntax check
        run: node --check src/moduleDragSidebar.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/group-module-sidebar.py .github/workflows/group-module-sidebar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/moduleDragSidebar.js scripts/group-module-sidebar.py .github/workflows/group-module-sidebar.yml
          git commit -m 'feat: group sidebar modules [skip ci]'
          git push origin ROG
