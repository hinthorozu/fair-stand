name: Fix Bar Stool Previews
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-bar-stool-previews.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-bar-stool-previews.py
      - run: node --check src/moduleDragSidebar.js
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "module-drag-bar-stool" src/moduleDragSidebar.js
          grep -n "Bar Taburesi uses a chair-shaped placement ghost" src/scene3d.js
          grep -n "return 'Bar Taburesi'" src/scene3d.js
      - run: rm -f .github/scripts/fix-bar-stool-previews.py .github/workflows/fix-bar-stool-previews.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: align bar stool catalog and drag previews [skip ci]'
          branch: ROG
