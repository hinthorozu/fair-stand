name: Apply Drag Enhancement Patch

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-drag-enhancement.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply scene drag patch
        run: node scripts/apply-drag-enhancement.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/scene3d.js; then
            echo "No scene patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git commit -m "Enable reflowing module drag across walls"
          git push origin HEAD:ROG
