name: Camera Relative Arrows

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/camera-relative-arrows.py'
      - '.github/workflows/camera-relative-arrows.yml'

jobs:
  patch-test-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/camera-relative-arrows.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/camera-relative-arrows.py .github/workflows/camera-relative-arrows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make arrow movement camera-relative [skip ci]"
          git push origin ROG
