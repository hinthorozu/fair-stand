name: Enlarge Beige Single Chairs
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/enlarge-beige-single-chairs.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/enlarge-beige-single-chairs.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/enlarge-beige-single-chairs.py .github/workflows/enlarge-beige-single-chairs.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: enlarge beige single chairs [skip ci]'
          branch: ROG
