name: Temporary clockwise rotation direction fix

on:
  push:
    branches:
      - fix/clockwise-rotation-direction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clockwise-rotation-direction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch clockwise rotation sign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('src/scene3d.js')
          s = scene.read_text()
          old = "    const deltaDeg = 90;"
          new = "    const deltaDeg = -90;"
          if s.count(old) != 1:
              raise SystemExit(f'scene delta anchor mismatch: {s.count(old)}')
          scene.write_text(s.replace(old, new, 1))

          test = Path('test/viewKeyboardMainIntegration.test.js')
          t = test.read_text()
          old_assert = "assert.match(sceneSource, /const deltaDeg = 90;/);"
          new_assert = "assert.match(sceneSource, /const deltaDeg = -90;/);"
          if t.count(old_assert) != 1:
              raise SystemExit(f'integration delta assertion mismatch: {t.count(old_assert)}')
          test.write_text(t.replace(old_assert, new_assert, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js test/viewKeyboardMainIntegration.test.js
          git commit -m "Fix clockwise module rotation direction"
          git push origin HEAD:fix/clockwise-rotation-direction
