name: Tighten Panel Gaps

on:
  push:
    branches: [ROG]
    paths:
      - scripts/tighten-panel-gaps.mjs
      - .github/workflows/tighten-panel-gaps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply panel gap polish
        run: node scripts/tighten-panel-gaps.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js Changelog.md
          git diff --cached --quiet || git commit -m "Tighten panel face gaps"
          git push origin ROG
