name: Lightbox Fabric Performance

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/lightbox-fabric-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python3 scripts/patch_fabric_panel_perf.py

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/lightboxFabricPerformance.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/lightbox-fabric-performance.yml scripts/patch_fabric_panel_perf.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "perf: suspend hidden panel textures under fabric [skip ci]"
          git push origin ROG
