name: Fix 45deg Ghost
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-45deg-ghost.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-45deg-ghost.py
      - run: node --check src/modulePlacement.js
      - run: node --check tests/moduleBehavior.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "snapCm(pointerXCm" src/modulePlacement.js
          grep -n "Bar Taburesi 45 degree catalog preview placement stays valid" tests/moduleBehavior.test.js
          grep -n "straight Banko 45 degree catalog preview placement stays valid" tests/moduleBehavior.test.js
      - run: rm -f .github/scripts/fix-45deg-ghost.py .github/workflows/fix-45deg-ghost.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: keep placement ghost visible at 45deg [skip ci]'
          branch: ROG
