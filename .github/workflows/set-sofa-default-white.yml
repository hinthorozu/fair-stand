name: Set Sofa Default White
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/set-sofa-default-white.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/set-sofa-default-white.py
      - run: node --check src/designState.js
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/set-sofa-default-white.py .github/workflows/set-sofa-default-white.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make sofa upholstery white by default [skip ci]'
          branch: ROG
