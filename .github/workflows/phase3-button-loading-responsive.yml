name: Phase 3 Button Loading Responsive Polish

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/phase3-button-loading-responsive.mjs'
      - '.github/workflows/phase3-button-loading-responsive.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase3-button-loading-responsive.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/style.css src/main.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Standardize buttons loading and responsive layout"
            git push origin ROG
          fi
