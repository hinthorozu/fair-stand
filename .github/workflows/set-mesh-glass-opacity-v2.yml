name: Set Mesh Glass Opacity V2

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/set-mesh-glass-opacity-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: echo '' | base64 -d | python3
      - name: Verify
        run: |
          grep -F 'overlayMaterial.opacity = GLASS_SURFACE_OPACITY' src/scene3d.js
          grep -F 'const GLASS_SURFACE_OPACITY = 0.48' src/scene3d.js
          grep -F 'new THREE.PlaneGeometry(width, height)' src/scene3d.js
          ! grep -F 'overlayMaterial.alphaMap' src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/set-mesh-glass-opacity.yml
          git rm .github/workflows/set-mesh-glass-opacity-v2.yml
          git add src/scene3d.js test/coverModeExclusivity.test.js
          git commit -m 'fix: use glass opacity for one-piece mesh [skip ci]'
          git push origin ROG
