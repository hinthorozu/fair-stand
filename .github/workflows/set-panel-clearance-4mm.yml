name: Set Panel Clearance 4mm

on:
  push:
    branches: [ROG]
    paths:
      - scripts/set-panel-clearance-4mm.mjs
      - .github/workflows/set-panel-clearance-4mm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply 4 mm panel clearance
        run: node scripts/set-panel-clearance-4mm.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js Changelog.md
          git diff --cached --quiet || git commit -m "Set panel face clearance to 4mm"
          git push origin ROG
