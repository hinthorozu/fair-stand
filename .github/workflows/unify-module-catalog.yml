name: Unify module catalog sources

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/unify-module-catalog.yml'
      - '.github/scripts/catalog-single-source.py'

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply single-source catalog architecture
        run: python3 .github/scripts/catalog-single-source.py
      - name: Syntax check
        run: |
          node --check src/catalog.js
          node --check src/moduleDragSidebar.js
          node --check src/moduleContextMenu.js
          node --check src/scene3d.js
          node --check src/main.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit unified module presentation
        run: |
          rm -f .github/workflows/catalog-single-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "refactor: use catalog for all module presentation [skip ci]"
            git push origin ROG
          fi
