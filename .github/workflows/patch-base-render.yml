name: Patch baza render style

on:
  push:
    branches:
      - ROG
    paths:
      - .github/workflows/patch-base-render.yml
      - scripts/patchBaseRender.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply baza render patch
        run: node scripts/patchBaseRender.mjs
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit result
        run: |
          rm .github/workflows/patch-base-render.yml
          rm scripts/patchBaseRender.mjs
          git config user.name "fair-stand-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/scene3d.js test/baseRenderStyle.test.js .github/workflows/patch-base-render.yml scripts/patchBaseRender.mjs
          git commit -m "fix: align baza render style with banko [skip ci]"
          git push origin ROG
