name: Asset Library Delete

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/asset-library-delete.yml'
      - 'scripts/patch_asset_library_delete.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 scripts/patch_asset_library_delete.py

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/assetStore.js
          node --check src/imageAssetReferences.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        run: |
          rm -f scripts/patch_asset_library_delete.py .github/workflows/asset-library-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add safe image library deletion [skip ci]"
            git push origin ROG
          fi
