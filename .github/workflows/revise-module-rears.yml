name: Revise Module Rears

on:
  push:
    branches: [ROG]
    paths:
      - scripts/revise-module-rears.mjs
      - .github/workflows/revise-module-rears.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply revised rear standard
        run: node scripts/revise-module-rears.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js PROJECT_RULES.md Changelog.md
          git diff --cached --quiet || git commit -m "Use dark rear faces while preserving glass"
          git push origin ROG
