name: Temporary Project Import Fabric Asset Fix

on:
  push:
    branches:
      - 'fix/project-import-fabric-assets'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-import-fabric-assets
          fetch-depth: 0

      - name: Apply fix
        run: python .github/tmp-apply-project-import-fabric-assets.py

      - name: Verify targeted tests
        run: node --test test/projectImportFlow.test.js test/imageAssetDeletion.test.js

      - name: Commit fix
        run: |
          git rm .github/workflows/tmp-apply-project-import-fabric-assets.yml .github/tmp-apply-project-import-fabric-assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/imageAssetReferences.js src/main.js test/imageAssetDeletion.test.js test/projectImportFlow.test.js .github/change-contract.json
          git commit -m "Fix project ZIP fabric image import remap"
          git push origin HEAD:fix/project-import-fabric-assets
