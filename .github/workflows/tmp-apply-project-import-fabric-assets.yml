name: Temporary Project Import Fabric Asset Fix

on:
  push:
    branches: [fix/project-import-fabric-assets]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Fix project ZIP fabric image import remap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-import-fabric-assets
          fetch-depth: 0

      - name: Apply fix and regressions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          helper = Path('src/imageAssetReferences.js')
          text = helper.read_text(encoding='utf-8')
          if 'export function remapImageAssetReferences' not in text:
              marker = "\n\nexport function countImageAssetReferences"
              insert = """

export function remapImageAssetReferences(value, idMap) {
  if (Array.isArray(value)) return value.map((item) => remapImageAssetReferences(item, idMap));
  if (!value || typeof value !== 'object') return value;

  const output = {};
  Object.entries(value).forEach(([key, item]) => {
    if (IMAGE_ASSET_REFERENCE_KEYS.has(key) && typeof item === 'string' && idMap.has(item)) {
      output[key] = idMap.get(item);
      return;
    }
    output[key] = remapImageAssetReferences(item, idMap);
  });
  return output;
}
"""
              if marker not in text:
                  raise SystemExit('imageAssetReferences insertion marker not found')
              text = text.replace(marker, insert + marker, 1)
              helper.write_text(text, encoding='utf-8')

          main = Path('src/main.js')
          text = main.read_text(encoding='utf-8')
          old_import = "import { clearImageAssetReferences, countImageAssetReferences } from './imageAssetReferences.js';"
          new_import = "import { clearImageAssetReferences, countImageAssetReferences, remapImageAssetReferences } from './imageAssetReferences.js';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('main import marker not found')

          old_fn = """function remapAssetIdsInValue(value, idMap) {
  if (Array.isArray(value)) return value.map((item) => remapAssetIdsInValue(item, idMap));
  if (!value || typeof value !== 'object') return value;
  const output = {};
  Object.entries(value).forEach(([key, item]) => {
    if (key === 'imageAssetId' && typeof item === 'string' && idMap.has(item)) {
      output[key] = idMap.get(item);
    } else {
      output[key] = remapAssetIdsInValue(item, idMap);
    }
  });
  return output;
}

"""
          if old_fn in text:
              text = text.replace(old_fn, '', 1)
          if 'const importedProject = remapAssetIdsInValue({' in text:
              text = text.replace('const importedProject = remapAssetIdsInValue({', 'const importedProject = remapImageAssetReferences({', 1)
          elif 'const importedProject = remapImageAssetReferences({' not in text:
              raise SystemExit('main import remap call marker not found')
          main.write_text(text, encoding='utf-8')

          test_file = Path('test/projectImportFlow.test.js')
          text = test_file.read_text(encoding='utf-8')
          test_block = """

test('project import remaps every persisted image-reference field before saving', () => {
  assert.match(source, /remapImageAssetReferences/);
  assert.doesNotMatch(source, /key === 'imageAssetId'/);
});
"""
          if "project import remaps every persisted image-reference field before saving" not in text:
              text = text.rstrip() + test_block
              test_file.write_text(text, encoding='utf-8')

          test_file = Path('test/imageAssetDeletion.test.js')
          text = test_file.read_text(encoding='utf-8')
          old_import = "import { clearImageAssetReferences, countImageAssetReferences } from '../src/imageAssetReferences.js';"
          new_import = "import { clearImageAssetReferences, countImageAssetReferences, remapImageAssetReferences } from '../src/imageAssetReferences.js';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('imageAssetDeletion import marker not found')
          test_block = """

test('project import remaps both normal panel and Lightbox/Mesh image asset ids', () => {
  const state = {
    modules: [
      { strips: [{ imageAssetId: 'asset-a' }, { isGlass: true }] },
      {
        strips: [{
          fabricGroupId: 'fabric-1',
          fabricType: 'mesh',
          fabricColor: '#123456',
          fabricImageAssetId: 'asset-b',
          fabricImageFit: 'contain',
          fabricLightingOn: false,
        }],
      },
    ],
  };
  const remapped = remapImageAssetReferences(state, new Map([
    ['asset-a', 'new-a'],
    ['asset-b', 'new-b'],
  ]));

  assert.equal(remapped.modules[0].strips[0].imageAssetId, 'new-a');
  assert.equal(remapped.modules[1].strips[0].fabricImageAssetId, 'new-b');
  assert.equal(remapped.modules[0].strips[1].isGlass, true);
  assert.equal(remapped.modules[1].strips[0].fabricGroupId, 'fabric-1');
  assert.equal(remapped.modules[1].strips[0].fabricType, 'mesh');
  assert.equal(remapped.modules[1].strips[0].fabricColor, '#123456');
  assert.equal(remapped.modules[1].strips[0].fabricImageFit, 'contain');
  assert.equal(remapped.modules[1].strips[0].fabricLightingOn, false);
});
"""
          if "project import remaps both normal panel and Lightbox/Mesh image asset ids" not in text:
              marker = "\ntest('clearing one image asset removes only that asset assignments'"
              if marker not in text:
                  raise SystemExit('imageAssetDeletion test insertion marker not found')
              text = text.replace(marker, test_block + marker, 1)
          test_file.write_text(text, encoding='utf-8')

          contract_path = Path('.github/change-contract.json')
          c = json.loads(contract_path.read_text(encoding='utf-8'))
          c['id'] = 'project-import-fabric-image-remap'
          c['kind'] = 'bugfix'
          c['summary'] = 'Preserve Lightbox/Mesh fabric image assignments when importing project ZIP archives by remapping every persisted image asset reference field through the shared image-reference helper.'
          c['owners'] = ['src/imageAssetReferences.js', 'src/main.js', 'test/imageAssetDeletion.test.js', 'test/projectImportFlow.test.js']
          c['sourceOfTruth'] = ['src/imageAssetReferences.js', 'src/main.js']
          for key in ['catalog','behavior','state','placement','renderer','persistence','ui','composition','assets','storage','importExport','architecture','tests']:
              c['impact'][key] = 'affected'
          for key in ['bom','performance','accessibility','security']:
              c['impact'][key] = 'not-applicable'

          ia = c['impactAnalysis']
          ia['mode'] = 'full-system'
          for item in ['scripts/add-tv-sizes.py','scripts/add-video-wall-2x2.py','src/viewCube.js']:
              if item not in ia['affectedFiles']:
                  ia['affectedFiles'].append(item)
          for item in ['audit/FINDINGS.md','audit/evidence/A08_PERSISTENCE_AUTOSAVE_ISOLATION.md','audit/evidence/A11_FEATURE_COMPOSITION.md','audit/remediation/A02_F005_CLOSURE.md','audit/remediation/A03_CLOSURE.md','audit/remediation/A03_F010_CLOSURE.md','audit/remediation/A04_F013_CLOSURE.md','docs/AUTOSAVE_INTEGRATION_NOTES.md']:
              if item not in ia['affectedDocs']:
                  ia['affectedDocs'].append(item)
          for item in ['F-005','F-010','F-013','F-029']:
              if item not in ia['relatedFindings']['affected'] and item not in ia['relatedFindings']['reviewedNotAffected']:
                  ia['relatedFindings']['reviewedNotAffected'].append(item)
          if 'e2e/f020-save-before-project-actions.spec.mjs' not in ia['affectedTests']:
              ia['affectedTests'].append('e2e/f020-save-before-project-actions.spec.mjs')
          ia['notes'] = 'Import remaps persisted image asset references through the shared image-reference key set. Normal panel imageAssetId and Lightbox/Mesh fabricImageAssetId now follow the same old-to-new asset ID map; unrelated project state is preserved.'
          c['tests'] = {
              'targeted': ['test/projectImportFlow.test.js','test/imageAssetDeletion.test.js'],
              'fullSuite': True,
              'build': True,
              'e2e': {
                  'required': True,
                  'targeted': ['e2e/f020-save-before-project-actions.spec.mjs'],
                  'reason': 'Import/export and persisted project state are browser-impacting; the existing project-action E2E is included alongside deterministic import remap unit coverage, and CI runs the full E2E suite.'
              }
          }
          c['risk'] = {'level':'low','notes':'Localized import remap refactor using the already-canonical image reference key set; no schema migration and no asset bytes are changed.'}
          c['migration'] = {'required':False,'notes':'No persisted schema migration; imported archives are remapped at load time.'}
          c['rollback'] = 'Revert the shared import remap helper usage and its regression tests.'
          for key in ['affectedFiles','affectedTests','affectedDocs']:
              ia[key] = sorted(set(ia[key]))
          ia['relatedFindings']['affected'] = sorted(set(ia['relatedFindings']['affected']))
          ia['relatedFindings']['reviewedNotAffected'] = sorted(set(ia['relatedFindings']['reviewedNotAffected']))
          contract_path.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          node --test test/projectImportFlow.test.js test/imageAssetDeletion.test.js
          git rm .github/workflows/tmp-apply-project-import-fabric-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/imageAssetReferences.js src/main.js test/imageAssetDeletion.test.js test/projectImportFlow.test.js .github/change-contract.json
          git commit -m "Fix project ZIP fabric image import remap"
          git push origin HEAD:fix/project-import-fabric-assets
