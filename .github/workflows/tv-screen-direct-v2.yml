name: TV Screen Direct V2
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/tv-screen-direct-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Object_5 material
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/scene3d.js')
          s = p.read_text()
          pattern = r"      if \(object\.name === 'Object_5'\) \{.*?      \} else if \(object\.material\) \{"
          replacement = "      if (object.name === 'Object_5') {\n        const texture = new THREE.TextureLoader().load(TV_SCREEN_DATA_URL);\n        texture.colorSpace = THREE.SRGBColorSpace;\n        texture.flipY = false;\n        object.material = new THREE.MeshBasicMaterial({\n          map: texture,\n          toneMapped: false,\n          side: THREE.DoubleSide,\n        });\n        object.material.needsUpdate = true;\n      } else if (object.material) {"
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Object_5 block replacement count={count}')
          s2 = s2.replace("      if (moduleState.type === 'tv') addTvScreenOverlay(module.group);\n", "")
          p.write_text(s2)
          PY
      - name: Verify
        run: |
          node --check src/scene3d.js
          grep -F "new THREE.TextureLoader().load(TV_SCREEN_DATA_URL)" src/scene3d.js
          grep -F "texture.flipY = false" src/scene3d.js
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Cleanup
        run: rm -f .github/workflows/tv-screen-direct-v2.yml .github/workflows/inspect-tv-object5.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: bind uploaded image to TV screen mesh [skip ci]'
          branch: ROG
