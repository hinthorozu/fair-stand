name: Temporary unify module rotation step

on:
  push:
    branches:
      - fix/unify-module-rotation-step

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-module-rotation-step
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch all Shift+R rotation paths to centralized module policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('src/scene3d.js')
          s = scene.read_text()
          old_import = "import { getModuleGhostBehavior, getModuleRotationStepDeg, isFreePlacementModule, isTopPlacementModule, isWallOverlayModule } from './moduleBehavior.js';"
          new_import = "import { getModuleGhostBehavior, isFreePlacementModule, isTopPlacementModule, isWallOverlayModule, resolveModuleRotationDeltaDeg } from './moduleBehavior.js';"
          if s.count(old_import) != 1:
              raise SystemExit(f'scene moduleBehavior import mismatch: {s.count(old_import)}')
          s = s.replace(old_import, new_import, 1)

          old_selected = "    const stepDeg = getModuleRotationStepDeg(moduleState);\n    const effectiveDeltaDeg = deltaDeg < 0 ? -stepDeg : stepDeg;"
          new_selected = "    const effectiveDeltaDeg = resolveModuleRotationDeltaDeg(moduleState, deltaDeg);"
          if s.count(old_selected) != 1:
              raise SystemExit(f'selected rotation policy mismatch: {s.count(old_selected)}')
          s = s.replace(old_selected, new_selected, 1)

          old_drag = "    const deltaDeg = -90;\n\n    if (dragSession?.dragging) {\n      event.preventDefault();\n      const rotationCursorZDeg = rotateModuleRotationZDeg(\n        dragSession.rotationCursorZDeg ?? dragSession.preferredRotationZDeg,\n        deltaDeg,\n      );"
          new_drag = "    const requestedDeltaDeg = -90;\n\n    if (dragSession?.dragging) {\n      event.preventDefault();\n      const deltaDeg = resolveModuleRotationDeltaDeg(dragSession.moduleState, requestedDeltaDeg);\n      const rotationCursorZDeg = rotateModuleRotationZDeg(\n        dragSession.rotationCursorZDeg ?? dragSession.preferredRotationZDeg,\n        deltaDeg,\n      );"
          if s.count(old_drag) != 1:
              raise SystemExit(f'drag rotation block mismatch: {s.count(old_drag)}')
          s = s.replace(old_drag, new_drag, 1)

          old_call = "    const rotationResult = rotateSelectedModule(deltaDeg);"
          new_call = "    const rotationResult = rotateSelectedModule(requestedDeltaDeg);"
          if s.count(old_call) != 1:
              raise SystemExit(f'selected rotation call mismatch: {s.count(old_call)}')
          s = s.replace(old_call, new_call, 1)
          scene.write_text(s)

          sidebar = Path('src/moduleDragSidebar.js')
          s = sidebar.read_text()
          old_import = "import { getModuleDefaultRotationDeg, getModuleRotationStepDeg } from './moduleBehavior.js';"
          new_import = "import { getModuleDefaultRotationDeg, resolveModuleRotationDeltaDeg } from './moduleBehavior.js';"
          if s.count(old_import) != 1:
              raise SystemExit(f'sidebar moduleBehavior import mismatch: {s.count(old_import)}')
          s = s.replace(old_import, new_import, 1)
          old_block = "    const rotationStepDeg = getModuleRotationStepDeg(activeModuleState);\n    // Catalog drag must use the same visual clockwise convention as scene drag.\n    // Keep advancing the requested angle even when the current preview is invalid/red.\n    activeRotationZDeg = ((activeRotationZDeg - rotationStepDeg) % 360 + 360) % 360;"
          new_block = "    const deltaDeg = resolveModuleRotationDeltaDeg(activeModuleState, -90);\n    // Catalog drag, existing-module drag and stationary selection share one module rotation policy.\n    // Keep advancing the requested angle even when the current preview is invalid/red.\n    activeRotationZDeg = ((activeRotationZDeg + deltaDeg) % 360 + 360) % 360;"
          if s.count(old_block) != 1:
              raise SystemExit(f'catalog rotation block mismatch: {s.count(old_block)}')
          s = s.replace(old_block, new_block, 1)
          sidebar.write_text(s)

          test = Path('test/viewKeyboardMainIntegration.test.js')
          s = test.read_text()
          old = "  assert.match(sceneSource, /const deltaDeg = -90;/);"
          new = "  assert.match(sceneSource, /const requestedDeltaDeg = -90;/);\n  assert.match(sceneSource, /resolveModuleRotationDeltaDeg\\(dragSession\\.moduleState, requestedDeltaDeg\\)/);\n  assert.match(sceneSource, /resolveModuleRotationDeltaDeg\\(moduleState, deltaDeg\\)/);"
          if s.count(old) != 1:
              raise SystemExit(f'view integration assertion mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          test.write_text(s)

          test = Path('test/catalogDragKeyboardIntegration.test.js')
          s = test.read_text()
          old = "  assert.match(source, /activeRotationZDeg = \\(\\(activeRotationZDeg - rotationStepDeg\\)/);"
          new = "  assert.match(source, /resolveModuleRotationDeltaDeg\\(activeModuleState, -90\\)/);\n  assert.match(source, /activeRotationZDeg = \\(\\(activeRotationZDeg \\+ deltaDeg\\)/);"
          if s.count(old) != 1:
              raise SystemExit(f'catalog integration assertion mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          test.write_text(s)

          policy_test = Path('test/moduleRotationSingleSourceIntegration.test.js')
          policy_test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\n\nconst sceneSource = await readFile(new URL('../src/scene3d.js', import.meta.url), 'utf8');\nconst catalogDragSource = await readFile(new URL('../src/moduleDragSidebar.js', import.meta.url), 'utf8');\n\ntest('all interactive rotation paths resolve their delta through moduleBehavior', () => {\n  assert.match(sceneSource, /resolveModuleRotationDeltaDeg\\(dragSession\\.moduleState, requestedDeltaDeg\\)/);\n  assert.match(sceneSource, /resolveModuleRotationDeltaDeg\\(moduleState, deltaDeg\\)/);\n  assert.match(catalogDragSource, /resolveModuleRotationDeltaDeg\\(activeModuleState, -90\\)/);\n  assert.doesNotMatch(sceneSource, /getModuleRotationStepDeg/);\n  assert.doesNotMatch(catalogDragSource, /getModuleRotationStepDeg/);\n});\n""")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js src/moduleDragSidebar.js test/viewKeyboardMainIntegration.test.js test/catalogDragKeyboardIntegration.test.js test/moduleRotationSingleSourceIntegration.test.js
          git commit -m "Unify Shift+R rotation policy across interaction paths"
          git push origin HEAD:fix/unify-module-rotation-step
