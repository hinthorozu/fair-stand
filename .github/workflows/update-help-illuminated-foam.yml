name: Update Illuminated Foam Help
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/update-help-illuminated-foam.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/update-help-illuminated-foam.cjs
      - run: node --check src/helpGuide.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/update-help-illuminated-foam.yml .github/scripts/update-help-illuminated-foam.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/helpGuide.js .github/workflows/update-help-illuminated-foam.yml .github/scripts/update-help-illuminated-foam.cjs
          git commit -m "Update help guide for illuminated foam controls"
          git push origin ROG