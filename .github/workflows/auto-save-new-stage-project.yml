name: Auto Save New Stage Project
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/auto-save-new-stage-project.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/auto-save-new-stage-project.cjs
      - run: node --check src/main.js
      - run: node --check src/helpGuide.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/auto-save-new-stage-project.yml .github/scripts/auto-save-new-stage-project.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/helpGuide.js .github/workflows/auto-save-new-stage-project.yml .github/scripts/auto-save-new-stage-project.cjs
          git commit -m "Auto-save project when creating a stage"
          git push origin ROG
