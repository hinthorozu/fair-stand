name: Fix TV arrow movement
'on':
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-tv-arrow-move.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-tv-arrow-move.cjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/fix-tv-arrow-move.yml scripts/fix-tv-arrow-move.cjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js .github/workflows/fix-tv-arrow-move.yml scripts/fix-tv-arrow-move.cjs
          git commit -m "Fix TV and video wall arrow movement"
          git push origin ROG
