name: Fix Panel Bazali snap
on:
  push:
    branches: [ROG]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Make Panel Bazali use flat-panel connection rules
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/modulePlacement.js';
          let s = fs.readFileSync(path, 'utf8');

          const collisionOld = `function getModuleCollisionDepthCm(module) {\n  const explicitDepthCm = Number(module?.depthCm);`;
          const collisionNew = `function getModuleCollisionDepthCm(module) {\n  // Panel Bazalı fiziksel olarak 50 cm baza taşır ama bağlantı omurgası Düz Panel'dir.\n  // Corner/T/snap hesabında baza çıkıntısını değil 10 cm Maxima duvar hattını kullan.\n  if (module?.type === 'base-wall') return MODULE_COLLISION_DEPTH_CM;\n  const explicitDepthCm = Number(module?.depthCm);`;
          if (!s.includes(collisionOld)) throw new Error('collision depth anchor not found');
          s = s.replace(collisionOld, collisionNew);

          const validateOld = `  const boundary = validateModulePlacement({\n    placement,\n    widthCm,\n    depthCm,\n    standType,\n    standXCm,\n    standYCm,\n  });`;
          const validateNew = `  const effectiveDepthCm = moduleType === 'base-wall'\n    ? MODULE_COLLISION_DEPTH_CM\n    : depthCm;\n  const boundary = validateModulePlacement({\n    placement,\n    widthCm,\n    depthCm: effectiveDepthCm,\n    standType,\n    standXCm,\n    standYCm,\n  });`;
          if (!s.includes(validateOld)) throw new Error('validation anchor not found');
          s = s.replace(validateOld, validateNew);

          const candidateOld = `  const candidate = { id: moduleId, type: moduleType, widthCm, depthCm, placement };`;
          const candidateNew = `  const candidate = {\n    id: moduleId,\n    type: moduleType,\n    widthCm,\n    depthCm: effectiveDepthCm,\n    placement,\n  };`;
          if (!s.includes(candidateOld)) throw new Error('candidate anchor not found');
          s = s.replace(candidateOld, candidateNew);

          const snapOld = `  const strictMovingDepth = hasStrictDepthBounds(depthCm);\n  const movingDepthCm = strictMovingDepth ? Number(depthCm) : MODULE_COLLISION_DEPTH_CM;`;
          const snapNew = `  const effectiveMovingDepthCm = moduleType === 'base-wall'\n    ? MODULE_COLLISION_DEPTH_CM\n    : depthCm;\n  const strictMovingDepth = hasStrictDepthBounds(effectiveMovingDepthCm);\n  const movingDepthCm = strictMovingDepth\n    ? Number(effectiveMovingDepthCm)\n    : MODULE_COLLISION_DEPTH_CM;`;
          if (!s.includes(snapOld)) throw new Error('snap depth anchor not found');
          s = s.replace(snapOld, snapNew);

          fs.writeFileSync(path, s);

          const testPath = 'test/modulePlacement.test.js';
          let t = fs.readFileSync(testPath, 'utf8');
          const marker = `test('Panel Bazalı with 50 cm physical base still uses flat-panel corner snap', () => {`;
          if (!t.includes(marker)) {
            t += `\n\n${marker}\n  const modules = [{\n    id: 'target',\n    type: 'flat-panel',\n    widthCm: 200,\n    placement: { xCm: 100, yCm: 200, zCm: 0, rotationZDeg: 0, wallId: 'free' },\n  }];\n  const result = snapPlacementToModules({\n    moduleId: 'base-wall-moving',\n    moduleType: 'base-wall',\n    widthCm: 100,\n    depthCm: 50,\n    pointerXCm: 302,\n    pointerYCm: 248,\n    rotationZDeg: 90,\n    modules,\n    standType: 'island',\n    standXCm: 800,\n    standYCm: 600,\n  });\n\n  assert.equal(result?.snapKind, 'corner');\n  assert.deepEqual(result?.placement, {\n    xCm: 300, yCm: 200, zCm: 0, rotationZDeg: 90, wallId: 'free',\n  });\n});\n`;
            fs.writeFileSync(testPath, t);
          }
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-base-wall-snap.yml
          rm -f .github/workflows/fix-base-wall-as-panel.yml
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add -A
          git commit -m "fix: make Panel Bazalı connect like flat panels [skip ci]"
          git push origin ROG
