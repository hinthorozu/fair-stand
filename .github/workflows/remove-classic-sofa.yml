name: Purge Legacy Sofa Source
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/remove-classic-sofa.yml']
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/remove-classic-sofa.py
      - run: node --check src/catalog.js && node --check src/designState.js && node --check src/modulePlacement.js && node --check src/moduleDragSidebar.js && node --check src/moduleContextMenu.js && node --check src/main.js && node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/remove-classic-sofa.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'refactor: remove classic sofa set completely [skip ci]'
          branch: ROG
