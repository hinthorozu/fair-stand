name: Temporary color editor controller extraction

on:
  push:
    branches:
      - refactor/extract-color-editor-controller

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-color-editor-controller
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch main color editor wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/main.js')
          s = p.read_text()
          old = "import {\n  colorValuesFromHex,\n  cmykToRgb,\n  rgbToHex,\n} from './colorUtils.js';\nimport { normalizeCmykValues, readNumberGroup } from './colorEditorInputs.js';\n"
          new = "import { createColorEditorController } from './colorEditorController.js';\n"
          if s.count(old) != 1:
              raise SystemExit(f'color import block mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          pattern = re.compile(r"\nfunction syncColorEditorFromHex\(hex, \{ apply = false \} = \{\}\) \{.*?\n\}\n\napplyColorButton\.addEventListener", re.S)
          if len(pattern.findall(s)) != 1:
              raise SystemExit('color sync block mismatch')
          replacement = "\nconst {\n  syncFromHex: syncColorEditorFromHex,\n  syncFromRgbInputs,\n  syncFromCmykInputs,\n} = createColorEditorController({\n  colorInput,\n  colorHexInput,\n  colorRgbInputs,\n  colorCmykInputs,\n  onApply: () => applyActiveColorToSelection(),\n});\n\napplyColorButton.addEventListener"
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m "Wire color editor synchronization controller"
          git push origin HEAD:refactor/extract-color-editor-controller
