name: White Sofa Body
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/white-sofa-body.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/white-sofa-body.py
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/white-sofa-body.py .github/workflows/white-sofa-body.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make sofa upholstery full white keep original legs [skip ci]'
          branch: ROG
