name: Fix furniture catalog IDs

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-furniture-ids.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace stale moble IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'moble_sofa_set_classic': 'furniture_sofa_set_classic',
              'moble_table_chair_set_minyon': 'furniture_table_chair_set_minyon',
              'moble_bar_stool_classic': 'furniture_bar_stool_classic',
          }
          roots = [Path('src'), Path('test')]
          extra = [Path('SYSTEM_MODULE_CATALOG.md'), Path('ARCHITECTURE_RULES.md'), Path('README.md'), Path('ROADMAP.md'), Path('ROADMAP_PHASE_4.md'), Path('ROADMAP_PHASE_5_6.md')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.md','.json'})
          files.extend(p for p in extra if p.exists())
          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed))
          PY
      - name: Verify stale IDs are gone
        shell: bash
        run: |
          if grep -R -n "moble_" src test SYSTEM_MODULE_CATALOG.md ARCHITECTURE_RULES.md README.md ROADMAP*.md 2>/dev/null; then
            echo 'Stale moble IDs remain'
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test SYSTEM_MODULE_CATALOG.md ARCHITECTURE_RULES.md README.md ROADMAP*.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: restore furniture modules after catalog id rename [skip ci]"
            git push origin ROG
          fi
