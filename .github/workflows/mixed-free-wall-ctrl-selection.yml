name: Mixed Free Wall Ctrl Selection

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_mixed_free_wall_ctrl.py'
      - '.github/workflows/mixed-free-wall-ctrl-selection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_mixed_free_wall_ctrl.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm scripts/patch_mixed_free_wall_ctrl.py
          rm .github/workflows/mixed-free-wall-ctrl-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/ctrlMultiSelect.test.js scripts/patch_mixed_free_wall_ctrl.py .github/workflows/mixed-free-wall-ctrl-selection.yml
          git commit -m "fix: allow ctrl selection across connected free and wall panels [skip ci]"
          git push origin ROG
