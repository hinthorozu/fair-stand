name: Apply FAZ 2 Polish

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-faz2-polish.mjs
      - .github/workflows/apply-faz2-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Repair patch script markdown literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-faz2-polish.mjs')
          s = p.read_text()
          s = s.replace('seçiliyken `R` / `Shift+R` ile dönüş.', 'seçiliyken R / Shift+R ile dönüş.')
          s = s.replace('sıralarında `Ekle/Çoğalt Sağ/Sol` işlemlerinin', 'sıralarında Ekle/Çoğalt Sağ/Sol işlemlerinin')
          p.write_text(s)
          PY
      - name: Apply FAZ 2 polish patch
        run: node scripts/apply-faz2-polish.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rectSelection.js src/modulePlacement.js src/placementFeedback.js src/scene3d.js test/rectSelection.test.js test/modulePlacement.test.js test/placementFeedback.test.js ROADMAP.md
          git diff --cached --quiet || git commit -m "Polish FAZ 2 placement rules"
          git push origin ROG
