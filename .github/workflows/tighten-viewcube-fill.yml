name: Tighten ViewCube Fill

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/tighten-viewcube-fill.mjs'
      - '.github/workflows/tighten-viewcube-fill.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tighten-viewcube-fill.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Bring ViewCube framing closer to viewport"
            git push origin ROG
          fi
