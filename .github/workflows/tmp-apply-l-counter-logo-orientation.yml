name: Temporary L Counter Orientation Fix

on:
  push:
    branches:
      - fix/l-counter-logo-orientation

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply verified L-counter fix
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { analyzeChangeImpact } from './scripts/change-impact-analysis.mjs';
          import { SYSTEM_IMPACT_DOMAINS, validateSystemChangeContract } from './src/systemChangeContract.js';

          const scenePath = 'src/scene3d.js';
          let scene = fs.readFileSync(scenePath, 'utf8');

          const oldOffset = "surface.position.copy(position); surface.rotation.y=rotationY; if(Math.abs(rotationY)<0.01)surface.position.z+=0.007*outward;else surface.position.x+=0.007*outward;";
          const newOffset = "surface.position.copy(position); surface.rotation.y=rotationY; if(Math.abs(Math.sin(rotationY))<0.01)surface.position.z+=0.007*outward;else surface.position.x+=0.007*outward;";
          if (!scene.includes(newOffset)) {
            if (!scene.includes(oldOffset)) throw new Error('Expected L-counter surface offset source was not found.');
            scene = scene.replace(oldOffset, newOffset);
          }

          const oldFront = "addFace('front','lower',moduleState.faces?.frontLower,frontPanelM,new THREE.Vector3(0,lowerY,-depthM/2),0,-1); addFace('front','upper',moduleState.faces?.frontUpper,frontPanelM,new THREE.Vector3(0,upperY,-depthM/2),0,-1);";
          const newFront = "addFace('front','lower',moduleState.faces?.frontLower,frontPanelM,new THREE.Vector3(0,lowerY,-depthM/2),Math.PI,-1); addFace('front','upper',moduleState.faces?.frontUpper,frontPanelM,new THREE.Vector3(0,upperY,-depthM/2),Math.PI,-1);";
          if (!scene.includes(newFront)) {
            if (!scene.includes(oldFront)) throw new Error('Expected L-counter front-face source was not found.');
            scene = scene.replace(oldFront, newFront);
          }
          fs.writeFileSync(scenePath, scene);

          const testPath = 'test/lCounterSideGeometry.test.js';
          let testSource = fs.readFileSync(testPath, 'utf8');
          const regressionTitle = 'L counter front image surfaces face outward instead of exposing PlaneGeometry backs';
          if (!testSource.includes(regressionTitle)) {
            testSource = testSource.trimEnd() + `\n\ntest('${regressionTitle}', () => {\n  assert.match(block, /frontLower,frontPanelM,new THREE\\.Vector3\\(0,lowerY,-depthM\\/2\\),Math\\.PI,-1/);\n  assert.match(block, /frontUpper,frontPanelM,new THREE\\.Vector3\\(0,upperY,-depthM\\/2\\),Math\\.PI,-1/);\n  assert.match(block, /Math\\.abs\\(Math\\.sin\\(rotationY\\)\\)<0\\.01/);\n  assert.doesNotMatch(block, /frontLower,frontPanelM,new THREE\\.Vector3\\(0,lowerY,-depthM\\/2\\),0,-1/);\n});\n`;
            fs.writeFileSync(testPath, testSource);
          }

          const extensions = new Set(['.js', '.mjs', '.cjs', '.json', '.md', '.html', '.css', '.yml', '.yaml', '.txt']);
          const skip = new Set(['node_modules', '.git', 'dist', 'playwright-report', 'test-results']);
          const fileContents = {};
          function walk(dir = '.') {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (skip.has(entry.name)) continue;
              const filePath = path.join(dir, entry.name).replace(/^\.\//, '').replaceAll('\\\\', '/');
              if (entry.isDirectory()) walk(filePath);
              else if (extensions.has(path.extname(entry.name)) || ['Dockerfile', 'Makefile'].includes(entry.name)) {
                try { fileContents[filePath] = fs.readFileSync(filePath, 'utf8'); } catch {}
              }
            }
          }
          walk();
          delete fileContents['.github/change-contract.json'];

          const patchText = `
          @@ createLCounterModule addFace
          - surface.position.copy(position); surface.rotation.y=rotationY; if(Math.abs(rotationY)<0.01)surface.position.z+=0.007*outward;else surface.position.x+=0.007*outward;
          + surface.position.copy(position); surface.rotation.y=rotationY; if(Math.abs(Math.sin(rotationY))<0.01)surface.position.z+=0.007*outward;else surface.position.x+=0.007*outward;
          @@ front faces
          - addFace('front','lower',moduleState.faces?.frontLower,frontPanelM,new THREE.Vector3(0,lowerY,-depthM/2),0,-1); addFace('front','upper',moduleState.faces?.frontUpper,frontPanelM,new THREE.Vector3(0,upperY,-depthM/2),0,-1);
          + addFace('front','lower',moduleState.faces?.frontLower,frontPanelM,new THREE.Vector3(0,lowerY,-depthM/2),Math.PI,-1); addFace('front','upper',moduleState.faces?.frontUpper,frontPanelM,new THREE.Vector3(0,upperY,-depthM/2),Math.PI,-1);
          `;

          const discovered = analyzeChangeImpact({
            changedFiles: ['src/scene3d.js', 'test/lCounterSideGeometry.test.js'],
            tokenFiles: ['src/scene3d.js'],
            referenceFiles: ['src/scene3d.js'],
            fileContents,
            patchText,
          });
          const unique = (items) => [...new Set(items)].sort();
          const targeted = [
            'test/lCounterSideGeometry.test.js',
            'test/lCounter100Contract.test.js',
            'test/lCounter150Contract.test.js',
            'test/lCounter200Contract.test.js',
          ];
          const e2eTargeted = ['e2e/f010-module-construction.spec.mjs'];
          const impact = Object.fromEntries(SYSTEM_IMPACT_DOMAINS.map((domain) => [domain, 'not-applicable']));
          for (const domain of ['behavior', 'state', 'placement', 'renderer', 'performance', 'tests']) impact[domain] = 'affected';

          const contract = {
            schemaVersion: 2,
            id: 'l-counter-front-surface-orientation',
            kind: 'bugfix',
            summary: 'Fix mirrored image/logo rendering on the outward front faces of all L-shaped counter sizes by correcting front-face orientation and surface offset handling.',
            owners: ['src/scene3d.js', 'test/lCounterSideGeometry.test.js'],
            sourceOfTruth: ['src/scene3d.js'],
            impact,
            impactAnalysis: {
              mode: 'full-system',
              affectedFiles: discovered.affectedFiles,
              affectedTests: unique([...discovered.affectedTests, ...targeted, ...e2eTargeted]),
              affectedDocs: discovered.affectedDocs,
              relatedFindings: { affected: [], reviewedNotAffected: discovered.candidateFindings },
              notes: 'The runtime change is limited to createLCounterModule surface orientation/offset math. Full-system discovery dependents are acknowledged; no catalog, persistence, BOM, asset, storage, import/export, UI-control, accessibility, composition, architecture, or security behavior is changed.',
            },
            tests: {
              targeted,
              fullSuite: true,
              build: true,
              e2e: {
                required: true,
                targeted: e2eTargeted,
                reason: 'Renderer-visible L-counter fix; targeted Chromium construction coverage verifies the browser scene path while lCounterSideGeometry locks the corrected face orientation.',
              },
            },
            risk: {
              level: 'low',
              notes: 'Localized renderer orientation change shared by 100/150/200 L counters; regression asserts outward front-face rotation and correct axis offset behavior.',
            },
            migration: { required: false, notes: 'No persisted state or schema migration.' },
            rollback: 'Revert the L-counter front-face rotation/offset change and its regression test.',
          };

          const errors = validateSystemChangeContract(contract);
          if (errors.length) throw new Error(errors.join('\n'));
          fs.writeFileSync('.github/change-contract.json', JSON.stringify(contract, null, 2) + '\n');
          EOF

      - name: Targeted regressions
        run: node --test test/lCounterSideGeometry.test.js test/lCounter100Contract.test.js test/lCounter150Contract.test.js test/lCounter200Contract.test.js

      - name: Install dependencies
        run: npm ci

      - name: Full unit suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/lCounterSideGeometry.test.js .github/change-contract.json
          git commit -m "Fix mirrored L-counter front images"
          git push origin HEAD:fix/l-counter-logo-orientation
