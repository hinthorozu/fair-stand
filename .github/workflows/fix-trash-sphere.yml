name: Apply trash-bin sphere fix

on:
  push:
    branches:
      - fix/plastic-trash-bin-stray-sphere

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plastic-trash-bin-stray-sphere
      - name: Patch renderer, E2E, and change contract
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          scene_path = Path('src/scene3d.js')
          scene = scene_path.read_text()
          old = """  loadIndoorPlantModel(modelFile).then((template) => {\n    if (!group.parent) return;\n    const model = template.clone(true);\n    model.traverse((child) => {\n"""
          new = """  loadIndoorPlantModel(modelFile).then((template) => {\n    if (!group.parent) return;\n    const model = template.clone(true);\n    const removedNodes = [];\n    if (type === 'plastic-trash-bin') {\n      const strayNodes = [];\n      model.traverse((object) => {\n        if (object.name === 'Sphere_1') strayNodes.push(object);\n      });\n      strayNodes.forEach((object) => {\n        removedNodes.push(object.name);\n        object.parent?.remove(object);\n      });\n    }\n    model.traverse((child) => {\n"""
          if old not in scene:
              raise SystemExit('scene renderer insertion anchor not found')
          scene = scene.replace(old, new, 1)
          old_event = "detail: { moduleId: moduleState.id, moduleIndex, type, modelFile },"
          new_event = "detail: { moduleId: moduleState.id, moduleIndex, type, modelFile, removedNodes },"
          if old_event not in scene:
              raise SystemExit('model-rendered event anchor not found')
          scene = scene.replace(old_event, new_event, 1)
          scene_path.write_text(scene)

          e2e_path = Path('e2e/plastic-trash-bin-module.spec.mjs')
          e2e = e2e_path.read_text()
          old_e2e = """        entry.type === 'plastic-trash-bin'\n        && entry.modelFile === 'plastic_trash_bin.glb'\n        && Number(entry.moduleIndex) >= 0\n"""
          new_e2e = """        entry.type === 'plastic-trash-bin'\n        && entry.modelFile === 'plastic_trash_bin.glb'\n        && Number(entry.moduleIndex) >= 0\n        && Array.isArray(entry.removedNodes)\n        && entry.removedNodes.includes('Sphere_1')\n"""
          if old_e2e not in e2e:
              raise SystemExit('E2E render assertion anchor not found')
          e2e = e2e.replace(old_e2e, new_e2e, 1)
          e2e_path.write_text(e2e)

          contract_path = Path('.github/change-contract.json')
          contract = json.loads(contract_path.read_text())
          contract['id'] = 'fix-plastic-trash-bin-stray-sphere'
          contract['summary'] = 'Remove the stray Sphere_1 branch embedded in the plastic trash-bin GLB before scene bounds/scaling so the actual waste basket renders instead of a sphere-like object.'
          contract['owners'] = ['src/scene3d.js', 'e2e/plastic-trash-bin-module.spec.mjs']
          contract['sourceOfTruth'] = ['src/scene3d.js', 'public/models/plastic_trash_bin.glb']
          contract['impactAnalysis']['notes'] = 'Corrective render-only patch. Diagnostic inspection of plastic_trash_bin.glb found the intended Waste Basket branch plus an unrelated Sphere_1 branch with a ~1989-scale transform. The renderer now removes Sphere_1 before Box3 fitting, so the waste-basket geometry defines scaling and the sphere cannot render. Dimensions, catalog identity, placement, persistence and BOM are unchanged.'
          contract['tests']['e2e']['reason'] = 'Browser drag/drop must load the real plastic_trash_bin.glb and the actual scene-render completion event must confirm the embedded Sphere_1 branch was pruned before fitting.'
          contract['risk']['notes'] = 'The change is isolated to plastic-trash-bin GLB cleanup. Indoor plants keep their existing renderer behavior. The main regression risk is failing to prune the asset-specific Sphere_1 node before bounds fitting.'
          contract['rollback'] = 'Revert the plastic-trash-bin Sphere_1 pruning and its browser regression if the source asset is replaced with a cleaned GLB that no longer contains that node.'
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/fix-trash-sphere.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js e2e/plastic-trash-bin-module.spec.mjs .github/change-contract.json .github/workflows/fix-trash-sphere.yml
          git commit -m "Fix trash-bin stray sphere render"
          git push origin HEAD:fix/plastic-trash-bin-stray-sphere
