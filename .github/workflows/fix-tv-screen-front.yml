name: Fix TV Screen Front
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-tv-screen-front.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move screen image to real front face
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text()
          old = "screen.position.set(0, 1.75, 0.041);"
          new = "screen.position.set(0, 1.75, 0.105);"
          if old not in s:
              raise SystemExit('TV screen overlay position not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check src/scene3d.js
          grep -F "screen.position.set(0, 1.75, 0.105);" src/scene3d.js
          grep -F "side: THREE.FrontSide" src/scene3d.js
          grep -F "TV_SCREEN_DATA_URL" src/scene3d.js
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Cleanup
        run: rm -f .github/workflows/fix-tv-screen-front.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: place TV image on visible front face [skip ci]'
          branch: ROG
