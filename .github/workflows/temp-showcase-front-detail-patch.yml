name: temp-showcase-front-detail-patch

on:
  push:
    branches:
      - fix/showcase-remove-fake-front-details

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/showcase-remove-fake-front-details
          fetch-depth: 0
      - name: Remove non-BOM showcase front details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/scene3d.js')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  // Ön ince çerçeve parçaları doğrulanmış BOM Item'ı değildir; renderer detayı olarak kalır.\n"
                  "  const showcaseDetailMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0, roughness: 0.72 });\n\n",
                  "",
              ),
              (
                  "  const frontPostGeometry = new THREE.BoxGeometry(0.028, bodyHeight, 0.028);\n"
                  "  for (const side of [-1, 1]) {\n"
                  "    const post = new THREE.Mesh(frontPostGeometry.clone(), showcaseDetailMaterial.clone());\n"
                  "    post.position.set(side * (bodyOuterWidth / 2 - 0.014), openingCenterY, caseFrontZ - 0.014);\n"
                  "    post.castShadow = true;\n"
                  "    group.add(post);\n"
                  "  }\n"
                  "  const frontEdgeGeometry = new THREE.BoxGeometry(bodyOuterWidth, 0.028, 0.028);\n"
                  "  for (const y of [bodyBottom, bodyTop]) {\n"
                  "    const edge = new THREE.Mesh(frontEdgeGeometry.clone(), showcaseDetailMaterial.clone());\n"
                  "    edge.position.set(0, y, caseFrontZ - 0.014);\n"
                  "    edge.castShadow = true;\n"
                  "    group.add(edge);\n"
                  "  }\n\n",
                  "",
              ),
              (
                  "  const shelfFrontGeometry = new THREE.BoxGeometry(bodyInnerWidth, 0.018, 0.024);\n",
                  "",
              ),
              (
                  "    const shelfFront = new THREE.Mesh(shelfFrontGeometry.clone(), showcaseDetailMaterial.clone());\n"
                  "    shelfFront.position.set(0, shelfY, caseFrontZ - 0.012);\n"
                  "    shelfFront.castShadow = true;\n"
                  "    group.add(shelfFront);\n",
                  "",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one renderer block, found {count}: {old.splitlines()[0]}')
              source = source.replace(old, new)

          forbidden = [
              'showcaseDetailMaterial',
              'frontPostGeometry',
              'frontEdgeGeometry',
              'shelfFrontGeometry',
              'const shelfFront =',
          ]
          showcase = source[source.index('function createShowcaseModule('):source.index('function createSelectionFrame', source.index('function createShowcaseModule('))]
          for token in forbidden:
              if token in showcase:
                  raise SystemExit(f'Forbidden fake front-detail token remains: {token}')

          required = [
              'sidePanelGeometry',
              'capGeometry',
              'const shelfGeometry = new THREE.BoxGeometry',
              'shelf.userData.itemKey = glassShelfItem.itemKey',
              "surfaceRole: 'showcase-body'",
              'colorTargets: bodyColorTargets',
          ]
          for token in required:
              if token not in showcase:
                  raise SystemExit(f'Canonical showcase renderer token was lost: {token}')

          path.write_text(source, encoding='utf-8')
          PY
          git diff --check -- src/scene3d.js
          git diff -- src/scene3d.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(showcase): remove fake white front details"
          git push origin HEAD:fix/showcase-remove-fake-front-details
