name: Remove Indoor Plant 2

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/remove-indoor-plant-2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply removal
        run: python3 .github/scripts/remove-indoor-plant-2.py

      - name: Verify source removal and parked model
        run: |
          if grep -R -n -E 'indoor-plant-2|EXTRA_INDOOR_PLANT_2|Yapay Çiçek 2|indoor_plants2\.glb' src; then exit 1; fi
          test -f public/models/indoor_plants2.glb
          git diff -- src test/removedIndoorPlant2.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-indoor-plant-2.yml .github/scripts/remove-indoor-plant-2.py
          git add src test/removedIndoorPlant2.test.js
          git commit -m 'fix: remove Yapay Çiçek 2 from system [skip ci]'
          git push origin ROG

# rerun after aligning legacy indoor plant tests
