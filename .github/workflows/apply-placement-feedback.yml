name: Apply Placement Feedback

on:
  push:
    branches: [ROG]
    paths:
      - scripts/apply-placement-feedback.mjs
      - .github/workflows/apply-placement-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply placement feedback patch
        run: node scripts/apply-placement-feedback.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js src/modulePlacement.js
          git diff --cached --quiet || git commit -m "Add invalid placement feedback"
          git push origin ROG
