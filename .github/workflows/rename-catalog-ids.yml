name: Rename catalog IDs
on:
  push:
    branches: [ROG]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rename wall catalog IDs everywhere
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const replacements = new Map([
            ['PANEL_50', 'wall_50'],
            ['PANEL_100', 'wall_100'],
            ['PANEL_150', 'wall_150'],
            ['PANEL_200', 'wall_200'],
            ['BASE_WALL_100', 'wall_base_100'],
            ['BASE_WALL_150', 'wall_base_150'],
            ['BASE_WALL_200', 'wall_base_200'],
            ['SHELF_2_100', 'wall_shelf_2_100'],
            ['SHELF_3_100', 'wall_shelf_3_100'],
            ['SHELF_2_150', 'wall_shelf_2_150'],
            ['SHELF_3_150', 'wall_shelf_3_150'],
            ['SHELF_2_200', 'wall_shelf_2_200'],
            ['SHELF_3_200', 'wall_shelf_3_200'],
          ]);

          const textExts = new Set(['.js', '.md', '.yml', '.yaml', '.json', '.html', '.css']);
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules' || entry.name === 'dist') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (textExts.has(path.extname(entry.name))) {
                let s = fs.readFileSync(full, 'utf8');
                let next = s;
                for (const [from, to] of replacements) next = next.split(from).join(to);
                // Dynamic helpers/templates that do not contain one concrete ID.
                next = next.split('`PANEL_${widthCm}`').join('`wall_${widthCm}`');
                next = next.split('`BASE_WALL_${width}`').join('`wall_base_${width}`');
                next = next.split("'BASE_WALL_${width}'").join("'wall_base_${width}'");
                if (next !== s) fs.writeFileSync(full, next);
              }
            }
          }
          walk('.');
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit migration
        run: |
          rm -f .github/workflows/rename-catalog-ids.yml
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add -A
          git commit -m "refactor: rename wall catalog ids [skip ci]"
          git push origin ROG
