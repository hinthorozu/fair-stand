name: Face Beige Chairs Loveseat
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/face-beige-chairs-loveseat.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/face-beige-chairs-loveseat.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/face-beige-chairs-loveseat.py .github/workflows/face-beige-chairs-loveseat.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: face beige single chairs directly toward loveseat [skip ci]'
          branch: ROG
