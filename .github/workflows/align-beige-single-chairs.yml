name: Align Beige Single Chairs

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/align-beige-single-chairs.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/align-beige-single-chairs.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/align-beige-single-chairs.py .github/workflows/align-beige-single-chairs.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: align beige single chairs [skip ci]'
          branch: ROG
