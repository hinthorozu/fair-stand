name: Temporary stage feedback extraction

on:
  push:
    branches:
      - refactor/extract-stage-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-stage-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch main stage feedback wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()

          anchor = "import { createSidebarController } from './sidebarController.js';\n"
          replacement = anchor + "import { formatCapacityPopup, renderStageResult as renderStageResultInto, renderWallResult } from './stageFeedback.js';\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'import anchor mismatch: {s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          old_stage = """function renderStageResult(message, isError = false) {\n  stageResult.textContent = message;\n  stageResult.classList.toggle('error', isError);\n}\n\nfunction renderWallResult(message, isError = false) {\n  if (isError) console.warn(message);\n}\n"""
          new_stage = """function renderStageResult(message, isError = false) {\n  renderStageResultInto(stageResult, message, isError);\n}\n"""
          if s.count(old_stage) != 1:
              raise SystemExit(f'stage feedback block mismatch: {s.count(old_stage)}')
          s = s.replace(old_stage, new_stage, 1)

          old_capacity = """function formatCapacityPopup(result, title) {\n  const axis = result.axis?.toUpperCase() ?? '';\n  return `${title}\\n\\n`\n    + `${axis} stand sınırı: ${result.limitCm} cm\\n`\n    + `Mevcut toplam: ${result.currentCm} cm\\n`\n    + `Eklenmek istenen: ${result.addedCm} cm\\n`\n    + `Oluşacak toplam: ${result.projectedCm} cm\\n\\n`\n    + 'Aktif stand alanı aşılamaz.';\n}\n\n"""
          if s.count(old_capacity) != 1:
              raise SystemExit(f'capacity formatter mismatch: {s.count(old_capacity)}')
          s = s.replace(old_capacity, '', 1)

          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m "Delegate stage feedback helpers from main"
          git push origin HEAD:refactor/extract-stage-feedback
