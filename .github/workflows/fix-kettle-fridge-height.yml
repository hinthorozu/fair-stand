name: Fix Kettle Fridge Height

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-kettle-fridge-height.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Fix kettle height
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/moduleBehavior.js',
              "  kettle: Object.freeze({\n    placement: 'free',\n    moveSnapCm: 10,\n    rotationStepDeg: 90,\n    defaultRotationDeg: 0,\n    allowSideInsert: true,\n    collision: 'footprint',\n  }),\n",
              "  kettle: Object.freeze({\n    placement: 'free',\n    moveSnapCm: 10,\n    rotationStepDeg: 90,\n    defaultRotationDeg: 0,\n    allowSideInsert: true,\n    // Kettle lives at the mini-fridge top elevation, so its 2D footprint may overlap the fridge.\n    collision: 'none',\n  }),\n",
          )

          replace_once(
              'src/scene3d.js',
              "    const logicalZM = Number(placement.zCm ?? 0) / 100;\n    const rotationZDeg = normalizeModuleRotationZDeg(placement.rotationZDeg);\n",
              "    const logicalZM = Number(placement.zCm ?? 0) / 100;\n    // Mini fridge height is 66 cm. Kettle never sits on the floor; its local base\n    // is always raised to the refrigerator top plane.\n    const fixedElevationM = (group.userData?.type === 'kettle' || group.userData?.moduleState?.type === 'kettle')\n      ? 0.66\n      : 0;\n    const worldYM = logicalZM + fixedElevationM;\n    const rotationZDeg = normalizeModuleRotationZDeg(placement.rotationZDeg);\n",
          )

          replace_once(
              'src/scene3d.js',
              "    if (vertical) {\n      group.position.set(xM, logicalZM, logicalYM + widthM / 2);\n    } else {\n      group.position.set(xM + widthM / 2, logicalZM, logicalYM);\n    }\n",
              "    if (vertical) {\n      group.position.set(xM, worldYM, logicalYM + widthM / 2);\n    } else {\n      group.position.set(xM + widthM / 2, worldYM, logicalYM);\n    }\n",
          )

          replace_once(
              'src/scene3d.js',
              "    } else if (ghost.mesh?.material?.color) {\n      ghost.mesh.material.color.setHex(colorHex);\n    }\n    applyPlacementToGroup(ghost.root, placement, ghost.widthCm);\n",
              "    } else if (ghost.mesh?.material?.color) {\n      ghost.mesh.material.color.setHex(colorHex);\n    }\n    if (moduleOrWidthCm && typeof moduleOrWidthCm === 'object') {\n      ghost.root.userData.type = moduleOrWidthCm.type ?? ghost.root.userData.type;\n    }\n    applyPlacementToGroup(ghost.root, placement, ghost.widthCm);\n",
          )

          replace_once(
              'test/kettle.test.js',
              "test('kettle is a free footprint module', () => {\n  const behavior = getModuleBehavior({ type: 'kettle' });\n  assert.equal(behavior.placement, 'free');\n  assert.equal(behavior.collision, 'footprint');\n  assert.equal(behavior.rotationStepDeg, 90);\n});\n",
              "test('kettle is free-positioned at fridge-top elevation without floor-footprint collision', () => {\n  const behavior = getModuleBehavior({ type: 'kettle' });\n  assert.equal(behavior.placement, 'free');\n  assert.equal(behavior.collision, 'none');\n  assert.equal(behavior.rotationStepDeg, 90);\n});\n",
          )

          print('kettle fridge-top placement fixed')
          PY

      - name: Syntax check
        run: |
          node --check src/moduleBehavior.js
          node --check src/scene3d.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit and push
        run: |
          rm .github/workflows/fix-kettle-fridge-height.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: place kettle at mini fridge top height [skip ci]'
          git push origin ROG
