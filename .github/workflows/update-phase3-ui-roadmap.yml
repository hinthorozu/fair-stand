name: Update Phase 3 UI Roadmap

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/update-phase3-ui-roadmap.mjs'
      - '.github/workflows/update-phase3-ui-roadmap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-phase3-ui-roadmap.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Add Phase 3 UI UX polish roadmap item"
          git push origin ROG
