name: Add Floor Types

on:
  push:
    branches: [ROG]
    paths:
      - scripts/add-floor-types.mjs
      - .github/workflows/add-floor-types.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/add-floor-types.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src
          git diff --cached --quiet || git commit -m "Add selectable floor coverings"
          git push origin ROG
