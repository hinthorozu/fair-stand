name: Add Raised Platform

on:
  push:
    branches: [ROG]
    paths:
      - scripts/add-raised-platform.mjs
      - .github/workflows/add-raised-platform.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/add-raised-platform.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git diff --cached --quiet || git commit -m "Add 5 cm raised active stand platform"
          git push origin ROG
