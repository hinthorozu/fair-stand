name: Fix Illuminated Foam Interaction

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-illuminated-foam-interaction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/fix-illuminated-foam-interaction.cjs
      - run: node --check src/scene3d.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - shell: bash
        run: |
          rm -f .github/workflows/fix-illuminated-foam-interaction.yml .github/scripts/fix-illuminated-foam-interaction.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/illuminatedFoamInteraction.test.js .github/workflows/fix-illuminated-foam-interaction.yml .github/scripts/fix-illuminated-foam-interaction.cjs
          git commit -m "Fix illuminated foam selection and mouse drag"
          git push origin ROG
