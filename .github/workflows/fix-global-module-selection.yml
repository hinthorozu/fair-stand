name: Fix Global Module Selection

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-global-module-selection.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-global-module-selection.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          rm -f scripts/fix-global-module-selection.mjs .github/workflows/fix-global-module-selection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify module selection across all meshes"
          git push origin ROG
