name: Update Fridge Label

on:
  push:
    branches:
      - ROG
    paths:
      - 'scripts/update-fridge-label.py'
      - '.github/workflows/update-fridge-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python3 scripts/update-fridge-label.py
      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/miniFridgeTopLabel.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/update-fridge-label.py .github/workflows/update-fridge-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scene3d.js test/miniFridgeTopLabel.test.js scripts/update-fridge-label.py .github/workflows/update-fridge-label.yml
          git commit -m 'fix: enlarge centered fridge label [skip ci]'
          git push origin ROG
