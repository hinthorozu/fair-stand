name: Fix Free Side Fixtures And Stool Facing
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-free-side-fixtures-and-stool-facing.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-free-side-fixtures-and-stool-facing.py
      - run: node --check src/moduleDragSidebar.js
      - run: node --check src/main.js
      - run: node --check src/modulePlacement.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "activeRotationZDeg = state.type === 'bar-stool' ? 270 : 0" src/moduleDragSidebar.js
          grep -n "rotationZDeg: moduleState.type === 'bar-stool' ? 270 : 0" src/main.js
          grep -n "createFreeSideFixturePlacement" src/modulePlacement.js
      - run: rm -f .github/scripts/fix-free-side-fixtures-and-stool-facing.py .github/workflows/fix-free-side-fixtures-and-stool-facing.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: free-side fixtures and bar stool facing [skip ci]'
          branch: ROG
