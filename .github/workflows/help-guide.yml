name: Help Guide Wiring

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch_help_guide_wiring.py'
      - '.github/workflows/help-guide.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_help_guide_wiring.py
      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/helpGuide.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/patch_help_guide_wiring.py .github/workflows/help-guide.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js src/helpGuide.js src/helpGuide.css test/helpGuide.test.js scripts/patch_help_guide_wiring.py .github/workflows/help-guide.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add collapsible in-app usage guide [skip ci]'
          git push origin ROG
