name: Apply Long Planter Color

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch-long-planter-color.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - run: node scripts/patch-long-planter-color.mjs
      - run: npm ci && npm run build
      - run: |
          rm scripts/patch-long-planter-color.mjs .github/workflows/apply-long-planter-color.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Uzun Saksı 100 body colorable"
          git push origin ROG
