name: Depot Back Wall Recipe
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/depot-back-wall-recipe.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/depot-back-wall-recipe.cjs
      - run: node --check src/automaticWall.js
      - run: node --check src/main.js
      - run: node --check test/depotBackWallRecipe.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/depot-back-wall-recipe.yml .github/scripts/depot-back-wall-recipe.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automaticWall.js src/main.js test/depotBackWallRecipe.test.js .github/workflows/depot-back-wall-recipe.yml .github/scripts/depot-back-wall-recipe.cjs
          git commit -m "Use depot-sized back wall panels"
          git push origin ROG
