name: TV Screen Direct Material
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/tv-screen-direct-material.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind uploaded image directly to Object_5
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scene3d.js')
          s = p.read_text()
          old = """      if (object.name === 'Object_5') {
        const texture = createTvBrandTexture();
        object.material = new THREE.MeshBasicMaterial({
          map: texture,
          toneMapped: false,
          side: THREE.DoubleSide,
        });
      } else if (object.material) {
"""
          new = """      if (object.name === 'Object_5') {
        const texture = new THREE.TextureLoader().load(TV_SCREEN_DATA_URL);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.flipY = false;
        object.material = new THREE.MeshBasicMaterial({
          map: texture,
          toneMapped: false,
          side: THREE.DoubleSide,
        });
        object.material.needsUpdate = true;
      } else if (object.material) {
"""
          if old not in s:
              raise SystemExit('Object_5 material block not found')
          s = s.replace(old, new, 1)
          # Disable the separate plane overlay so there is only one screen source.
          s = s.replace("      if (moduleState.type === 'tv') addTvScreenOverlay(module.group);\n", "")
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check src/scene3d.js
          grep -F "new THREE.TextureLoader().load(TV_SCREEN_DATA_URL)" src/scene3d.js
          grep -F "texture.flipY = false" src/scene3d.js
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Cleanup
        run: rm -f .github/workflows/tv-screen-direct-material.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: map uploaded image directly to TV screen mesh [skip ci]'
          branch: ROG
