name: Project Name Display Rename
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/project-name-display-rename.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/project-name-display-rename.cjs
      - run: node --check src/main.js
      - run: node --check src/helpGuide.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          rm -f .github/workflows/project-name-display-rename.yml .github/scripts/project-name-display-rename.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js src/helpGuide.js .github/workflows/project-name-display-rename.yml .github/scripts/project-name-display-rename.cjs
          git commit -m "Use project name display with rename popup"
          git push origin ROG
