name: Catalog key one-time patch

on:
  push:
    branches:
      - remediation/f013-catalog-identity

permissions:
  contents: write

jobs:
  patch-catalog-identity:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-key-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/f013-catalog-identity
          fetch-depth: 0

      - name: Apply exact catalog identity remediation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/catalog.js')
          text = path.read_text(encoding='utf-8')
          normalize_old = """    shelfCount: optionalNumber(source.shelfCount ?? descriptor?.shelfCount),\n    sizeInch: optionalNumber(source.sizeInch ?? descriptor?.sizeInch),\n    screenWidthCm: optionalNumber(source.screenWidthCm ?? descriptor?.screenWidthCm),\n"""
          normalize_new = """    shelfCount: optionalNumber(source.shelfCount ?? descriptor?.shelfCount),\n    modelFile: source.modelFile ?? descriptor?.modelFile ?? null,\n    sizeInch: optionalNumber(source.sizeInch ?? descriptor?.sizeInch),\n    screenWidthCm: optionalNumber(source.screenWidthCm ?? descriptor?.screenWidthCm),\n"""
          assert text.count(normalize_old) == 1, 'catalog normalize anchor changed'
          text = text.replace(normalize_old, normalize_new)

          match_old = """    if ((normalized.shelfCount !== null || item.shelfCount != null) && optionalNumber(item.shelfCount) !== normalized.shelfCount) return false;\n    if (normalized.sizeInch !== null && optionalNumber(item.sizeInch) !== null && optionalNumber(item.sizeInch) !== normalized.sizeInch) return false;\n"""
          match_new = """    if ((normalized.shelfCount !== null || item.shelfCount != null) && optionalNumber(item.shelfCount) !== normalized.shelfCount) return false;\n    if ((normalized.modelFile !== null || item.modelFile != null) && (item.modelFile ?? null) !== normalized.modelFile) return false;\n    if (normalized.sizeInch !== null && optionalNumber(item.sizeInch) !== null && optionalNumber(item.sizeInch) !== normalized.sizeInch) return false;\n"""
          assert text.count(match_old) == 1, 'catalog match anchor changed'
          text = text.replace(match_old, match_new)
          path.write_text(text, encoding='utf-8')

          path = Path('src/designState.js')
          text = path.read_text(encoding='utf-8')
          import_old = "import { getTvDefinition } from './tvConfig.js';\n"
          import_new = "import { resolveModuleCatalogKey } from './catalog.js';\nimport { getTvDefinition } from './tvConfig.js';\n"
          assert text.count(import_old) == 1, 'designState import anchor changed'
          assert "resolveModuleCatalogKey" not in text, 'designState already resolves catalog identity'
          text = text.replace(import_old, import_new)

          attach_old = """  if (catalogKey !== null && catalogKey !== undefined) state.catalogKey = catalogKey;\n  if (preservePlacement && descriptor.placement) {\n"""
          attach_new = """  const resolvedCatalogKey = resolveModuleCatalogKey({\n    ...descriptor,\n    ...state,\n    catalogKey: catalogKey ?? descriptor.catalogKey ?? state.catalogKey ?? null,\n  });\n  if (resolvedCatalogKey) state.catalogKey = resolvedCatalogKey;\n  else delete state.catalogKey;\n\n  if (preservePlacement && descriptor.placement) {\n"""
          assert text.count(attach_old) == 1, 'designState catalogKey attachment anchor changed'
          text = text.replace(attach_old, attach_new)
          path.write_text(text, encoding='utf-8')

          path = Path('src/main.js')
          text = path.read_text(encoding='utf-8')
          restore_old = """  currentModules.forEach((moduleState) => {\n    if (!moduleState.catalogKey) moduleState.catalogKey = resolveModuleCatalogKey(moduleState);\n  });\n"""
          restore_new = """  currentModules.forEach((moduleState) => {\n    const resolvedCatalogKey = resolveModuleCatalogKey(moduleState);\n    if (resolvedCatalogKey) moduleState.catalogKey = resolvedCatalogKey;\n    else delete moduleState.catalogKey;\n  });\n"""
          assert text.count(restore_old) == 1, 'main restore catalog identity anchor changed'
          text = text.replace(restore_old, restore_new)
          path.write_text(text, encoding='utf-8')

          path = Path('test/catalogSingleSource.test.js')
          text = path.read_text(encoding='utf-8')
          test_anchor = """test('left catalog, context catalog and drag badge share catalog presentation source', () => {\n"""
          new_tests = """test('legacy separators resolve exact normal versus vine catalog identity from modelFile', () => {\n  assert.equal(resolveModuleCatalogKey({ type: 'separator', widthCm: 100 }), 'wall_separator_100');\n  assert.equal(resolveModuleCatalogKey({ type: 'separator', widthCm: 50 }), 'wall_separator_50');\n  assert.equal(\n    resolveModuleCatalogKey({ type: 'separator', widthCm: 100, modelFile: 'wall_separator_100_sarmasik.glb' }),\n    'wall_separator_100_sarmasik',\n  );\n  assert.equal(\n    resolveModuleCatalogKey({ type: 'separator', widthCm: 50, modelFile: 'wall_separator_50_sarmasik.glb' }),\n    'wall_separator_50_sarmasik',\n  );\n});\n\n"""
          assert text.count(test_anchor) == 1, 'catalogSingleSource test anchor changed'
          assert 'legacy separators resolve exact normal versus vine catalog identity from modelFile' not in text
          text = text.replace(test_anchor, new_tests + test_anchor)
          path.write_text(text, encoding='utf-8')

          path = Path('test/moduleStateConstructionRegistry.test.js')
          text = path.read_text(encoding='utf-8')
          catalog_test_old = """    const descriptor = MODULE_CATALOG[catalogKey];\n    const state = createModuleStateFromDescriptor(descriptor, { catalogKey });\n    assert.ok(state, `${catalogKey} must resolve to a runtime module state`);\n    assert.equal(state.type, descriptor.type, `${catalogKey} type must be preserved`);\n    assert.equal(state.catalogKey, catalogKey, `${catalogKey} identity must be attached by the canonical constructor`);\n"""
          catalog_test_new = """    const descriptor = MODULE_CATALOG[catalogKey];\n    const state = createModuleStateFromDescriptor(descriptor);\n    assert.ok(state, `${catalogKey} must resolve to a runtime module state`);\n    assert.equal(state.type, descriptor.type, `${catalogKey} type must be preserved`);\n    assert.equal(state.catalogKey, catalogKey, `${catalogKey} identity must be attached automatically by the canonical constructor`);\n    assert.notEqual(state.catalogKey, null, `${catalogKey} catalog identity must never be null`);\n"""
          assert text.count(catalog_test_old) == 1, 'moduleState registry catalog loop anchor changed'
          text = text.replace(catalog_test_old, catalog_test_new)

          foam_anchor = """  assert.equal(state.heightCm, 45);\n});\n\n"""
          foam_new = """  assert.equal(state.heightCm, 45);\n  assert.equal(Object.hasOwn(state, 'catalogKey'), false);\n});\n\ntest('automatic catalog-equivalent descriptors receive canonical catalog identity', () => {\n  const wall = createModuleStateFromDescriptor({ type: 'flat-panel', widthCm: 100 });\n  const door = createModuleStateFromDescriptor({ type: 'door', widthCm: 100 });\n  const normalSeparator = createModuleStateFromDescriptor({ type: 'separator', widthCm: 100 });\n  const vineSeparator = createModuleStateFromDescriptor({\n    type: 'separator',\n    widthCm: 100,\n    modelFile: 'wall_separator_100_sarmasik.glb',\n  });\n\n  assert.equal(wall.catalogKey, 'wall_100');\n  assert.equal(door.catalogKey, 'DOOR_100');\n  assert.equal(normalSeparator.catalogKey, 'wall_separator_100');\n  assert.equal(vineSeparator.catalogKey, 'wall_separator_100_sarmasik');\n});\n\n"""
          assert text.count(foam_anchor) == 1, 'foam test anchor changed'
          text = text.replace(foam_anchor, foam_new)
          path.write_text(text, encoding='utf-8')

      - name: Verify focused behavior before commit
        shell: bash
        run: |
          node --test test/catalogSingleSource.test.js test/moduleStateConstructionRegistry.test.js
          git diff --check

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/catalog-key-one-time-patch.yml
          git add src/catalog.js src/designState.js src/main.js test/catalogSingleSource.test.js test/moduleStateConstructionRegistry.test.js .github/workflows/catalog-key-one-time-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[catalog-key-patched] Enforce canonical catalog identity"
          git push origin HEAD:remediation/f013-catalog-identity
