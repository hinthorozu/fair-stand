name: Cool White Shelf Light

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/cool-white-shelf-light.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Change shelf light to cool white
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene = Path('src/scene3d.js')
          s = scene.read_text(encoding='utf-8')

          replacements = {
              'color: 0xfff8e8,': 'color: 0xffffff,',
              'emissive: 0xffefc2,': 'emissive: 0xeaf6ff,',
              '        0xfff3d6,\n        8.5,': '        0xf4fbff,\n        8.5,',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'shelf light color marker not found: {old}')
              s = s.replace(old, new, 1)

          scene.write_text(s, encoding='utf-8')

          test = Path('test/shelfLighting.test.js')
          t = test.read_text(encoding='utf-8')
          marker = "  assert.match(source, /shelf-under-led-strip/);\n"
          addition = (
              marker
              + "  assert.match(source, /color: 0xffffff/);\n"
              + "  assert.match(source, /emissive: 0xeaf6ff/);\n"
              + "  assert.match(source, /0xf4fbff/);\n"
          )
          if 'emissive: 0xeaf6ff' not in t:
              if marker not in t:
                  raise SystemExit('shelf lighting test marker not found')
              t = t.replace(marker, addition, 1)
          test.write_text(t, encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          node --check src/scene3d.js
          node --check test/shelfLighting.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        shell: bash
        run: |
          rm -f .github/workflows/cool-white-shelf-light.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scene3d.js test/shelfLighting.test.js .github/workflows/cool-white-shelf-light.yml
          git commit -m "fix: use cool white shelf lighting [skip ci]"
          git push origin ROG
