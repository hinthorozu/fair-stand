name: Fix Free Side Fixture Helper
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-free-side-fixture-helper.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-free-side-fixture-helper.py
      - run: node --check src/modulePlacement.js
      - run: node --check test/modulePlacement.test.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: grep -n "function createFreeSideFixturePlacement" src/modulePlacement.js
      - run: rm -f .github/scripts/fix-free-side-fixture-helper.py .github/workflows/fix-free-side-fixture-helper.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: restore free-side fixture insertion helper [skip ci]'
          branch: ROG
