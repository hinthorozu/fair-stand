name: Fix Selected Rotation Pivot

on:
  push:
    branches: [ROG]
    paths:
      - scripts/fix-selected-rotation-pivot.mjs
      - .github/workflows/fix-selected-rotation-pivot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/fix-selected-rotation-pivot.mjs

      - name: Commit patch
        run: |
          if git diff --quiet -- src/modulePlacement.js src/scene3d.js test/modulePlacement.test.js PROJECT_RULES.md; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modulePlacement.js src/scene3d.js test/modulePlacement.test.js PROJECT_RULES.md
          git commit -m "Rotate placed modules around their center"
          git push origin HEAD:ROG
