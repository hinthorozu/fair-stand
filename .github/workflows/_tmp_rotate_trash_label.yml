name: Temporary trash label orientation patch

on:
  push:
    branches:
      - fix/plastic-trash-bin-top-label-orientation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plastic-trash-bin-top-label-orientation
          fetch-depth: 0

      - name: Apply exact orientation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          scene_path = Path('src/scene3d.js')
          scene = scene_path.read_text(encoding='utf-8')
          old_label = """  label.rotation.x = -Math.PI / 2;\n  label.position.set(0, Number(heightCm) / 100 + 0.004, -0.04);\n  label.renderOrder = 30;\n  label.userData.kind = 'decoration';\n  label.userData.role = 'plastic-trash-bin-top-label';\n"""
          new_label = """  label.rotation.x = -Math.PI / 2;\n  label.rotation.z = Math.PI;\n  label.position.set(0, Number(heightCm) / 100 + 0.004, -0.04);\n  label.renderOrder = 30;\n  label.userData.kind = 'decoration';\n  label.userData.role = 'plastic-trash-bin-top-label';\n"""
          if scene.count(old_label) != 1:
              raise SystemExit(f'Expected exactly one trash top-label block, found {scene.count(old_label)}')
          scene = scene.replace(old_label, new_label, 1)

          old_event = "topLabelRole: group.children.find((child) => child.userData?.role === 'plastic-trash-bin-top-label')?.userData.role ?? null }"
          new_event = "topLabelRole: group.children.find((child) => child.userData?.role === 'plastic-trash-bin-top-label')?.userData.role ?? null, topLabelRotationZ: group.children.find((child) => child.userData?.role === 'plastic-trash-bin-top-label')?.rotation.z ?? null }"
          if scene.count(old_event) != 1:
              raise SystemExit(f'Expected exactly one trash render event payload, found {scene.count(old_event)}')
          scene = scene.replace(old_event, new_event, 1)
          scene_path.write_text(scene, encoding='utf-8')

          unit_path = Path('test/plasticTrashBinTopLabel.test.js')
          unit = unit_path.read_text(encoding='utf-8')
          old_unit = "  assert.match(source, /role = 'plastic-trash-bin-top-label'/);\n"
          new_unit = "  assert.match(source, /role = 'plastic-trash-bin-top-label'/);\n  assert.match(source, /label\\.rotation\\.z = Math\\.PI/);\n"
          if unit.count(old_unit) != 1:
              raise SystemExit(f'Expected exactly one top-label unit assertion anchor, found {unit.count(old_unit)}')
          unit_path.write_text(unit.replace(old_unit, new_unit, 1), encoding='utf-8')

          e2e_path = Path('e2e/plastic-trash-bin-module.spec.mjs')
          e2e = e2e_path.read_text(encoding='utf-8')
          old_e2e = "        && entry.topLabelRole === 'plastic-trash-bin-top-label'\n"
          new_e2e = "        && entry.topLabelRole === 'plastic-trash-bin-top-label'\n        && Math.abs(Number(entry.topLabelRotationZ) - Math.PI) < 1e-9\n"
          if e2e.count(old_e2e) != 1:
              raise SystemExit(f'Expected exactly one E2E top-label assertion anchor, found {e2e.count(old_e2e)}')
          e2e_path.write_text(e2e.replace(old_e2e, new_e2e, 1), encoding='utf-8')

          contract_path = Path('.github/change-contract.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          contract['id'] = 'plastic-trash-bin-top-label-orientation'
          contract['summary'] = 'Rotate only the plastic trash bin top label 180 degrees in-plane toward the requested plan-view direction; keep the trash-bin model and persisted placement unchanged.'
          contract['impactAnalysis']['notes'] = 'Renderer/UI-only orientation correction. Full scene3d dependency surfaces remain reviewed. The plastic trash-bin label receives a local rotation.z = Math.PI after its horizontal-plane tilt. The module group/model is not rotated by this patch, so persisted placement and body orientation semantics remain unchanged.'
          contract['tests']['e2e']['reason'] = 'Real Chromium drag/drop must render the trash-bin scene group with the top label at local rotation.z = PI while persisted module placement rotation remains 0.'
          contract['risk']['notes'] = 'Low-risk local decoration transform: only the plastic-trash-bin top-label mesh changes orientation; body/model transform and placement state are untouched.'
          contract['rollback'] = 'Remove the local label.rotation.z = Math.PI assignment and the matching runtime/test assertions.'
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('.github/workflows/_tmp_rotate_trash_label.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix trash bin top label orientation"
          git push origin HEAD:fix/plastic-trash-bin-top-label-orientation
