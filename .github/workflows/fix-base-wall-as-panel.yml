name: Fix Panel Bazali as mounted base
on:
  push:
    branches: [ROG]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply mounted-base patch
        run: |
          cp .github/scripts/fix-base-wall.js /tmp/fix-base-wall.cjs
          node /tmp/fix-base-wall.cjs
      - run: npm test
      - run: npm run build
      - name: Commit result
        run: |
          rm -f .github/workflows/fix-base-wall-as-panel.yml .github/scripts/fix-base-wall.js
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add -A
          git commit -m "fix: model Panel Bazalı as wall panel with mounted base [skip ci]"
          git push origin ROG
