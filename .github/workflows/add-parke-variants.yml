name: Add Parquet Variants

on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/add-parke-variants.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/add-parke-variants.mjs
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/scene3d.js
          git diff --cached --quiet || git commit -m "Add three parquet floor variants"
          git push
