name: Update Help Project Naming
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node .github/scripts/update-help-project-naming.cjs
      - run: node --check src/helpGuide.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/workflows/update-help-project-naming.yml .github/scripts/update-help-project-naming.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Update help guide for automatic project names"
          git push origin ROG
