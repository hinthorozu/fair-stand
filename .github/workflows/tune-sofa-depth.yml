name: Tune Sofa Depth

on:
  push:
    branches: [ROG]
    paths:
      - scripts/tune-sofa-depth.mjs
      - .github/workflows/tune-sofa-depth.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/tune-sofa-depth.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git diff --cached --quiet || git commit -m "Shorten sofa depths and center table"
          git push origin ROG
