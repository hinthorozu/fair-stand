name: Panel Multiselect Rule
on:
  push:
    branches: [ROG]
    paths:
      - 'scripts/patch-panel-multiselect-rule.py'
      - '.github/workflows/panel-multiselect-rule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch-panel-multiselect-rule.py
      - name: Syntax check
        run: node --check src/scene3d.js && node --check src/rectSelection.js && node --check test/panelMultiSelectRule.test.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f .github/workflows/panel-multiselect-rule.yml scripts/patch-panel-multiselect-rule.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make every panel eligible for ctrl multiselect [skip ci]"
          git push origin ROG
