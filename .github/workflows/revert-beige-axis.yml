name: Revert Beige Axis
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/revert-beige-axis.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - run: sed -i 's/rotationYDeg: -135.26002361732807/rotationYDeg: -45.26002361732807/' src/scene3d.js
      - run: npm install && npm test && npm run build
      - run: |
          rm -f .github/workflows/revert-beige-axis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore beige loveseat orientation [skip ci]"
          git push
