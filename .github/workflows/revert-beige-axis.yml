name: Fix Wall Drag Stickiness
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/revert-beige-axis.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/fix-wall-drag-stickiness.py
      - name: Syntax check
        run: node --check src/scene3d.js
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          rm -f scripts/fix-wall-drag-stickiness.py .github/workflows/revert-beige-axis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize module dragging across wall corners [skip ci]"
          git push origin ROG
