name: Apply TV Screen Image

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/apply-tv-screen-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python .github/scripts/apply_tv_screen_image.py

      - name: Verify source
        run: |
          node --check src/scene3d.js
          grep -F "TV_SCREEN_DATA_URL" src/scene3d.js
          grep -F "tv-screen-image-overlay" src/scene3d.js
          grep -F "side: THREE.FrontSide" src/scene3d.js

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cleanup temporary files
        run: rm -f .github/scripts/apply_tv_screen_image.py .github/workflows/apply-tv-screen-image.yml

      - name: Commit source change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'feat: show uploaded image on TV front screen [skip ci]'
          branch: ROG
