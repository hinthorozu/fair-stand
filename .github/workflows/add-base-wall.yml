name: Add Panel Bazali module
on:
  push:
    branches: [ROG]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Panel Bazali patch
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceOnce(path, needle, replacement) {
            let s = fs.readFileSync(path, 'utf8');
            if (!s.includes(needle)) throw new Error(`Needle not found in ${path}: ${needle.slice(0,80)}`);
            s = s.replace(needle, replacement);
            fs.writeFileSync(path, s);
          }

          // Catalog: dedicated wall+baza family. Overall wall height stays the standard 350 cm;
          // the baza projects 50 cm from the lower part of the wall.
          replaceOnce('src/catalog.js',
            "  BASE_200: { type: 'base', widthCm: 200, depthCm: 50, heightCm: 50, label: 'Baza 200' },\n",
            "  BASE_200: { type: 'base', widthCm: 200, depthCm: 50, heightCm: 50, label: 'Baza 200' },\n  BASE_WALL_100: { type: 'base-wall', widthCm: 100, depthCm: 50, heightCm: 350, label: 'Panel Bazalı 100' },\n  BASE_WALL_150: { type: 'base-wall', widthCm: 150, depthCm: 50, heightCm: 350, label: 'Panel Bazalı 150' },\n  BASE_WALL_200: { type: 'base-wall', widthCm: 200, depthCm: 50, heightCm: 350, label: 'Panel Bazalı 200' },\n"
          );

          // BOM recipes exactly as supplied by the user. Inner-corner variant only swaps
          // the seven main wall panels; the 48.5 side panels remain unchanged.
          const recipeBlock = `\n  'base-wall:100': Object.freeze({ recipeId: 'base-wall-100', moduleType: 'base-wall', nominalWidthCm: 100, connectionMode: 'straight', items: Object.freeze([\n    Object.freeze({ partId: 'profile_91', quantity: 4 }), Object.freeze({ partId: 'upright_346_5', quantity: 2 }), Object.freeze({ partId: 'profile_41_5', quantity: 4 }), Object.freeze({ partId: 'upright_49_5', quantity: 2 }), Object.freeze({ partId: 'panel_98', quantity: 7 }), Object.freeze({ partId: 'panel_48_5', quantity: 2 }), Object.freeze({ partId: 'connector_start', quantity: 6 }), Object.freeze({ partId: 'connector_single', quantity: 17 }), Object.freeze({ partId: 'base_top_107_50', quantity: 1 }),\n  ]), variants: Object.freeze({ innerCornerPanelPartId: 'panel_corner_92' }) }),\n  'base-wall:150': Object.freeze({ recipeId: 'base-wall-150', moduleType: 'base-wall', nominalWidthCm: 150, connectionMode: 'straight', items: Object.freeze([\n    Object.freeze({ partId: 'profile_140_5', quantity: 4 }), Object.freeze({ partId: 'upright_346_5', quantity: 2 }), Object.freeze({ partId: 'profile_41_5', quantity: 4 }), Object.freeze({ partId: 'upright_49_5', quantity: 2 }), Object.freeze({ partId: 'panel_147_5', quantity: 7 }), Object.freeze({ partId: 'panel_48_5', quantity: 2 }), Object.freeze({ partId: 'connector_start', quantity: 6 }), Object.freeze({ partId: 'connector_single', quantity: 17 }), Object.freeze({ partId: 'base_top_157_50', quantity: 1 }),\n  ]), variants: Object.freeze({ innerCornerPanelPartId: 'panel_corner_142_5' }) }),\n  'base-wall:200': Object.freeze({ recipeId: 'base-wall-200', moduleType: 'base-wall', nominalWidthCm: 200, connectionMode: 'straight', items: Object.freeze([\n    Object.freeze({ partId: 'profile_190', quantity: 4 }), Object.freeze({ partId: 'upright_346_5', quantity: 2 }), Object.freeze({ partId: 'profile_41_5', quantity: 4 }), Object.freeze({ partId: 'upright_49_5', quantity: 2 }), Object.freeze({ partId: 'panel_197', quantity: 7 }), Object.freeze({ partId: 'panel_48_5', quantity: 2 }), Object.freeze({ partId: 'connector_start', quantity: 6 }), Object.freeze({ partId: 'connector_single', quantity: 17 }), Object.freeze({ partId: 'base_top_206_50', quantity: 1 }),\n  ]), variants: Object.freeze({ innerCornerPanelPartId: 'panel_corner_192' }) }),\n`;
          replaceOnce('src/moduleRecipes.js', "\n  'base:100': Object.freeze", recipeBlock + "\n  'base:100': Object.freeze");

          // Debug BOM recognition before plain Baza so "Panel Bazalı" cannot be swallowed
          // by the generic base matcher.
          replaceOnce('src/rawBomDebug.js',
            "  const baseMatch = text.match(/Baza\\s+(100|150|200)\\s*cm/i);",
            "  const baseWallMatch = text.match(/Panel\\s+Bazalı\\s+(100|150|200)(?:\\s*cm)?/i);\n  if (baseWallMatch) {\n    const widthCm = Number(baseWallMatch[1]);\n    renderRecipe('base-wall', widthCm, `Panel Bazalı ${widthCm} cm`);\n    return;\n  }\n\n  const baseMatch = text.match(/Baza\\s+(100|150|200)\\s*cm/i);"
          );
          replaceOnce('src/rawBomDebug.js',
            "  const specialModule = /Banko|Baza|Raf|Vitrin|Kapı|Separatör|Koltuk|Projektör|panel seçili/i.test(text);",
            "  const specialModule = /Banko|Baza|Bazalı|Raf|Vitrin|Kapı|Separatör|Koltuk|Projektör|panel seçili/i.test(text);"
          );

          // 3D: compose the existing standard wall and corrected Baza renderer into one
          // module group. Dimensions are not recalculated or altered.
          const scenePath = 'src/scene3d.js';
          let scene = fs.readFileSync(scenePath, 'utf8');
          const buildWallNeedle = '  function buildWall(modules, { resetView = true } = {}) {';
          if (!scene.includes(buildWallNeedle)) throw new Error('buildWall anchor not found');
          const helper = `  function createBaseWallModule(moduleState, moduleIndex, applyStoredImage) {\n    const wallState = { ...moduleState, type: 'flat-panel' };\n    const baseState = {\n      ...moduleState,\n      id: \`${'${moduleState.id}'}-base-layer\`,\n      type: 'base',\n      depthCm: 50,\n      heightCm: 50,\n    };\n\n    const wall = createFlatPanelModule(wallState, moduleIndex, applyStoredImage);\n    const base = createBaseModule(baseState, moduleIndex, applyStoredImage);\n    const group = new THREE.Group();\n    group.userData.kind = 'module';\n    group.userData.moduleId = moduleState.id;\n    group.userData.moduleType = 'base-wall';\n    group.userData.moduleIndex = moduleIndex;\n\n    while (wall.group.children.length) group.add(wall.group.children[0]);\n    while (base.group.children.length) group.add(base.group.children[0]);\n\n    const surfaces = [...wall.surfaces, ...base.surfaces];\n    surfaces.forEach((surface) => {\n      surface.userData.moduleId = moduleState.id;\n      surface.userData.moduleType = 'base-wall';\n      surface.userData.moduleIndex = moduleIndex;\n    });\n    return { group, surfaces };\n  }\n\n`;
          scene = scene.replace(buildWallNeedle, helper + buildWallNeedle);
          const dispatchNeedle = "      if (moduleState.type === 'separator') {\n        module = createSeparatorModule(moduleState, moduleIndex);\n      } else if (moduleState.type === 'base') {";
          if (!scene.includes(dispatchNeedle)) throw new Error('module dispatch anchor not found');
          scene = scene.replace(dispatchNeedle,
            "      if (moduleState.type === 'separator') {\n        module = createSeparatorModule(moduleState, moduleIndex);\n      } else if (moduleState.type === 'base-wall') {\n        module = createBaseWallModule(\n          moduleState,\n          moduleIndex,\n          (surface) => applyStoredImage(surface),\n        );\n      } else if (moduleState.type === 'base') {"
          );
          fs.writeFileSync(scenePath, scene);

          // Recipe regression tests.
          fs.writeFileSync('test/baseWallRecipes.test.js', `import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { getModuleRecipe, expandRecipe } from '../src/moduleRecipes.js';\nimport { MODULE_CATALOG } from '../src/catalog.js';\n\nconst expected = {\n  100: { profile: 'profile_91', panel: 'panel_98', corner: 'panel_corner_92', top: 'base_top_107_50' },\n  150: { profile: 'profile_140_5', panel: 'panel_147_5', corner: 'panel_corner_142_5', top: 'base_top_157_50' },\n  200: { profile: 'profile_190', panel: 'panel_197', corner: 'panel_corner_192', top: 'base_top_206_50' },\n};\n\nfor (const [widthText, ids] of Object.entries(expected)) {\n  const width = Number(widthText);\n  test(\`Panel Bazalı ${'${width}'} reçetesi verilen üretim adetlerini korur\`, () => {\n    const recipe = getModuleRecipe('base-wall', width);\n    assert.ok(recipe);\n    const q = Object.fromEntries(recipe.items.map((item) => [item.partId, item.quantity]));\n    assert.equal(q[ids.profile], 4);\n    assert.equal(q.upright_346_5, 2);\n    assert.equal(q.profile_41_5, 4);\n    assert.equal(q.upright_49_5, 2);\n    assert.equal(q[ids.panel], 7);\n    assert.equal(q.panel_48_5, 2);\n    assert.equal(q.connector_start, 6);\n    assert.equal(q.connector_single, 17);\n    assert.equal(q[ids.top], 1);\n    assert.equal(recipe.variants.innerCornerPanelPartId, ids.corner);\n    assert.ok(expandRecipe(recipe).items.every((item) => item.part));\n  });\n}\n\ntest('Panel Bazalı katalog ölçüleri 100/150/200 ve 50 cm baza derinliğini korur', () => {\n  for (const width of [100, 150, 200]) {\n    const item = MODULE_CATALOG[\`BASE_WALL_${'${width}'}\`];\n    assert.equal(item.type, 'base-wall');\n    assert.equal(item.widthCm, width);\n    assert.equal(item.depthCm, 50);\n    assert.equal(item.heightCm, 350);\n  }\n});\n`);
          NODE
      - run: npm test
      - run: npm run build
      - name: Commit result
        run: |
          rm -f .github/workflows/add-base-wall.yml
          git config user.name "mustafa sinan koca"
          git config user.email "mustafasinankoca@gmail.com"
          git add -A
          git commit -m "feat: add Panel Bazalı 100 150 200 [skip ci]"
          git push origin ROG
