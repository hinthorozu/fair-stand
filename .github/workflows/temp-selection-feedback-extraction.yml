name: Temporary selection feedback step runner

on:
  push:
    branches:
      - refactor/extract-selection-feedback

permissions:
  contents: write

jobs:
  step:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-selection-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Step 5 - delegate surface selection only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()
          scene_start = s.find('const scene3d = createStandScene(\n')
          callback_start = s.find('  (surfaces) => {\n', scene_start)
          callback_end = s.find('  getAssetUrl,\n', callback_start)
          if min(scene_start, callback_start, callback_end) < 0:
              raise SystemExit(f'surface callback markers missing: scene={scene_start}, start={callback_start}, end={callback_end}')

          old_callback = s[callback_start:callback_end]
          if 'const feedback = describeSurfaceSelection(surfaces, currentModules);' not in old_callback:
              required = ["if (moduleType === 'counter')", "if (moduleType === 'illuminated-foam')", 'selectedFabricGroupIds = new Set']
              missing = [item for item in required if item not in old_callback]
              if missing:
                  raise SystemExit(f'surface callback guard mismatch: {missing}')
              new_callback = (
                  "  (surfaces) => {\n"
                  "    const feedback = describeSurfaceSelection(surfaces, currentModules);\n"
                  "    selectedFoamModuleId = feedback.foamModuleId;\n"
                  "    if (foamLightControls) foamLightControls.hidden = !feedback.foamControlsVisible;\n"
                  "    if (feedback.foamControlsVisible && foamLightColorInput) {\n"
                  "      foamLightColorInput.value = feedback.foamColor;\n"
                  "    }\n"
                  "    selectionInfo.textContent = feedback.message;\n"
                  "  },\n"
              )
              s = s[:callback_start] + new_callback + s[callback_end:]
              p.write_text(s)

          updated = p.read_text()
          scene_start = updated.find('const scene3d = createStandScene(\n')
          callback_start = updated.find('  (surfaces) => {\n', scene_start)
          callback_end = updated.find('  getAssetUrl,\n', callback_start)
          callback = updated[callback_start:callback_end]
          if callback.count('describeSurfaceSelection(surfaces, currentModules)') != 1:
              raise SystemExit('surface helper delegation missing or duplicated')
          if "if (moduleType === 'counter')" in callback or 'selectedFabricGroupIds = new Set' in callback:
              raise SystemExit('old surface decision logic still present in surface callback')
          if '  ({ selected, floorType, paintable }) => {\n' not in updated:
              raise SystemExit('floor callback changed unexpectedly')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Surface helper tests
        run: node --test test/selectionFeedback.test.js
      - name: Build
        run: npm run build
      - name: Commit step if changed
        shell: bash
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No main.js change to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m "Delegate surface selection feedback"
          git push origin HEAD:refactor/extract-selection-feedback
