name: Temporary selection feedback step runner

on:
  push:
    branches:
      - refactor/extract-selection-feedback

permissions:
  contents: write

jobs:
  step:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-selection-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Step 7 - delegate floor selection only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()
          old_floor = (
              "  ({ selected, floorType, paintable }) => {\n"
              "    if (!selected) return;\n"
              "    const label = floorType === 'karolaj' ? 'Karolaj' : (floorType === 'hali' ? 'Halı' : 'Parke');\n"
              "    selectionInfo.textContent = paintable\n"
              "      ? label + ' zemini seçili · mevcut Aktif renk ile boyanabilir.'\n"
              "      : label + ' zemini seçili · bu zemin tipi boyanamaz.';\n"
              "  },\n"
          )
          new_floor = (
              "  (floorSelection) => {\n"
              "    const message = describeFloorSelection(floorSelection);\n"
              "    if (message) selectionInfo.textContent = message;\n"
              "  },\n"
          )

          if new_floor not in s:
              if s.count(old_floor) != 1:
                  raise SystemExit(f'floor callback guard mismatch: {s.count(old_floor)}')
              s = s.replace(old_floor, new_floor, 1)
              p.write_text(s)

          updated = p.read_text()
          if updated.count('describeFloorSelection(floorSelection)') != 1:
              raise SystemExit('floor helper delegation missing or duplicated')
          if old_floor in updated:
              raise SystemExit('old floor decision logic still present')
          scene_start = updated.find('const scene3d = createStandScene(\n')
          scene_end = updated.find('\n\nfunction renderStageResult', scene_start)
          scene = updated[scene_start:scene_end]
          if scene.count('describeSurfaceSelection(surfaces, currentModules)') != 1:
              raise SystemExit('surface delegation changed unexpectedly')
          if "if (moduleType === 'counter')" in scene or 'selectedFabricGroupIds = new Set' in scene:
              raise SystemExit('old surface decision logic reappeared unexpectedly')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Selection feedback tests
        run: node --test test/selectionFeedback.test.js test/selectionFeedbackMainIntegration.test.js
      - name: Build
        run: npm run build
      - name: Commit step if changed
        shell: bash
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No main.js change to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m "Delegate floor selection feedback"
          git push origin HEAD:refactor/extract-selection-feedback
