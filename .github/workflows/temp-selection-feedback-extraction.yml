name: Temporary selection feedback validation

on:
  push:
    branches:
      - refactor/extract-selection-feedback

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-selection-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture failing assertion context
        shell: bash
        run: |
          set +e
          npm test > /tmp/full-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            rm -f TEMP_TEST_FAILURE.txt
            exit 0
          fi
          {
            echo '=== FAILING TEST CONTEXT ==='
            grep -n -B 30 -A 90 '^not ok' /tmp/full-test.log || true
            echo
            echo '=== TEST SUMMARY ==='
            tail -n 20 /tmp/full-test.log
          } > TEMP_TEST_FAILURE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TEMP_TEST_FAILURE.txt
          git commit -m "Capture failing test assertion context"
          git push origin HEAD:refactor/extract-selection-feedback
          exit "$status"
      - name: Production build
        run: npm run build
