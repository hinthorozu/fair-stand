name: Temporary selection feedback validation

on:
  push:
    branches:
      - refactor/extract-selection-feedback

permissions:
  contents: read

jobs:
  integration-probe:
    name: Probe ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test/autosaveMainIntegration.test.js
          - test/catalogDragKeyboardIntegration.test.js
          - test/colorEditorControllerMainIntegration.test.js
          - test/colorEditorMainIntegration.test.js
          - test/moduleRotationSingleSourceIntegration.test.js
          - test/projectDropdownSwitchIntegration.test.js
          - test/projectUiMainIntegration.test.js
          - test/selectionFeedbackMainIntegration.test.js
          - test/sidebarControllerMainIntegration.test.js
          - test/stageFeedbackMainIntegration.test.js
          - test/uiFeedbackMainIntegration.test.js
          - test/viewKeyboardMainIntegration.test.js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-selection-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated test
        run: node --test ${{ matrix.test }}
