name: Temporary selection feedback step runner

on:
  push:
    branches:
      - refactor/extract-selection-feedback

permissions:
  contents: write

jobs:
  step:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-selection-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Step 1-2 - import helpers and remove local hint declaration only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.js')
          s = p.read_text()
          anchor = "import { observeSelectionFeedback, observeStatusTones } from './uiFeedback.js';\n"
          line = "import { DEFAULT_SELECTION_HINT, describeFloorSelection, describeSurfaceSelection } from './selectionFeedback.js';\n"
          hint_block = "\nconst DEFAULT_SELECTION_HINT = 'Bir panel seç; Ctrl/Cmd + tık ile panelleri çoklu seç.';\n"

          if s.count(anchor) != 1:
              raise SystemExit(f'import anchor mismatch: {s.count(anchor)}')
          if line not in s:
              s = s.replace(anchor, anchor + line, 1)

          if hint_block in s:
              s = s.replace(hint_block, '', 1)

          p.write_text(s)
          updated = p.read_text()
          if updated.count(line) != 1:
              raise SystemExit(f'selection feedback import count mismatch: {updated.count(line)}')
          if hint_block in updated:
              raise SystemExit('local DEFAULT_SELECTION_HINT declaration still present')
          if "if (moduleType === 'counter')" not in updated:
              raise SystemExit('surface callback changed unexpectedly')
          if 'selectedFabricGroupIds = new Set' not in updated:
              raise SystemExit('surface multi-selection callback changed unexpectedly')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Helper tests
        run: node --test test/selectionFeedback.test.js
      - name: Build
        run: npm run build
      - name: Commit step if changed
        shell: bash
        run: |
          if git diff --quiet -- src/main.js; then
            echo "No main.js change to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m "Import selection feedback helpers"
          git push origin HEAD:refactor/extract-selection-feedback
