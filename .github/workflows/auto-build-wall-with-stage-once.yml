name: Auto build wall with stage once
on:
  push:
    branches: [ROG]
    paths:
      - scripts/auto-build-wall-with-stage.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/auto-build-wall-with-stage.py
      - run: npm test
      - run: npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/main.js
          git commit -m "Build stand walls automatically with stage"
          git push
