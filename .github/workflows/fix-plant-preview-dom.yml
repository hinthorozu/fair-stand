name: Fix Plant Preview DOM

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-plant-preview-dom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix plant preview DOM
        run: |
          python3 -c "from pathlib import Path; p=Path('src/moduleDragSidebar.js'); t=p.read_text(encoding='utf-8'); old=\"  if (module.type === 'indoor-plant-1' || module.type === 'indoor-plant-2') {\\n    const plant = document.createElement('div');\\n    plant.className = `module-drag-plant module-drag-plant-\\${module.type === 'indoor-plant-1' ? '1' : '2'}`;\\n    ['pot', 'stem', 'leaf leaf-a', 'leaf leaf-b', 'leaf leaf-c', 'leaf leaf-d'].forEach((part) => {\\n      const element = document.createElement('i');\\n      element.className = `module-drag-plant-\\${part.replace(' ', ' module-drag-plant-')}`;\\n      plant.appendChild(element);\\n    });\\n    preview.appendChild(plant);\\n    return preview;\\n  }\\n\"; new=\"  if (module.type === 'indoor-plant-1' || module.type === 'indoor-plant-2') {\\n    const plant = document.createElement('div');\\n    const plantVariant = module.type === 'indoor-plant-1' ? '1' : '2';\\n    const leafCount = plantVariant === '1' ? 2 : 3;\\n    plant.className = `module-drag-plant module-drag-plant-\\${plantVariant}`;\\n\\n    ['pot', 'stem'].forEach((part) => {\\n      const element = document.createElement('i');\\n      element.className = `module-drag-plant-\\${part}`;\\n      plant.appendChild(element);\\n    });\\n\\n    ['a', 'b', 'c'].slice(0, leafCount).forEach((leafName) => {\\n      const leaf = document.createElement('i');\\n      leaf.className = `module-drag-plant-leaf leaf-\\${leafName}`;\\n      plant.appendChild(leaf);\\n    });\\n\\n    preview.appendChild(plant);\\n    return preview;\\n  }\\n\"; assert t.count(old)==1, f'anchor count={t.count(old)}'; p.write_text(t.replace(old,new,1),encoding='utf-8')"

      - name: Verify exact scope
        run: |
          grep -F "const leafCount = plantVariant === '1' ? 2 : 3;" src/moduleDragSidebar.js
          grep -F 'leaf.className = `module-drag-plant-leaf leaf-${leafName}`;' src/moduleDragSidebar.js
          if grep -F "part.replace(' ', ' module-drag-plant-')" src/moduleDragSidebar.js; then exit 1; fi
          git diff -- src/moduleDragSidebar.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-plant-preview-dom.yml
          git add src/moduleDragSidebar.js
          git commit -m 'fix: render exact plant catalog leaf counts [skip ci]'
          git push origin ROG
