name: Fix Plant Preview DOM

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-plant-preview-dom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix plant preview DOM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/moduleDragSidebar.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          anchor = "  if (module.type === 'indoor-plant-1' || module.type === 'indoor-plant-2') {"
          start = lines.index(anchor)
          old = lines[start:start + 11]
          assert old[-1] == '  }', old[-1]
          assert "part.replace(' ', ' module-drag-plant-')" in old[5], old[5]
          new = [
              "  if (module.type === 'indoor-plant-1' || module.type === 'indoor-plant-2') {",
              "    const plant = document.createElement('div');",
              "    const plantVariant = module.type === 'indoor-plant-1' ? '1' : '2';",
              "    const leafCount = plantVariant === '1' ? 2 : 3;",
              "    plant.className = `module-drag-plant module-drag-plant-${plantVariant}`;",
              "",
              "    ['pot', 'stem'].forEach((part) => {",
              "      const element = document.createElement('i');",
              "      element.className = `module-drag-plant-${part}`;",
              "      plant.appendChild(element);",
              "    });",
              "",
              "    ['a', 'b', 'c'].slice(0, leafCount).forEach((leafName) => {",
              "      const leaf = document.createElement('i');",
              "      leaf.className = `module-drag-plant-leaf leaf-${leafName}`;",
              "      plant.appendChild(leaf);",
              "    });",
              "",
              "    preview.appendChild(plant);",
              "    return preview;",
              "  }",
          ]
          lines[start:start + 11] = new
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Verify exact scope
        run: |
          grep -F "const leafCount = plantVariant === '1' ? 2 : 3;" src/moduleDragSidebar.js
          grep -F 'leaf.className = `module-drag-plant-leaf leaf-${leafName}`;' src/moduleDragSidebar.js
          if grep -F "part.replace(' ', ' module-drag-plant-')" src/moduleDragSidebar.js; then exit 1; fi
          git diff -- src/moduleDragSidebar.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-plant-preview-dom.yml
          git add src/moduleDragSidebar.js
          git commit -m 'fix: render exact plant catalog leaf counts [skip ci]'
          git push origin ROG
