name: Refine LED Floodlight

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/refine-led-floodlight.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refine-led-floodlight.mjs
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit changes
        run: |
          rm -f scripts/refine-led-floodlight.mjs .github/workflows/refine-led-floodlight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine LED floodlight geometry"
          git push origin ROG
