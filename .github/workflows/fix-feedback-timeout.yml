name: Fix Feedback Timeout

on:
  push:
    branches: [ROG]
    paths:
      - scripts/fix-feedback-timeout.mjs
      - .github/workflows/fix-feedback-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
      - name: Apply feedback timeout fix
        run: node scripts/fix-feedback-timeout.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js test/placementFeedback.test.js
          git diff --cached --quiet || git commit -m "Auto-dismiss placement feedback"
          git push origin ROG
