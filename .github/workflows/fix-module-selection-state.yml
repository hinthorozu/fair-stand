name: Fix Module Selection State

on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/fix-module-selection-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fix sticky module selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/scene3d.js')
          text = path.read_text(encoding='utf-8')
          frame_anchor = '    frame.userData.isModuleSelectionVisual = true;\n'
          frame_replacement = '    // Selection visuals are display-only and must never become pick targets.\n    frame.raycast = () => {};\n' + frame_anchor
          if text.count(frame_anchor) != 1:
              raise SystemExit(f'frame anchor count={text.count(frame_anchor)}')
          text = text.replace(frame_anchor, frame_replacement, 1)
          clear_anchor = '    selectedSurfaces.clear();\n    floorSelected = false;\n'
          clear_replacement = '    selectedSurfaces.clear();\n    selectedModuleId = null;\n    floorSelected = false;\n'
          if text.count(clear_anchor) != 1:
              raise SystemExit(f'clear anchor count={text.count(clear_anchor)}')
          text = text.replace(clear_anchor, clear_replacement, 1)
          early_assignment = '    if (moduleState) selectedModuleId = moduleState.id;\n'
          if text.count(early_assignment) != 1:
              raise SystemExit(f'early assignment count={text.count(early_assignment)}')
          text = text.replace(early_assignment, '', 1)
          path.write_text(text, encoding='utf-8')
          test = Path('test/moduleSelectionState.test.js')
          test.write_text("import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst scene = readFileSync(new URL('../src/scene3d.js', import.meta.url), 'utf8');\n\ntest('generic module selection frame never participates in raycast picking', () => {\n  assert.match(scene, /frame\\.raycast = \\(\\) => \\{\\};/);\n});\n\ntest('clearSelection clears selectedModuleId as part of the central contract', () => {\n  assert.match(scene, /function clearSelection[\\s\\S]*?selectedSurfaces\\.clear\\(\\);\\s*selectedModuleId = null;/);\n});\n\ntest('pointerdown waits for click resolution before changing selectedModuleId', () => {\n  assert.doesNotMatch(scene, /if \\(moduleState\\) selectedModuleId = moduleState\\.id;/);\n  assert.match(scene, /if \\(!wasDragging\\) \\{\\s*handleSurfaceSelectionAt\\(startClientX, startClientY, false, clickedModuleId\\);/);\n});\n", encoding='utf-8')
          PY

      - name: Verify exact scope
        run: |
          grep -F 'frame.raycast = () => {};' src/scene3d.js
          grep -F 'selectedModuleId = null;' src/scene3d.js
          if grep -F 'if (moduleState) selectedModuleId = moduleState.id;' src/scene3d.js; then exit 1; fi
          git diff -- src/scene3d.js test/moduleSelectionState.test.js

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-module-selection-state.yml
          git add src/scene3d.js test/moduleSelectionState.test.js
          git commit -m 'fix: prevent sticky multi-module selection [skip ci]'
          git push origin ROG
