name: Fix Bar Stool Default Front
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-bar-stool-default-front.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix-bar-stool-default-front.py
      - run: node --check src/moduleDragSidebar.js
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          grep -n "activeRotationZDeg = state.type === 'bar-stool' ? 90 : 0" src/moduleDragSidebar.js
          grep -n "rotationZDeg: moduleState.type === 'bar-stool' ? 90 : 0" src/main.js
      - run: rm -f .github/scripts/fix-bar-stool-default-front.py .github/workflows/fix-bar-stool-default-front.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: make bar stool face forward by default [skip ci]'
          branch: ROG
