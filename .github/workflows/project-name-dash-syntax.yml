name: Project Name Dash Syntax
on:
  push:
    branches: [ROG]
    paths:
      - '.github/scripts/project-name-dash-syntax.cjs'
      - '.github/workflows/project-name-dash-syntax.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/project-name-dash-syntax.cjs
      - run: node --check src/main.js
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/workflows/project-name-dash-syntax.yml .github/scripts/project-name-dash-syntax.cjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use dash-separated automatic project names'
          git push origin ROG
