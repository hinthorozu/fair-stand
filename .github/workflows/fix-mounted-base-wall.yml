name: Retire obsolete patch workflow

on:
  push:
    branches: [ROG]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ROG
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fix L counter return label
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/main.js';
          let text = fs.readFileSync(path, 'utf8');
          const from = `        const faceLabel = surface.userData.surfaceRole === 'front'\n          ? 'ön'\n          : (surface.userData.surfaceRole === 'left' ? 'sol yan' : 'sağ yan');`;
          const to = `        const faceLabel = surface.userData.surfaceRole === 'front'\n          ? 'ön'\n          : (surface.userData.surfaceRole === 'left'\n            ? 'sol yan'\n            : (surface.userData.surfaceRole === 'return' ? 'L dönüş' : 'sağ yan'));`;
          if (!text.includes(from)) throw new Error('Counter face label block not found');
          text = text.replace(from, to);
          fs.writeFileSync(path, text);
          NODE

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove obsolete workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-mounted-base-wall.yml
          git add src/main.js
          git commit -m "fix: label L counter return face and remove obsolete workflow [skip ci]"
          git push origin ROG
