name: Set Loveseat Minus45
on:
  push:
    branches: [ROG]
    paths:
      - '.github/workflows/set-loveseat-minus45.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/set-loveseat-minus45.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm -f .github/scripts/set-loveseat-minus45.py .github/workflows/set-loveseat-minus45.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'fix: set beige loveseat rotation to -45 [skip ci]'
          branch: ROG
