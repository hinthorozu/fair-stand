name: Fix Beige Mesh Render
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-beige-mesh-render.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix indexed mesh reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/scene3d.js')
          s=p.read_text()
          pattern=re.compile(r"(?P<i>\s*)const geometry = new THREE\.BufferGeometry\(\);\s*geometry\.setAttribute\('position', new THREE\.BufferAttribute\(positions, 3\)\);\s*geometry\.setIndex\([^;]+;\s*geometry\.computeVertexNormals\(\);")
          m=pattern.search(s)
          if not m: raise SystemExit('indexed beige geometry block not found')
          i=m.group('i')
          new=f"""{i}const expandedPositions = new Float32Array(indices.length * 3);\n{i}for (let i = 0; i < indices.length; i += 1) {{\n{i}  const sourceIndex = indices[i] * 3;\n{i}  const targetIndex = i * 3;\n{i}  expandedPositions[targetIndex] = positions[sourceIndex];\n{i}  expandedPositions[targetIndex + 1] = positions[sourceIndex + 1];\n{i}  expandedPositions[targetIndex + 2] = positions[sourceIndex + 2];\n{i}}}\n{i}const geometry = new THREE.BufferGeometry();\n{i}geometry.setAttribute('position', new THREE.BufferAttribute(expandedPositions, 3));\n{i}geometry.computeVertexNormals();"""
          p.write_text(s[:m.start()]+new+s[m.end():])
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git commit -m "fix: render extracted beige sofa topology correctly [skip ci]"
          git push origin ROG