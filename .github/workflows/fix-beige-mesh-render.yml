name: Fix Beige Mesh Render
on:
  push:
    branches: [ROG]
    paths: ['.github/workflows/fix-beige-mesh-render.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix indexed mesh reconstruction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/scene3d.js')
          s=p.read_text()
          old="""                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                geometry.computeVertexNormals();"""
          new="""                // Expand indexed source triangles explicitly. This keeps the extracted
                // source topology intact and avoids the corrupted indexed rendering seen in WebGL.
                const expandedPositions = new Float32Array(indices.length * 3);
                for (let i = 0; i < indices.length; i += 1) {
                  const sourceIndex = indices[i] * 3;
                  const targetIndex = i * 3;
                  expandedPositions[targetIndex] = positions[sourceIndex];
                  expandedPositions[targetIndex + 1] = positions[sourceIndex + 1];
                  expandedPositions[targetIndex + 2] = positions[sourceIndex + 2];
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(expandedPositions, 3));
                geometry.computeVertexNormals();"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scene3d.js
          git commit -m "fix: render extracted beige sofa topology correctly [skip ci]"
          git push origin ROG