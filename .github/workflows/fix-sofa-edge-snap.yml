name: Fix Sofa Edge Snap

on:
  push:
    branches: [ROG]
    paths:
      - scripts/fix-sofa-edge-snap.mjs
      - .github/workflows/fix-sofa-edge-snap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ROG
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/fix-sofa-edge-snap.mjs
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modulePlacement.js test/sofaSet.test.js
          git diff --cached --quiet || git commit -m "Fix sofa corner edge snapping"
          git push origin ROG
